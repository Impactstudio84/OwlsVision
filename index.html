<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Owls Vision — Location JVN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root{
    --bg:#050605;
    --bg-glow: radial-gradient(1100px 620px at 18% -8%, rgba(143,239,61,0.07), transparent 62%);
    --surface: rgba(255,255,255,0.045);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.06);
    --accent:#8FEF3D;
    --accent-2:#5FDE8A;
    --accent-ink:#07130A;
    --accent-soft: rgba(143,239,61,0.14);
    --accent-soft-2: rgba(143,239,61,0.28);
    --text:#F4F7F1;
    --text-dim: rgba(244,247,241,0.62);
    --text-faint: rgba(244,247,241,0.38);
    --danger:#FF6B57;
    --danger-soft: rgba(255,107,87,0.14);
    --amber:#FFD166;
    --amber-soft: rgba(255,209,102,0.14);
    --r-sm:14px;
    --r-md:20px;
    --r-lg:28px;
    --r-pill:999px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-2: 0 10px 30px -8px rgba(0,0,0,0.55);
    --shadow-glow: 0 8px 24px -6px rgba(143,239,61,0.25);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-glow), var(--bg);
    background-attachment: fixed;
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ letter-spacing:-0.02em; margin:0; }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{min-height:100vh;}
  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background: radial-gradient(900px 560px at 50% 8%, rgba(143,239,61,0.10), transparent 65%), var(--bg);
  }
  .gate-card{
    width:100%;max-width:400px;background: var(--surface);border:1px solid var(--border);
    border-radius: var(--r-lg);padding:36px 32px;backdrop-filter: blur(24px);-webkit-backdrop-filter: blur(24px);
    box-shadow: var(--shadow-2);
  }
  .gate-brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px;}
  .gate-brand img{width:84px;height:84px;border-radius:26px;box-shadow: 0 0 0 1px var(--border), var(--shadow-glow);}
  .gate-brand .brand-name{font-size:26px;font-weight:700;color:var(--text);text-align:center;letter-spacing:-0.03em;}
  .gate-brand .brand-name span{color:var(--accent);}
  .gate-brand .brand-tag{font-size:12.5px;color:var(--text-faint);font-weight:500;text-align:center;}
  .tabs{display:flex;background: rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius: var(--r-pill);padding:4px;margin-bottom:22px;gap:2px;}
  .tabs button{flex:1;padding:10px 0;background:transparent;border:none;color:var(--text-dim);font-size:14px;font-weight:600;border-radius: var(--r-pill);transition: all .25s var(--ease);}
  .tabs button.active{color:var(--accent-ink);background:var(--accent);box-shadow: var(--shadow-glow);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-faint);margin-bottom:7px;font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%;background: rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);
    padding:13px 15px;border-radius: var(--r-sm);font-size:14.5px;outline:none;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--accent-soft-2); box-shadow: 0 0 0 4px var(--accent-soft); }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius: var(--r-pill);
    border:1px solid transparent;font-size:14.5px;font-weight:600;
    transition: transform .12s var(--ease), filter .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;box-shadow: var(--shadow-glow);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:rgba(255,255,255,0.055);border-color:var(--border-soft);color:var(--text-dim);}
  .btn-ghost:hover{background:rgba(255,255,255,0.09);color:var(--text);}
  .btn-danger{background:var(--danger-soft);border-color:transparent;color:#FFB3A6;}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .msg{font-size:13.5px;padding:12px 15px;border-radius: var(--r-sm);margin-bottom:16px;font-weight:500;}
  .msg-error{background:var(--danger-soft);border:1px solid rgba(255,107,87,0.25);color:#FFB3A6;}
  .msg-ok{background:var(--accent-soft);border:1px solid var(--accent-soft-2);color:var(--accent);}

  .shell{display:flex;min-height:100vh;gap:16px;padding:16px;}
  .sidebar{
    width:246px;flex-shrink:0;background: var(--surface);border:1px solid var(--border);border-radius: var(--r-lg);
    display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);
    backdrop-filter: blur(24px);-webkit-backdrop-filter: blur(24px);box-shadow: var(--shadow-1);overflow:hidden;
  }
  .side-brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid var(--border-soft);}
  .side-brand img{width:40px;height:40px;border-radius:12px;}
  .side-brand .name{font-size:16px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;}
  .side-brand .name span{color:var(--accent);}
  .side-brand .sub{font-size:10.5px;color:var(--text-faint);font-weight:500;}
  .nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
  .nav button{
    display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--text-dim);
    padding:11px 14px;border-radius: var(--r-sm);font-size:14px;text-align:left;font-weight:500;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .nav button svg{width:18px;height:18px;flex-shrink:0;opacity:0.85;}
  .nav button:hover{background:rgba(255,255,255,0.05);color:var(--text);}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav button.active svg{opacity:1;}
  .side-foot{padding:16px;border-top:1px solid var(--border-soft);}
  .side-user{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .avatar{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;}
  .side-user .u-name{font-size:13.5px;font-weight:600;}
  .side-user .u-rank{font-size:11.5px;color:var(--text-faint);}

  .main{flex:1;min-width:0;padding:12px 20px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .topbar h1{font-size:28px;font-weight:700;}
  .topbar .desc{color:var(--text-dim);font-size:14.5px;margin-top:6px;max-width:480px;line-height:1.5;}

  .xp-card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:18px 20px;min-width:270px;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);}
  .xp-card .xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .xp-card .xp-rank{font-size:14px;font-weight:700;color:var(--accent);}
  .xp-card .xp-num{font-size:12px;color:var(--text-faint);font-weight:500;}
  .xp-bar-track{height:10px;background:rgba(255,255,255,0.06);border-radius:var(--r-pill);overflow:hidden;position:relative;}
  .xp-bar-fill{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg, var(--accent-2), var(--accent));transition:width .8s var(--ease);position:relative;overflow:hidden;}
  .xp-bar-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.35) 40%, transparent 60%);
    background-size:200% 100%;animation: shimmer 2.8s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{background-position:160% 0;} 100%{background-position:-60% 0;} }

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(272px,1fr));gap:18px;}
  .card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;display:flex;flex-direction:column;gap:12px;transition: transform .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);}
  .card:hover{background:var(--surface-hover);transform:translateY(-3px);box-shadow:var(--shadow-2);}
  .card h3{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .card .card-desc{font-size:13.5px;color:var(--text-dim);line-height:1.55;flex:1;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:var(--r-pill);width:fit-content;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--border-soft);}
  .qty-pill{font-size:12px;color:var(--text-faint);font-weight:500;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;padding:12px 14px;color:var(--text-faint);font-weight:600;font-size:12px;border-bottom:1px solid var(--border-soft);}
  td{padding:14px;border-bottom:1px solid var(--border-soft);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .panel{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);}
  .panel + .panel{margin-top:18px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  .empty{padding:36px 20px;text-align:center;color:var(--text-faint);border:1.5px dashed var(--border);border-radius: var(--r-md);font-size:14px;font-weight:500;}
  .task-item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--border);border-radius: var(--r-md);background: var(--surface);transition: background .2s var(--ease);flex-wrap:wrap;}
  .task-item:hover{background:var(--surface-hover);}
  .task-item.done{opacity:0.55;}
  .task-item .t-title{font-weight:600;font-size:15px;}
  .task-item .t-desc{font-size:13px;color:var(--text-dim);margin-top:4px;}
  .task-xp{font-size:12.5px;color:var(--accent);font-weight:600;background:var(--accent-soft);padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap;}
  .submission-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-dim);padding:8px 0;border-top:1px solid var(--border-soft);}
  .modal-bg{position:fixed;inset:0;background:rgba(3,5,3,0.6);backdrop-filter: blur(6px);-webkit-backdrop-filter: blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background: #0E100E;border:1px solid var(--border);border-radius: var(--r-lg);width:100%;max-width:430px;padding:26px;box-shadow: var(--shadow-2);max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:19px;margin-bottom:16px;font-weight:700;letter-spacing:-0.01em;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .section-title{font-size:13px;color:var(--text-faint);margin-bottom:14px;font-weight:600;}
  .hamburger{display:none;}
  .mobile-topbar{display:none;}

  /* ---------- Hero XP (accueil) ---------- */
  .hero-wrap{display:flex;justify-content:center;margin-bottom:6px;}
  .xp-hero{
    width:100%;max-width:440px;text-align:center;padding:34px 28px;border-radius:var(--r-lg);
    background: radial-gradient(120% 140% at 50% -10%, rgba(143,239,61,0.14), transparent 60%), var(--surface);
    border:1px solid var(--border);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    animation: heroGlow 4s ease-in-out infinite;
  }
  @keyframes heroGlow{ 0%,100%{ box-shadow: 0 0 0 0 rgba(143,239,61,0);} 50%{ box-shadow: 0 0 44px 6px rgba(143,239,61,0.10);} }
  .xp-hero-owl{font-size:40px;margin-bottom:8px;filter: drop-shadow(0 0 14px rgba(143,239,61,0.45));}
  .xp-hero-rank{font-size:23px;font-weight:800;letter-spacing:-0.02em;}
  .xp-hero-level{font-size:13.5px;color:var(--accent);font-weight:700;margin:5px 0 20px;}
  .xp-bar-track-lg{height:16px;}
  .xp-hero-num{font-size:12.5px;color:var(--text-faint);margin-top:12px;font-weight:500;}

  .levelup-toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:12px;
    background: rgba(14,16,14,0.94);border:1px solid var(--accent-soft-2);border-radius: var(--r-pill);padding:12px 24px 12px 16px;
    box-shadow: var(--shadow-glow);transition: transform .35s var(--ease), opacity .35s var(--ease);z-index:100;backdrop-filter:blur(16px);
  }
  .levelup-toast.show{transform:translate(-50%,0);opacity:1;}
  .levelup-badge{font-size:24px;}
  .levelup-title{font-weight:800;color:var(--accent);font-size:14.5px;}
  .levelup-sub{font-size:12px;color:var(--text-dim);}

  /* ---------- Fullscreen signature modal ---------- */
  .modal-full{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;}
  .modal-full-bar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:1px solid var(--border-soft);background: rgba(5,6,5,0.9);backdrop-filter:blur(14px);z-index:2;}
  .modal-full-back{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:var(--text);}
  .modal-full-title{font-weight:700;font-size:15.5px;}
  .modal-full-body{flex:1;overflow-y:auto;padding:20px 18px calc(48px + env(safe-area-inset-bottom));}
  .sig-pad-wrap{border:1.5px dashed var(--border);border-radius:var(--r-md);background:rgba(255,255,255,0.03);overflow:hidden;margin-bottom:12px;}
  #sig-canvas{width:100%;height:220px;display:block;touch-action:none;}
  .check-row{display:flex;align-items:flex-start;gap:10px;margin:18px 0;font-size:13.5px;color:var(--text-dim);line-height:1.4;}
  .check-row input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);}
  .status-pill.ok{background:var(--accent-soft);color:var(--accent);}
  .status-pill.pending{background: var(--amber-soft);color:var(--amber);}
  .status-pill.none{background:rgba(255,255,255,0.06);color:var(--text-faint);}
  .file-btn{position:relative;overflow:hidden;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .checkbox-field{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-dim);margin:4px 0 16px;}
  .checkbox-field input{width:18px;height:18px;accent-color:var(--accent);}

  @media (max-width: 860px){
    .shell{padding:0;gap:0;}
    .sidebar{position:fixed;left:16px;top:16px;bottom:16px;height:auto;z-index:40;transform:translateX(-120%);transition:transform .28s var(--ease);}
    .sidebar.open{transform:translateX(0);}
    .main{padding:16px 16px 50px;}
    .mobile-topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
    .hamburger{display:flex;width:38px;height:38px;border:1px solid var(--border);border-radius: var(--r-sm);background:var(--surface);align-items:center;justify-content:center;flex-shrink:0;}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:39;}
    .topbar{flex-direction:column;}
    .xp-card{width:100%;min-width:0;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   OWLS VISION — backend Supabase
   ⚠️ Renseigne ton URL de projet et ta clé "anon" ci-dessous
   (Supabase > Project Settings > API)
   ========================================================= */
const SUPABASE_URL = "https://zopnuziuhmnkezyisoex.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_EJtogFic_Yu5eO9n1u2s0Q_LH4KbTVe";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const RANKS = [
  {min:0,   name:"Recrue"},
  {min:150, name:"Éclaireur"},
  {min:400, name:"Sentinelle"},
  {min:800, name:"Vigie de nuit"},
  {min:1400,name:"Rapace"},
  {min:2200,name:"Chouette d'élite"},
];
const XP_STEP = 150;
function rankFor(xp){ let r = RANKS[0]; for(const c of RANKS){ if(xp >= c.min) r = c; } return r.name; }
function levelFor(xp){ return Math.floor(xp / XP_STEP) + 1; }
function xpInLevel(xp){ return xp % XP_STEP; }
const todayStr = () => new Date().toISOString().slice(0,10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('fr-FR') : '—';
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('fr-FR') : 'Jamais connecté';

let state = {
  loading: true,
  fatalError: null,
  session: null, // {username, isMaster}
  profiles: [], items: [], bookings: [], tasks: [], completions: [], contracts: [],
  view: "accueil",
  authTab: "login",
  authError: "",
  sidebarOpen: false,
  modal: null,
  bookingError: "",
  answerError: "",
};

function currentProfile(){ return state.profiles.find(p => p.username === state.session?.username) || null; }

/* ---------- Boot & data ---------- */
async function fetchAll(){
  const [profiles, items, bookings, tasks, completions, contracts] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('items').select('*').order('created_at'),
    sb.from('bookings').select('*'),
    sb.from('tasks').select('*').order('created_at'),
    sb.from('task_completions').select('*'),
    sb.from('contracts').select('*'),
  ]);
  state.profiles = profiles.data || [];
  state.items = items.data || [];
  state.bookings = bookings.data || [];
  state.tasks = tasks.data || [];
  state.completions = completions.data || [];
  state.contracts = contracts.data || [];
}

async function boot(){
  if(SUPABASE_URL.includes("VOTRE-PROJET")){
    state.loading = false;
    state.fatalError = "Configuration Supabase manquante : ouvre le fichier et renseigne SUPABASE_URL et SUPABASE_ANON_KEY en haut du script.";
    render();
    return;
  }
  try{
    await fetchAll();
  }catch(e){
    state.loading = false;
    state.fatalError = "Impossible de contacter Supabase. Vérifie ton URL/clé et que le script SQL a bien été exécuté. (" + e.message + ")";
    render();
    return;
  }
  const saved = localStorage.getItem('ov_session');
  if(saved){
    try{
      const parsed = JSON.parse(saved);
      const stillExists = state.profiles.find(p => p.username === parsed.username);
      if(stillExists){ state.session = { username: stillExists.username, isMaster: stillExists.is_master }; }
      else localStorage.removeItem('ov_session');
    }catch(e){ localStorage.removeItem('ov_session'); }
  }
  state.loading = false;
  state.view = state.session?.isMaster ? "utilisateurs" : "accueil";
  render();
}

/* ---------- Auth ---------- */
async function doLogin(username, password){
  username = username.trim();
  const match = state.profiles.find(p => p.username.toLowerCase() === username.toLowerCase() && p.password === password);
  if(!match){ state.authError = "Identifiant ou mot de passe incorrect."; render(); return; }
  const now = new Date().toISOString();
  await sb.from('profiles').update({ last_login: now }).eq('username', match.username);
  match.last_login = now;
  state.session = { username: match.username, isMaster: match.is_master };
  localStorage.setItem('ov_session', JSON.stringify(state.session));
  state.authError = "";
  state.view = match.is_master ? "utilisateurs" : "accueil";
  render();
}

async function doRegister(username, password, password2){
  username = username.trim();
  if(username.length < 3){ state.authError = "Le pseudo doit faire au moins 3 caractères."; render(); return; }
  if(password.length < 4){ state.authError = "Le mot de passe doit faire au moins 4 caractères."; render(); return; }
  if(password !== password2){ state.authError = "Les mots de passe ne correspondent pas."; render(); return; }
  if(state.profiles.some(p => p.username.toLowerCase() === username.toLowerCase())){ state.authError = "Ce pseudo est déjà pris."; render(); return; }
  const now = new Date().toISOString();
  const { data, error } = await sb.from('profiles').insert({ username, password, is_master:false, xp:0, last_login: now }).select().single();
  if(error){ state.authError = "Erreur lors de la création du compte : " + error.message; render(); return; }
  state.profiles.push(data);
  state.session = { username: data.username, isMaster:false };
  localStorage.setItem('ov_session', JSON.stringify(state.session));
  state.authError = "";
  state.view = "accueil";
  render();
}

function logout(){
  state.session = null;
  localStorage.removeItem('ov_session');
  state.view = "accueil";
  render();
}

/* ---------- Level up feedback ---------- */
function checkLevelUp(oldXp, newXp){
  if(levelFor(newXp) > levelFor(oldXp)) showLevelUpToast(levelFor(newXp), rankFor(newXp));
}
function showLevelUpToast(level, rank){
  const el = document.createElement('div');
  el.className = 'levelup-toast';
  el.innerHTML = `<div class="levelup-badge">🦉</div><div><div class="levelup-title">Niveau ${level} !</div><div class="levelup-sub">${esc(rank)}</div></div>`;

  requestAnimationFrame(() => el.classList.add('show'));

async function grantXp(username, amount){
  const prof = state.profiles.find(p => p.username === username);
  if(!prof) return;
  const oldXp = prof.xp;
  const newXp = oldXp + amount;
  await sb.from('profiles').update({ xp: newXp }).eq('username', username);
  prof.xp = newXp;
  if(username === state.session?.username) checkLevelUp(oldXp, newXp);
}

/* ---------- Bookings ---------- */
function overlaps(aStart, aEnd, bStart, bEnd){ return aStart <= bEnd && bStart <= aEnd; }
function activeBookingsCount(itemId, start, end){
  return state.bookings.filter(b => b.item_id === itemId && overlaps(b.start_date, b.end_date, start, end)).length;
}
async function submitBooking(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return;
  if(!start || !end || start > end){ state.bookingError = "Merci de choisir une période valide."; render(); return; }
  if(start < todayStr()){ state.bookingError = "La date de début ne peut pas être dans le passé."; render(); return; }
  if(activeBookingsCount(itemId, start, end) >= item.qty){
    state.bookingError = `Aucun exemplaire disponible sur cette période (${item.qty} en stock).`; render(); return;
  }
  const { data, error } = await sb.from('bookings').insert({ item_id: itemId, username: state.session.username, start_date: start, end_date: end }).select().single();
  if(error){ state.bookingError = "Erreur : " + error.message; render(); return; }
  state.bookings.push(data);
  await grantXp(state.session.username, item.xp_value);
  state.bookingError = "";
  state.modal = null;
  render();
}
async function cancelBooking(id){
  const b = state.bookings.find(x => x.id === id);
  if(!b) return;
  if(b.username !== state.session.username && !state.session.isMaster) return;
  await sb.from('bookings').delete().eq('id', id);
  state.bookings = state.bookings.filter(x => x.id !== id);
  render();
}

let sigCtx = null, sigDrawing = false, sigHasInk = false;
function openSignaturePad(){
  const contract = state.contracts.find(c => c.username === state.session.username);
  if(!contract) return;
  const wrap = document.createElement('div');
  wrap.className = 'modal-full';
  wrap.id = 'sig-modal';
  wrap.innerHTML = `
    <div class="modal-full-bar">
      <button class="modal-full-back" onclick="closeSignaturePad()">←</button>
      <div class="modal-full-title">Signer mon contrat</div>
    </div>
    <div class="modal-full-body">
      <p style="color:var(--text-dim);font-size:13.5px;line-height:1.6;margin-bottom:16px;">
        Ouvrez d'abord le contrat pour le lire attentivement, puis signez ci-dessous avec le doigt ou la souris.
      </p>
      <a class="btn btn-ghost" style="margin-bottom:20px;width:100%;" href="${contract.pdf_path}" target="_blank" rel="noopener">📄 Ouvrir le contrat (PDF)</a>
      <div class="section-title">Votre signature</div>
      <div class="sig-pad-wrap"><canvas id="sig-canvas"></canvas></div>
      <button class="btn btn-ghost btn-sm" onclick="clearSignature()">Effacer la signature</button>
      <label class="check-row"><input type="checkbox" id="sig-accept"> J'ai lu ce contrat et j'en accepte les termes.</label>
      <div id="sig-error"></div>
      <button class="btn btn-primary" onclick="submitSignature()" style="width:100%;margin-top:4px;">Valider et signer</button>
      <button class="btn btn-ghost" onclick="closeSignaturePad()" style="width:100%;margin-top:10px;">Retour</button>
    </div>
  `;
  document.body.appendChild(wrap);
  initSignaturePad();
}
window.closeSignaturePad = () => { const el = document.getElementById('sig-modal'); if(el) el.remove(); };
function initSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.4;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#F4F7F1';
  sigHasInk = false;
  const pos = (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
  const start = (e) => { e.preventDefault(); sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  const move = (e) => { if(!sigDrawing) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHasInk = true; };
  const end = () => { sigDrawing = false; };
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
}
window.clearSignature = () => {
  const c = document.getElementById('sig-canvas'); if(!c) return;
  const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); sigHasInk = false;
};
async function submitSignature(){
  const errEl = document.getElementById('sig-error');
  const accept = document.getElementById('sig-accept');
  if(!sigHasInk){ errEl.innerHTML = `<div class="msg msg-error">Merci de dessiner votre signature.</div>`; return; }
  if(!accept.checked){ errEl.innerHTML = `<div class="msg msg-error">Merci de cocher la case d'acceptation.</div>`; return; }
  errEl.innerHTML = "";
  const btn = event.target; const oldLabel = btn.textContent; btn.textContent = "Signature en cours..."; btn.disabled = true;
  try{
    const canvas = document.getElementById('sig-canvas');
    const dataUrl = canvas.toDataURL('image/png');
    const contract = state.contracts.find(c => c.username === state.session.username);
    const resp = await fetch(contract.pdf_path);
    const bytes = await resp.arrayBuffer();
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.load(bytes);
    const pngImage = await pdfDoc.embedPng(dataUrl);
    const pages = pdfDoc.getPages();
    const lastPage = pages[pages.length - 1];
    const { width } = lastPage.getSize();
    const dims = pngImage.scale(0.35);
    lastPage.drawImage(pngImage, { x: width - dims.width - 50, y: 60, width: dims.width, height: dims.height });
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    lastPage.drawText(`Signe electroniquement par ${state.session.username} le ${new Date().toLocaleDateString('fr-FR')}`, { x: 50, y: 40, size: 9, font, color: rgb(0.55,0.55,0.55) });
    const signedBytes = await pdfDoc.save();
    const blob = new Blob([signedBytes], { type: 'application/pdf' });
    const signedPath = `${state.session.username}/signed_${Date.now()}.pdf`;
    const { error: upErr } = await sb.storage.from('contracts').upload(signedPath, blob, { upsert: true, contentType: 'application/pdf' });
    if(upErr) throw upErr;
    const { data: pub } = sb.storage.from('contracts').getPublicUrl(signedPath);
    const { data, error } = await sb.from('contracts').update({ signed_pdf_path: pub.publicUrl, signed_at: new Date().toISOString() }).eq('username', state.session.username).select().single();
    if(error) throw error;
    const idx = state.contracts.findIndex(c => c.username === state.session.username);
    state.contracts[idx] = data;
    const dlUrl = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = dlUrl; a.download = `contrat-signe-${state.session.username}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    closeSignaturePad();
    render();
  }catch(e){
    errEl.innerHTML = `<div class="msg msg-error">Erreur lors de la signature : ${esc(e.message||String(e))}</div>`;
    btn.textContent = oldLabel; btn.disabled = false;
  }
}
window.handleContractUpload = (e, username) => {
  const file = e.target.files[0];
  if(!file) return;
  if(file.type !== 'application/pdf'){ alert("Merci de sélectionner un fichier PDF."); return; }
  masterUploadContract(username, file);
};

  const isMaster = u.is_master;
  const source = isMaster ? state.bookings : state.bookings.filter(b => b.username === u.username);
  const sorted = [...source].sort((a,b) => a.start_date.localeCompare(b.start_date));
  const rows = sorted.map(b => {
    const item = state.items.find(i => i.id === b.item_id);
    const mine = b.username === u.username;
    return `
      <tr>
        <td>${esc(item?.name || "Matériel supprimé")}</td>
        ${isMaster ? `<td>${esc(b.username)}${mine?' <span style="color:var(--accent);font-size:11px">(vous)</span>':''}</td>` : ''}
        <td>${fmtDate(b.start_date)}</td>
        <td>${fmtDate(b.end_date)}</td>
        <td>${(mine||isMaster) ? `<button class="btn btn-ghost btn-sm" onclick="cancelBooking('${b.id}')">Annuler</button>` : '—'}</td>
      </tr>`;
  }).join("");
  return `
    <div class="topbar">
      <div><h1>${isMaster?'Planning global':'Mes réservations'}</h1><div class="desc">${isMaster ? "Vue d'ensemble de toutes les locations de tous les clients." : "Vos locations à venir et passées. Visibles par vous seul et le compte maître."}</div></div>
      ${xpBarHtml(u)}
    </div>
    <div class="panel">
      ${sorted.length ? `<table><thead><tr><th>Matériel</th>${isMaster?'<th>Client</th>':''}<th>Début</th><th>Fin</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">${isMaster ? "Aucune réservation planifiée." : "Vous n'avez aucune réservation. Direction le catalogue !"}</div>`}
    </div>
  `;
}

/* ---------- Missions ---------- */
function renderMissions(){
  const u = currentProfile();
  const isMaster = u.is_master;
  const items = state.tasks.slice().sort((a,b) => b.created_at.localeCompare(a.created_at));
  const rows = items.map(t => {
    const done = !isMaster && hasCompleted(t.id, u.username);
    const submissions = isMaster ? state.completions.filter(c => c.task_id === t.id) : [];
    return `
    <div class="task-item ${done?'done':''}">
      <div style="flex:1;min-width:200px;">
        <div class="t-title">${esc(t.title)}</div>
        ${t.description ? `<div class="t-desc">${esc(t.description)}</div>` : ''}
        ${done ? `<div class="t-desc">Mission accomplie ✓</div>` : ''}
        ${isMaster && t.requires_answer ? `<div class="t-desc">Champ demandé : ${esc(t.answer_label)}</div>` : ''}
        ${isMaster && submissions.length ? submissions.map(s => `<div class="submission-row"><span>${esc(s.username)}${t.requires_answer ? ' — ' + esc(s.answer||'') : ''}</span><span>${fmtDate(s.completed_at)}</span></div>`).join("") : ''}
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="task-xp">+${t.xp_reward} XP</span>
        ${(!isMaster && !done) ? (t.requires_answer ? `<button class="btn btn-primary btn-sm" onclick="openAnswerModal('${t.id}')">Compléter</button>` : `<button class="btn btn-primary btn-sm" onclick="completeTask('${t.id}')">Marquer accomplie</button>`) : ''}
        ${isMaster ? `<button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">Suppr.</button>` : ''}
      </div>
    </div>`;
  }).join("");
  return `
    <div class="topbar">
      <div><h1>Missions</h1><div class="desc">${isMaster ? "Créez des missions et suivez qui les a accomplies (et leurs réponses)." : "Missions créées par le compte maître. Elles ne peuvent être supprimées que par lui."}</div></div>
      ${xpBarHtml(u)}
    </div>
    ${isMaster ? `<button class="btn btn-primary btn-sm" style="width:auto;margin-bottom:18px;" onclick="openNewTaskModal()">+ Créer une mission</button>` : ''}
    <div style="display:flex;flex-direction:column;gap:10px;">${items.length ? rows : `<div class="empty">Aucune mission disponible pour le moment.</div>`}</div>
  `;
}

/* ---------- Utilisateurs (master) ---------- */
function renderUtilisateurs(){
  const rows = state.profiles.slice().sort((a,b) => b.xp - a.xp).map(p => `
    <tr>
      <td>${esc(p.username)}${p.is_master?' 👑':''}</td>
      <td>${p.is_master ? '—' : `${p.xp} XP · Niv. ${levelFor(p.xp)}`}</td>
      <td>${fmtDate(p.created_at)}</td>
      <td>${fmtDateTime(p.last_login)}</td>
      <td>${!p.is_master ? `<button class="btn btn-danger btn-sm" onclick="deleteProfile('${p.username}')">Supprimer</button>` : ''}</td>
    </tr>`).join("");
  return `
    <div class="topbar"><div><h1>Utilisateurs</h1><div class="desc">Tous les comptes Owls Vision, leur XP et leur dernière connexion.</div></div></div>
    <div class="panel"><table><thead><tr><th>Compte</th><th>XP</th><th>Inscrit le</th><th>Dernière connexion</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  `;
}

/* ---------- Contrats (master) ---------- */
function renderContratsAdmin(){
  const clients = state.profiles.filter(p => !p.is_master);
  const rows = clients.map(usr => {
    const c = state.contracts.find(x => x.username === usr.username);
    let pill = `<span class="status-pill none">Aucun contrat</span>`;
    if(c && c.signed_at) pill = `<span class="status-pill ok">Signé le ${fmtDate(c.signed_at)}</span>`;
    else if(c) pill = `<span class="status-pill pending">En attente de signature</span>`;
    return `
      <div class="task-item">
        <div><div class="t-title">${esc(usr.username)}</div><div class="t-desc">${pill}</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${c ? `<a class="btn btn-ghost btn-sm" href="${c.pdf_path}" target="_blank" rel="noopener">Original</a>` : ''}
          ${c && c.signed_pdf_path ? `<a class="btn btn-ghost btn-sm" href="${c.signed_pdf_path}" target="_blank" rel="noopener">Signé</a>` : ''}
          <span class="btn btn-primary btn-sm file-btn">${c?'Remplacer':'Uploader'} PDF<input type="file" accept="application/pdf" onchange="handleContractUpload(event,'${usr.username}')"></span>
        </div>
      </div>`;
  }).join("");
  return `
    <div class="topbar"><div><h1>Contrats</h1><div class="desc">Ajoutez un contrat PDF par client. Il pourra le consulter et le signer depuis son mobile.</div></div></div>
    <div style="display:flex;flex-direction:column;gap:10px;">${clients.length ? rows : `<div class="empty">Aucun client enregistré.</div>`}</div>
  `;
}

/* ---------- Mon contrat (client) ---------- */
function renderContratClient(){
  const u = currentProfile();
  const c = state.contracts.find(x => x.username === u.username);
  return `
    <div class="topbar"><div><h1>Mon contrat</h1><div class="desc">Consultez et signez votre contrat directement depuis votre mobile.</div></div>${xpBarHtml(u)}</div>
    <div class="panel">
      ${!c ? `<div class="empty">Le compte maître ne vous a pas encore transmis de contrat.</div>` : `
        <div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start;">
          ${c.signed_at ? `<span class="status-pill ok">Signé le ${fmtDate(c.signed_at)}</span>` : `<span class="status-pill pending">En attente de votre signature</span>`}
          <a class="btn btn-ghost" style="width:100%;" href="${c.pdf_path}" target="_blank" rel="noopener">📄 Ouvrir le contrat (PDF)</a>
          ${c.signed_pdf_path ? `<a class="btn btn-ghost" style="width:100%;" href="${c.signed_pdf_path}" target="_blank" rel="noopener">⬇️ Télécharger mon contrat signé</a>` : ''}
          ${!c.signed_at ? `<button class="btn btn-primary" style="width:100%;" onclick="openSignaturePad()">✒️ Signer mon contrat</button>` : ''}
        </div>
      `}
    </div>
  `;
}

/* ---------- Modals ---------- */
function renderModal(){
  if(!state.modal) return "";
  const m = state.modal;
  if(m.type === "book"){
    const item = state.items.find(i => i.id === m.itemId);
    return `
    <div class="modal-bg" onclick="closeModalBg(event)"><div class="modal">
      <h3>Réserver — ${esc(item.name)}</h3>
      ${state.bookingError ? `<div class="msg msg-error">${esc(state.bookingError)}</div>` : ''}
      <div class="row">
        <div class="field"><label>Début</label><input id="bk-start" type="date" min="${todayStr()}" value="${todayStr()}" oninput="updateAvailabilityPreview('${item.id}')"></div>
        <div class="field"><label>Fin</label><input id="bk-end" type="date" min="${todayStr()}" value="${todayStr()}" oninput="updateAvailabilityPreview('${item.id}')"></div>
      </div>
      <div id="bk-availability" style="font-size:12.5px;color:var(--accent);margin-bottom:8px;"></div>
      <div style="font-size:12px;color:var(--text-faint);">Gain à la réservation : +${item.xp_value} XP pour vous.</div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="confirmBooking('${item.id}')">Confirmer</button></div>
    </div></div>`;
  }
  if(m.type === "newItem"){
    return `
    <div class="modal-bg" onclick="closeModalBg(event)"><div class="modal">
      <h3>Ajouter un matériel</h3>
      <div class="field"><label>Nom</label><input id="it-name" placeholder="ex. PVS-31 Bino"></div>
      <div class="field"><label>Description</label><textarea id="it-desc" rows="3" placeholder="Détails techniques, usage recommandé..."></textarea></div>
      <div class="row">
        <div class="field"><label>XP gagnée à la location</label><input id="it-xp" type="number" value="20" min="1"></div>
        <div class="field"><label>Quantité en stock</label><input id="it-qty" type="number" value="1" min="1"></div>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="confirmNewItem()">Ajouter</button></div>
    </div></div>`;
  }
  if(m.type === "newTask"){
    return `
    <div class="modal-bg" onclick="closeModalBg(event)"><div class="modal">
      <h3>Créer une mission</h3>
      <div class="field"><label>Titre</label><input id="tk-title" placeholder="ex. Laisser un avis Google"></div>
      <div class="field"><label>Description</label><textarea id="tk-desc" rows="3" placeholder="Détail de la mission..."></textarea></div>
      <div class="field"><label>XP gagnée par le client</label><input id="tk-xp" type="number" value="15" min="1"></div>
      <label class="checkbox-field"><input type="checkbox" id="tk-requires" onchange="document.getElementById('tk-answer-wrap').style.display=this.checked?'block':'none'"> Demander une réponse au client (ex. son pseudo)</label>
      <div id="tk-answer-wrap" style="display:none;">
        <div class="field"><label>Intitulé du champ demandé</label><input id="tk-answer-label" placeholder="ex. Votre pseudo utilisé pour l'avis Google"></div>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="confirmNewTask()">Créer</button></div>
    </div></div>`;
  }
  if(m.type === "answerTask"){
    const task = state.tasks.find(t => t.id === m.taskId);
    return `
    <div class="modal-bg" onclick="closeModalBg(event)"><div class="modal">
      <h3>${esc(task.title)}</h3>
      ${task.description ? `<p style="font-size:13.5px;color:var(--text-dim);margin:-6px 0 14px;">${esc(task.description)}</p>` : ''}
      ${state.answerError ? `<div class="msg msg-error">${esc(state.answerError)}</div>` : ''}
      <div class="field"><label>${esc(task.answer_label || 'Votre réponse')}</label><input id="ans-input" placeholder="Tapez votre réponse..."></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="confirmAnswerTask('${task.id}')">Valider</button></div>
    </div></div>`;
  }
  return "";
}

/* ---------- Router ---------- */
function render(){
  const app = document.getElementById("app");
  if(state.loading){ app.innerHTML = `<div class="gate"><div style="color:var(--text-faint)">Chargement…</div></div>`; return; }
  if(state.fatalError){ app.innerHTML = `<div class="gate"><div class="gate-card"><div class="msg msg-error">${esc(state.fatalError)}</div></div></div>`; return; }
  if(!state.session){ app.innerHTML = renderGate(); return; }

  const u = currentProfile();
  if(!u){ logout(); return; }
  const allowed = navFor(u.is_master).map(x => x[0]);
  if(!allowed.includes(state.view)) state.view = allowed[0];

  let content = "";
  if(state.view === "accueil") content = renderAccueil();
  else if(state.view === "catalogue") content = renderCatalogue();
  else if(state.view === "planning") content = renderPlanning();
  else if(state.view === "missions") content = renderMissions();
  else if(state.view === "utilisateurs") content = renderUtilisateurs();
  else if(state.view === "contrats") content = renderContratsAdmin();
  else if(state.view === "contrat") content = renderContratClient();

  app.innerHTML = `
    <div class="shell">
      ${renderSidebar()}
      <div class="main">
        <div class="mobile-topbar">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <div style="font-weight:700;">OWLS<span style="color:var(--accent)">VISION</span></div>
        </div>
        ${content}
      </div>
    </div>
    ${renderModal()}
  `;
}

/* ---------- Global handlers ---------- */
window.setAuthTab = (tab) => { state.authTab = tab; state.authError = ""; render(); };
window.handleLogin = (e) => { e.preventDefault(); doLogin(e.target.username.value, e.target.password.value); return false; };
window.handleRegister = (e) => { e.preventDefault(); doRegister(e.target.username.value, e.target.password.value, e.target.password2.value); return false; };
window.logout = logout;
window.goto = (view) => { state.view = view; state.sidebarOpen = false; render(); };
window.toggleSidebar = () => { state.sidebarOpen = !state.sidebarOpen; render(); };
window.deleteItem = deleteItem;
window.deleteTask = deleteTask;
window.deleteProfile = deleteProfile;
window.completeTask = (taskId) => completeTask(taskId, null);
window.cancelBooking = cancelBooking;
window.openBookModal = (itemId) => { state.bookingError = ""; state.modal = { type:"book", itemId }; render(); updateAvailabilityPreview(itemId); };
window.openNewItemModal = () => { state.modal = { type:"newItem" }; render(); };
window.openNewTaskModal = () => { state.modal = { type:"newTask" }; render(); };
window.openAnswerModal = (taskId) => { state.answerError = ""; state.modal = { type:"answerTask", taskId }; render(); };
window.closeModal = () => { state.modal = null; state.bookingError = ""; state.answerError = ""; render(); };
window.closeModalBg = (e) => { if(e.target.classList.contains('modal-bg')) window.closeModal(); };
window.confirmBooking = (itemId) => {
  const start = document.getElementById("bk-start").value;
  const end = document.getElementById("bk-end").value;
  submitBooking(itemId, start, end);
};
window.confirmNewItem = () => {
  createItem(
    document.getElementById("it-name").value.trim(),
    document.getElementById("it-desc").value.trim(),
    document.getElementById("it-xp").value,
    document.getElementById("it-qty").value
  );
};
window.confirmNewTask = () => {
  createTask(
    document.getElementById("tk-title").value.trim(),
    document.getElementById("tk-desc").value.trim(),
    document.getElementById("tk-xp").value,
    document.getElementById("tk-requires").checked,
    document.getElementById("tk-answer-label")?.value.trim()
  );
};
window.confirmAnswerTask = (taskId) => {
  const val = document.getElementById("ans-input").value.trim();
  if(!val){ state.answerError = "Merci de renseigner une réponse."; render(); return; }
  completeTask(taskId, val);
};
function computeAvailabilityText(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return "";
  if(!start || !end || start > end) return "Merci de choisir une période valide.";
  const left = item.qty - activeBookingsCount(itemId, start, end);
  if(left <= 0) return `Complet sur cette période (0/${item.qty} disponible).`;
  return `${left}/${item.qty} disponible sur cette période.`;
}
window.updateAvailabilityPreview = (itemId) => {
  const s = document.getElementById('bk-start'), en = document.getElementById('bk-end'), out = document.getElementById('bk-availability');
  if(!s || !en || !out) return;
  const text = computeAvailabilityText(itemId, s.value, en.value);
  out.textContent = text;
  out.style.color = (text.startsWith('Complet') || text.startsWith('Merci')) ? 'var(--danger)' : 'var(--accent)';
};

const LOGO = "logo.png";

boot();
</script>
</body>
</html>
