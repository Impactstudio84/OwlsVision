<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owls Vision — Location JVN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080D09;
    --bg-2:#0D140E;
    --panel:#101B10;
    --panel-2:#152113;
    --line:#213321;
    --line-soft:#182619;
    --accent:#9BEF1E;
    --accent-dim:#5C8A22;
    --accent-glow: rgba(155,239,30,0.18);
    --text:#E7F3E1;
    --text-dim:#8CA083;
    --text-faint:#5C6E56;
    --danger:#E2543A;
    --danger-dim:#5A2B22;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(155,239,30,0.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Barlow',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Rajdhani',sans-serif;
    letter-spacing:0.02em;
    margin:0;
  }
  ::selection{background:var(--accent);color:#0A0F09;}
  a{color:inherit;}
  button{font-family:'Barlow Semi Condensed',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Barlow',sans-serif;}

  /* ---------- LAYOUT ---------- */
  #app{min-height:100vh;}
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(900px 500px at 50% 0%, var(--accent-glow), transparent 65%),
      var(--bg);
  }
  .gate-card{
    width:100%;
    max-width:380px;
  }
  .gate-brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .gate-brand img{
    width:76px;height:76px;border-radius:50%;
    box-shadow:0 0 0 2px var(--line), 0 0 24px var(--accent-glow);
  }
  .gate-brand .brand-name{
    font-size:24px;font-weight:700;color:var(--text);
    text-align:center;
  }
  .gate-brand .brand-name span{color:var(--accent);}
  .gate-brand .brand-tag{
    font-size:12.5px;color:var(--text-faint);
    font-family:'Barlow Semi Condensed',sans-serif;
    letter-spacing:0.08em;
  }
  .tabs{
    display:flex;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:18px;
  }
  .tabs button{
    flex:1;padding:10px 0;background:var(--panel);
    border:none;color:var(--text-dim);font-size:14px;font-weight:600;
    border-bottom:2px solid transparent;
    transition:color .15s, background .15s;
  }
  .tabs button.active{color:var(--accent);background:var(--panel-2);border-bottom-color:var(--accent);}
  .field{margin-bottom:12px;}
  .field label{
    display:block;font-size:11.5px;color:var(--text-faint);
    margin-bottom:5px;font-family:'Barlow Semi Condensed',sans-serif;
    letter-spacing:0.04em;
  }
  .field input, .field select, .field textarea{
    width:100%;background:var(--panel);border:1px solid var(--line);
    color:var(--text);padding:10px 11px;border-radius:var(--radius);
    font-size:14.5px;outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent-dim);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 18px;border-radius:var(--radius);border:1px solid transparent;
    font-size:14px;font-weight:600;transition:filter .12s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#0A0F09;width:100%;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--text-dim);}
  .btn-ghost:hover{border-color:var(--accent-dim);color:var(--text);}
  .btn-danger{background:transparent;border-color:var(--danger-dim);color:#E2937F;}
  .btn-danger:hover{background:var(--danger-dim);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .msg{font-size:13px;padding:9px 11px;border-radius:var(--radius);margin-bottom:14px;}
  .msg-error{background:rgba(226,84,58,0.1);border:1px solid var(--danger-dim);color:#F0A896;}
  .msg-ok{background:var(--accent-glow);border:1px solid var(--accent-dim);color:var(--accent);}

  /* ---------- SHELL ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--bg-2);
    border-right:1px solid var(--line-soft);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .side-brand{
    display:flex;align-items:center;gap:10px;
    padding:20px 18px;border-bottom:1px solid var(--line-soft);
  }
  .side-brand img{width:38px;height:38px;border-radius:50%;}
  .side-brand .name{font-size:16px;font-weight:700;line-height:1.1;}
  .side-brand .name span{color:var(--accent);}
  .side-brand .sub{font-size:10px;color:var(--text-faint);letter-spacing:0.08em;}
  .nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
  .nav button{
    display:flex;align-items:center;gap:11px;
    background:none;border:none;color:var(--text-dim);
    padding:10px 12px;border-radius:var(--radius);font-size:14px;
    text-align:left;font-weight:500;
  }
  .nav button svg{width:17px;height:17px;flex-shrink:0;opacity:0.8;}
  .nav button:hover{background:var(--panel);color:var(--text);}
  .nav button.active{background:var(--panel-2);color:var(--accent);border-left:2px solid var(--accent);padding-left:10px;}
  .nav .nav-sep{height:1px;background:var(--line-soft);margin:10px 4px;}
  .side-foot{padding:14px;border-top:1px solid var(--line-soft);}
  .side-user{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--accent);border:1px solid var(--line);
    flex-shrink:0;
  }
  .side-user .u-name{font-size:13.5px;font-weight:600;}
  .side-user .u-rank{font-size:11px;color:var(--text-faint);}

  .main{flex:1;min-width:0;padding:28px 34px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
  .topbar h1{font-size:26px;font-weight:700;}
  .topbar .desc{color:var(--text-dim);font-size:14px;margin-top:4px;}

  .xp-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;min-width:260px;
  }
  .xp-card .xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .xp-card .xp-rank{font-size:13.5px;font-weight:700;color:var(--accent);}
  .xp-card .xp-num{font-size:11.5px;color:var(--text-faint);font-family:'Barlow Semi Condensed',sans-serif;}
  .xp-bar-track{height:9px;background:var(--bg);border:1px solid var(--line);border-radius:1px;overflow:hidden;position:relative;}
  .xp-bar-fill{
    height:100%;background:linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition:width .5s ease;
  }
  .xp-bar-ticks{display:flex;justify-content:space-between;margin-top:3px;}
  .xp-bar-ticks span{width:1px;height:4px;background:var(--line);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(270px,1fr));gap:16px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;display:flex;flex-direction:column;gap:10px;
  }
  .card h3{font-size:17px;font-weight:700;}
  .card .card-desc{font-size:13px;color:var(--text-dim);line-height:1.5;flex:1;}
  .tag{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;
    color:var(--accent);font-family:'Barlow Semi Condensed',sans-serif;
    letter-spacing:0.03em;
  }
  .card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line-soft);}
  .qty-pill{font-size:11.5px;color:var(--text-faint);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;padding:9px 10px;color:var(--text-faint);font-weight:600;
    font-family:'Barlow Semi Condensed',sans-serif;font-size:11.5px;letter-spacing:0.04em;
    border-bottom:1px solid var(--line);
  }
  td{padding:10px 10px;border-bottom:1px solid var(--line-soft);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .panel + .panel{margin-top:16px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  .empty{
    padding:30px 20px;text-align:center;color:var(--text-faint);
    border:1px dashed var(--line);border-radius:var(--radius);font-size:13.5px;
  }
  .task-item{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);
  }
  .task-item.done{opacity:0.55;}
  .task-item .t-title{font-weight:600;font-size:14.5px;}
  .task-item .t-desc{font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .task-xp{font-size:12px;color:var(--accent);font-family:'Barlow Semi Condensed',sans-serif;white-space:nowrap;}
  .lead-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line-soft);}
  .lead-row:last-child{border-bottom:none;}
  .lead-rank{width:22px;color:var(--text-faint);font-size:13px;font-weight:700;font-family:'Rajdhani',sans-serif;}
  .lead-rank.top{color:var(--accent);}
  .modal-bg{
    position:fixed;inset:0;background:rgba(5,8,5,0.72);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    width:100%;max-width:420px;padding:22px;
  }
  .modal h3{font-size:18px;margin-bottom:14px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .section-title{font-size:12px;color:var(--text-faint);letter-spacing:0.05em;margin-bottom:12px;font-family:'Barlow Semi Condensed',sans-serif;}
  .hamburger{display:none;}
  .mobile-topbar{display:none;}

  @media (max-width: 860px){
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);
      transition:transform .2s ease;box-shadow:20px 0 40px rgba(0,0,0,0.5);
    }
    .sidebar.open{transform:translateX(0);}
    .main{padding:20px 16px 50px;}
    .mobile-topbar{
      display:flex;align-items:center;gap:12px;margin-bottom:18px;
    }
    .hamburger{
      display:flex;width:36px;height:36px;border:1px solid var(--line);border-radius:var(--radius);
      background:var(--panel);align-items:center;justify-content:center;flex-shrink:0;
    }
    .hamburger span, .hamburger::before, .hamburger::after{display:none;}
    .backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:39;
    }
    .topbar{flex-direction:column;}
    .xp-card{width:100%;min-width:0;}
  }
</style>
</head>

const RANKS = [
  {min:0,   name:"Recrue"},
  {min:150, name:"Éclaireur"},
  {min:400, name:"Sentinelle"},
  {min:800, name:"Vigie de nuit"},
  {min:1400,name:"Rapace"},
  {min:2200,name:"Chouette d'élite"},
];
const XP_STEP = 150; // xp needed per level bracket for the bar display

function rankFor(xp){
  let r = RANKS[0];
  for(const cand of RANKS){ if(xp >= cand.min) r = cand; }
  return r.name;
}
function levelFor(xp){ return Math.floor(xp / XP_STEP) + 1; }
function xpInLevel(xp){ return xp % XP_STEP; }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const todayStr = () => new Date().toISOString().slice(0,10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- storage helpers ---------- */
async function loadAll(key, fallback){
  try{
    const res = await window.storage.get(key, true);
    if(res && res.value) return JSON.parse(res.value);
    return fallback;
  }catch(e){ return fallback; }
}
async function saveAll(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); }
  catch(e){ console.error("Erreur de sauvegarde", key, e); }
}

const KEYS = { users:"ov_users", items:"ov_items", bookings:"ov_bookings", tasks:"ov_tasks" };

/* ---------- global in-memory state ---------- */
let state = {
  loading: true,
  users: [],
  items: [],
  bookings: [],
  tasks: [],
  currentUser: null, // username
  view: "catalogue",
  authTab: "login",
  authError: "",
  authMsgOk: "",
  sidebarOpen: false,
  modal: null, // {type:'book'|'newItem'|'newTask'|'editItem', payload}
  bookingError: "",
};

function currentUserObj(){
  return state.users.find(u => u.username === state.currentUser) || null;
}

async function persist(part){
  if(part === "users") await saveAll(KEYS.users, state.users);
  if(part === "items") await saveAll(KEYS.items, state.items);
  if(part === "bookings") await saveAll(KEYS.bookings, state.bookings);
  if(part === "tasks") await saveAll(KEYS.tasks, state.tasks);
}

async function boot(){
  const [users, items, bookings, tasks] = await Promise.all([
    loadAll(KEYS.users, null),
    loadAll(KEYS.items, null),
    loadAll(KEYS.bookings, []),
    loadAll(KEYS.tasks, []),
  ]);

  if(!users){
    state.users = [
      { username:"master", password:"owlsvision", xp:0, isMaster:true, createdAt: Date.now() }
    ];
    await persist("users");
  } else {
    state.users = users;
  }

  if(!items){
    state.items = [
      { id: uid(), name:"PVS-14 Mono", description:"Monoculaire de référence, gain d'image élevé, montage casque.", xpValue: 30, qty: 3 },
      { id: uid(), name:"GPNVG-18 Quad", description:"Vision panoramique 4 tubes, autonomie longue mission.", xpValue: 60, qty: 1 },
      { id: uid(), name:"Binoculaire BNVD", description:"Confort binoculaire, idéal randonnée et observation.", xpValue: 20, qty: 4 },
    ];
    await persist("items");
  } else {
    state.items = items;
  }

  state.bookings = bookings || [];
  state.tasks = tasks || [];
  state.loading = false;
  render();
}

/* ---------- actions ---------- */
async function doLogin(username, password){
  const u = state.users.find(u => u.username.toLowerCase() === username.trim().toLowerCase());
  if(!u || u.password !== password){
    state.authError = "Identifiant ou mot de passe incorrect.";
    render(); return;
  }
  state.authError = "";
  state.currentUser = u.username;
  state.view = "catalogue";
  render();
}

async function doRegister(username, password, password2){
  username = username.trim();
  if(username.length < 3){ state.authError = "Le pseudo doit faire au moins 3 caractères."; render(); return; }
  if(password.length < 4){ state.authError = "Le mot de passe doit faire au moins 4 caractères."; render(); return; }
  if(password !== password2){ state.authError = "Les mots de passe ne correspondent pas."; render(); return; }
  if(state.users.some(u => u.username.toLowerCase() === username.toLowerCase())){
    state.authError = "Ce pseudo est déjà pris."; render(); return;
  }
  const newUser = { username, password, xp:0, isMaster:false, createdAt: Date.now() };
  state.users.push(newUser);
  await persist("users");
  state.authError = "";
  state.currentUser = username;
  state.view = "catalogue";
  render();
}

function logout(){
  state.currentUser = null;
  state.view = "catalogue";
  render();
}

function overlaps(aStart, aEnd, bStart, bEnd){
  return aStart <= bEnd && bStart <= aEnd;
}

function activeBookingsCount(itemId, start, end, excludeId){
  return state.bookings.filter(b =>
    b.itemId === itemId &&
    b.id !== excludeId &&
    overlaps(b.start, b.end, start, end)
  ).length;
}

async function submitBooking(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return;
  if(!start || !end || start > end){
    state.bookingError = "Merci de choisir une période valide.";
    render(); return;
  }
  if(start < todayStr()){
    state.bookingError = "La date de début ne peut pas être dans le passé.";
    render(); return;
  }
  const overlapCount = activeBookingsCount(itemId, start, end);
  if(overlapCount >= item.qty){
    state.bookingError = `Aucun exemplaire disponible sur cette période (${item.qty} en stock).`;
    render(); return;
  }
  const booking = { id: uid(), itemId, username: state.currentUser, start, end, createdAt: Date.now() };
  state.bookings.push(booking);
  const u = currentUserObj();
  u.xp += item.xpValue;
  await Promise.all([persist("bookings"), persist("users")]);
  state.bookingError = "";
  state.modal = null;
  render();
}

async function cancelBooking(bookingId){
  const b = state.bookings.find(b => b.id === bookingId);
  if(!b) return;
  if(b.username !== state.currentUser && !currentUserObj()?.isMaster) return;
  state.bookings = state.bookings.filter(x => x.id !== bookingId);
  await persist("bookings");
  render();
}

async function completeTask(taskId){
  const task = state.tasks.find(t => t.id === taskId);
  if(!task || task.completed) return;
  task.completed = true;
  task.completedBy = state.currentUser;
  task.completedAt = Date.now();
  // mutualisé : tous les comptes gagnent l'xp de la mission
  state.users.forEach(u => { u.xp += task.xpReward; });
  await Promise.all([persist("tasks"), persist("users")]);
  render();
}

async function createItem(name, description, xpValue, qty){
  state.items.push({ id: uid(), name, description, xpValue: Number(xpValue)||10, qty: Number(qty)||1 });
  await persist("items");
  state.modal = null;
  render();
}
async function deleteItem(itemId){
  state.items = state.items.filter(i => i.id !== itemId);
  state.bookings = state.bookings.filter(b => b.itemId !== itemId);
  await Promise.all([persist("items"), persist("bookings")]);
  render();
}
async function createTask(title, description, xpReward){
  state.tasks.push({ id: uid(), title, description, xpReward: Number(xpReward)||10, completed:false, completedBy:null, createdAt: Date.now() });
  await persist("tasks");
  state.modal = null;
  render();
}
async function deleteTask(taskId){
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  await persist("tasks");
  render();
}

/* ---------- rendering ---------- */
function iconFor(name){
  const icons = {
    catalogue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="12" rx="1.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    planning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    missions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>',
    classement: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M5 6H3v2a4 4 0 0 0 4 4M19 6h2v2a4 4 0 0 1-4 4"/></svg>',
    admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 3.5v5c0 5-3.4 8.7-8 11-4.6-2.3-8-6-8-11v-5L12 2Z"/></svg>',
  };
  return icons[name] || "";
}

function xpBarHtml(user){
  const lvl = levelFor(user.xp);
  const rank = rankFor(user.xp);
  const inLevel = xpInLevel(user.xp);
  const pct = Math.round((inLevel / XP_STEP) * 100);
  return `
    <div class="xp-card">
      <div class="xp-top">
        <span class="xp-rank">Niv. ${lvl} — ${esc(rank)}</span>
        <span class="xp-num">${inLevel} / ${XP_STEP} XP</span>
      </div>
      <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div>
    </div>
  `;
}

function renderGate(){
  const isLogin = state.authTab === "login";
  return `
  <div class="gate">
    <div class="gate-card">
      <div class="gate-brand">
        <img src="${LOGO}" alt="Owls Vision">
        <div class="brand-name">OWLS<span>VISION</span></div>
        <div class="brand-tag">LOCATION DE JUMELLES DE VISION NOCTURNE</div>
      </div>
      <div class="tabs">
        <button class="${isLogin?'active':''}" onclick="setAuthTab('login')">Connexion</button>
        <button class="${!isLogin?'active':''}" onclick="setAuthTab('register')">Créer un compte</button>
      </div>
      ${state.authError ? `<div class="msg msg-error">${esc(state.authError)}</div>` : ''}
      ${isLogin ? `
        <form onsubmit="return handleLogin(event)">
          <div class="field"><label>Pseudo</label><input name="username" required autocomplete="username"></div>
          <div class="field"><label>Mot de passe</label><input name="password" type="password" required autocomplete="current-password"></div>
          <button class="btn btn-primary" type="submit">Se connecter</button>
        </form>
      ` : `
        <form onsubmit="return handleRegister(event)">
          <div class="field"><label>Pseudo</label><input name="username" required></div>
          <div class="field"><label>Mot de passe</label><input name="password" type="password" required></div>
          <div class="field"><label>Confirmer le mot de passe</label><input name="password2" type="password" required></div>
          <button class="btn btn-primary" type="submit">Créer mon compte</button>
        </form>
      `}
    </div>
  </div>`;
}

function navItem(id, label){
  return `<button class="${state.view===id?'active':''}" onclick="goto('${id}')">${iconFor(id)}<span>${label}</span></button>`;
}

function renderSidebar(){
  const u = currentUserObj();
  return `
  <div class="sidebar ${state.sidebarOpen?'open':''}">
    <div class="side-brand">
      <img src="${LOGO}" alt="logo">
      <div>
        <div class="name">OWLS<span>VISION</span></div>
        <div class="sub">OPS &amp; LOCATION</div>
      </div>
    </div>
    <div class="nav">
      ${navItem('catalogue','Catalogue JVN')}
      ${navItem('planning', u?.isMaster ? 'Planning global' : 'Mes réservations')}
      ${navItem('missions','Missions')}
      ${u?.isMaster ? `${navItem('classement','Clients &amp; XP')}<div class="nav-sep"></div>${navItem('admin','Panneau maître')}` : ''}
    </div>
    <div class="side-foot">
      <div class="side-user">
        <div class="avatar">${esc((u?.username||'?').slice(0,2).toUpperCase())}</div>
        <div>
          <div class="u-name">${esc(u?.username)}${u?.isMaster?' 👑':''}</div>
          <div class="u-rank">${esc(rankFor(u?.xp||0))}</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" style="width:100%" onclick="logout()">Se déconnecter</button>
    </div>
  </div>
  ${state.sidebarOpen ? `<div class="backdrop" onclick="toggleSidebar()"></div>` : ''}
  `;
}

function renderCatalogue(){
  const u = currentUserObj();
  const cards = state.items.map(item => {
    const bookedNow = activeBookingsCount(item.id, todayStr(), todayStr());
    const dispo = item.qty - bookedNow;
    return `
      <div class="card">
        <div>
          <span class="tag">+${item.xpValue} XP à la location</span>
        </div>
        <h3>${esc(item.name)}</h3>
        <div class="card-desc">${esc(item.description)}</div>
        <div class="card-foot">
          <span class="qty-pill">${dispo > 0 ? dispo+" dispo. aujourd'hui" : "complet aujourd'hui"} · stock ${item.qty}</span>
          <button class="btn btn-primary btn-sm" onclick="openBookModal('${item.id}')">Réserver</button>
        </div>
        ${u?.isMaster ? `<button class="btn btn-danger btn-sm" onclick="deleteItem('${item.id}')">Retirer du catalogue</button>` : ''}
      </div>
    `;
  }).join("");
  return `
    <div class="topbar">
      <div>
        <h1>Catalogue</h1>
        <div class="desc">Choisissez votre matériel de vision nocturne et réservez un créneau.</div>
      </div>
      ${xpBarHtml(u)}
    </div>
    ${state.items.length ? `<div class="grid">${cards}</div>` : `<div class="empty">Aucun matériel enregistré pour le moment.</div>`}
  `;
}

function renderPlanning(){
  const u = currentUserObj();
  const isMaster = !!u?.isMaster;
  const source = isMaster ? state.bookings : state.bookings.filter(b => b.username === state.currentUser);
  const sorted = [...source].sort((a,b) => a.start.localeCompare(b.start));
  const rows = sorted.map(b => {
    const item = state.items.find(i => i.id === b.itemId);
    const mine = b.username === state.currentUser;
    const canCancel = mine || isMaster;
    return `
      <tr>
        <td>${esc(item?.name || "Matériel supprimé")}</td>
        ${isMaster ? `<td>${esc(b.username)}${mine? ' <span style="color:var(--accent);font-size:11px">(vous)</span>':''}</td>` : ''}
        <td>${b.start}</td>
        <td>${b.end}</td>
        <td>${canCancel ? `<button class="btn btn-ghost btn-sm" onclick="cancelBooking('${b.id}')">Annuler</button>` : '—'}</td>
      </tr>
    `;
  }).join("");
  return `
    <div class="topbar">
      <div>
        <h1>${isMaster ? 'Planning global' : 'Mes réservations'}</h1>
        <div class="desc">${isMaster ? "Vue d'ensemble de toutes les locations de tous les clients." : "Vos locations à venir et passées. Vos données ne sont visibles que par vous et le compte maître."}</div>
      </div>
      ${xpBarHtml(u)}
    </div>
    <div class="panel">
      ${sorted.length ? `
      <table>
        <thead><tr><th>Matériel</th>${isMaster ? '<th>Client</th>' : ''}<th>Début</th><th>Fin</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty">${isMaster ? "Aucune réservation planifiée." : "Vous n'avez aucune réservation pour le moment. Rendez-vous dans le catalogue."}</div>`}
    </div>
  `;
}

function renderMissions(){
  const u = currentUserObj();
  const isMaster = !!u?.isMaster;
  const items = state.tasks.slice().sort((a,b) => (a.completed - b.completed) || (b.createdAt - a.createdAt));
  const rows = items.map(t => `
    <div class="task-item ${t.completed?'done':''}">
      <div>
        <div class="t-title">${esc(t.title)}</div>
        ${t.description ? `<div class="t-desc">${esc(t.description)}</div>` : ''}
        ${t.completed ? `<div class="t-desc">${isMaster ? `Accomplie par ${esc(t.completedBy)}` : 'Mission accomplie'} — XP distribuée à tous les comptes</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="task-xp">+${t.xpReward} XP pour tous</span>
        ${!t.completed ? `<button class="btn btn-primary btn-sm" onclick="completeTask('${t.id}')">Marquer accomplie</button>` : ''}
        ${u?.isMaster ? `<button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">Suppr.</button>` : ''}
      </div>
    </div>
  `).join("");
  return `
    <div class="topbar">
      <div>
        <h1>Missions</h1>
        <div class="desc">Missions créées par le compte maître. Une mission accomplie profite à tous les comptes.</div>
      </div>
      ${xpBarHtml(u)}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${items.length ? rows : `<div class="empty">Aucune mission disponible pour le moment.</div>`}
    </div>
  `;
}

function renderClassement(){
  const u = currentUserObj();
  if(!u?.isMaster) return renderCatalogue();
  const sorted = [...state.users].sort((a,b) => b.xp - a.xp);
  const rows = sorted.map((usr, idx) => {
    const nbBookings = state.bookings.filter(b => b.username === usr.username).length;
    const joined = usr.createdAt ? new Date(usr.createdAt).toLocaleDateString('fr-FR') : '—';
    return `
    <div class="lead-row">
      <div class="lead-rank ${idx<3?'top':''}">${idx+1}</div>
      <div class="avatar" style="width:28px;height:28px;font-size:11px;">${esc(usr.username.slice(0,2).toUpperCase())}</div>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">${esc(usr.username)}${usr.isMaster?' 👑':''}</div>
        <div style="font-size:11.5px;color:var(--text-faint);">${esc(rankFor(usr.xp))} · Niveau ${levelFor(usr.xp)} · Inscrit le ${joined} · ${nbBookings} réservation${nbBookings>1?'s':''}</div>
      </div>
      <div style="font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--accent);">${usr.xp} XP</div>
    </div>
  `;
  }).join("");
  return `
    <div class="topbar">
      <div>
        <h1>Clients &amp; XP</h1>
        <div class="desc">Vue détaillée réservée au compte maître — chaque client ne voit que sa propre progression.</div>
      </div>
      ${xpBarHtml(u)}
    </div>
    <div class="panel">${rows || `<div class="empty">Aucun compte enregistré.</div>`}</div>
  `;
}

function renderAdmin(){
  const u = currentUserObj();
  if(!u?.isMaster) return renderCatalogue();
  const itemRows = state.items.map(i => `
    <tr>
      <td>${esc(i.name)}</td>
      <td>${i.xpValue} XP</td>
      <td>${i.qty}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteItem('${i.id}')">Suppr.</button></td>
    </tr>
  `).join("");
  const taskRows = state.tasks.map(t => `
    <tr>
      <td>${esc(t.title)}</td>
      <td>${t.xpReward} XP</td>
      <td>${t.completed ? `Accomplie (${esc(t.completedBy)})` : "En attente"}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">Suppr.</button></td>
    </tr>
  `).join("");
  return `
    <div class="topbar">
      <div>
        <h1>Panneau maître</h1>
        <div class="desc">Gestion du matériel et des missions. Réservé au compte maître.</div>
      </div>
      ${xpBarHtml(u)}
    </div>

    <div class="panel">
      <div class="section-title">MATÉRIEL</div>
      <button class="btn btn-primary btn-sm" style="margin-bottom:14px;" onclick="openNewItemModal()">+ Ajouter un matériel</button>
      ${state.items.length ? `
      <table>
        <thead><tr><th>Nom</th><th>XP location</th><th>Stock</th><th></th></tr></thead>
        <tbody>${itemRows}</tbody>
      </table>` : `<div class="empty">Aucun matériel.</div>`}
    </div>

    <div class="panel">
      <div class="section-title">MISSIONS (XP mutualisée sur tous les comptes)</div>
      <button class="btn btn-primary btn-sm" style="margin-bottom:14px;" onclick="openNewTaskModal()">+ Créer une mission</button>
      ${state.tasks.length ? `
      <table>
        <thead><tr><th>Titre</th><th>XP</th><th>Statut</th><th></th></tr></thead>
        <tbody>${taskRows}</tbody>
      </table>` : `<div class="empty">Aucune mission.</div>`}
    </div>
  `;
}

function renderModal(){
  if(!state.modal) return "";
  const m = state.modal;
  if(m.type === "book"){
    const item = state.items.find(i => i.id === m.itemId);
    return `
    <div class="modal-bg" onclick="closeModalBg(event)">
      <div class="modal">
        <h3>Réserver — ${esc(item.name)}</h3>
        ${state.bookingError ? `<div class="msg msg-error">${esc(state.bookingError)}</div>` : ''}
        <div class="row">
          <div class="field"><label>Début</label><input id="bk-start" type="date" min="${todayStr()}" value="${todayStr()}" oninput="updateAvailabilityPreview('${item.id}')"></div>
          <div class="field"><label>Fin</label><input id="bk-end" type="date" min="${todayStr()}" value="${todayStr()}" oninput="updateAvailabilityPreview('${item.id}')"></div>
        </div>
        <div id="bk-availability" style="font-size:12.5px;color:var(--accent);margin-bottom:8px;"></div>
        <div style="font-size:12px;color:var(--text-faint);">Gain à la réservation : +${item.xpValue} XP pour vous.</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="confirmBooking('${item.id}')">Confirmer</button>
        </div>
      </div>
    </div>`;
  }
  if(m.type === "newItem"){
    return `
    <div class="modal-bg" onclick="closeModalBg(event)">
      <div class="modal">
        <h3>Ajouter un matériel</h3>
        <div class="field"><label>Nom</label><input id="it-name" placeholder="ex. PVS-31 Bino"></div>
        <div class="field"><label>Description</label><textarea id="it-desc" rows="3" placeholder="Détails techniques, usage recommandé..."></textarea></div>
        <div class="row">
          <div class="field"><label>XP gagnée à la location</label><input id="it-xp" type="number" value="20" min="1"></div>
          <div class="field"><label>Quantité en stock</label><input id="it-qty" type="number" value="1" min="1"></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="confirmNewItem()">Ajouter</button>
        </div>
      </div>
    </div>`;
  }
  if(m.type === "newTask"){
    return `
    <div class="modal-bg" onclick="closeModalBg(event)">
      <div class="modal">
        <h3>Créer une mission</h3>
        <div class="field"><label>Titre</label><input id="tk-title" placeholder="ex. Retour matériel sans dommage"></div>
        <div class="field"><label>Description</label><textarea id="tk-desc" rows="3" placeholder="Détail de la mission..."></textarea></div>
        <div class="field"><label>XP distribuée à tous les comptes</label><input id="tk-xp" type="number" value="15" min="1"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
          <button class="btn btn-primary" onclick="confirmNewTask()">Créer</button>
        </div>
      </div>
    </div>`;
  }
  return "";
}

function render(){
  const app = document.getElementById("app");
  if(state.loading){
    app.innerHTML = `<div class="gate"><div style="color:var(--text-faint)">Chargement…</div></div>`;
    return;
  }
  if(!state.currentUser){
    app.innerHTML = renderGate();
    return;
  }
  const currentUserForGuard = currentUserObj();
  if((state.view === "classement" || state.view === "admin") && !currentUserForGuard?.isMaster){
    state.view = "catalogue";
  }

  let content = "";
  if(state.view === "catalogue") content = renderCatalogue();
  else if(state.view === "planning") content = renderPlanning();
  else if(state.view === "missions") content = renderMissions();
  else if(state.view === "classement") content = renderClassement();
  else if(state.view === "admin") content = renderAdmin();
  else content = renderCatalogue();

  app.innerHTML = `
    <div class="shell">
      ${renderSidebar()}
      <div class="main">
        <div class="mobile-topbar">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <div style="font-weight:700;">OWLS<span style="color:var(--accent)">VISION</span></div>
        </div>
        ${content}
      </div>
    </div>
    ${renderModal()}
  `;
}

/* ---------- UI event handlers exposed globally ---------- */
window.setAuthTab = (tab) => { state.authTab = tab; state.authError=""; render(); };
window.handleLogin = (e) => {
  e.preventDefault();
  const f = e.target;
  doLogin(f.username.value, f.password.value);
  return false;
};
window.handleRegister = (e) => {
  e.preventDefault();
  const f = e.target;
  doRegister(f.username.value, f.password.value, f.password2.value);
  return false;
};
window.logout = logout;
window.goto = (view) => { state.view = view; state.sidebarOpen = false; render(); };
window.toggleSidebar = () => { state.sidebarOpen = !state.sidebarOpen; render(); };
window.deleteItem = deleteItem;
window.deleteTask = deleteTask;
window.completeTask = completeTask;
window.cancelBooking = cancelBooking;
window.openBookModal = (itemId) => {
  state.bookingError="";
  state.modal = {type:"book", itemId};
  render();
  updateAvailabilityPreview(itemId);
};
function computeAvailabilityText(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return "";
  if(!start || !end || start > end) return "Merci de choisir une période valide.";
  const used = activeBookingsCount(itemId, start, end);
  const left = item.qty - used;
  if(left <= 0) return `Complet sur cette période (0/${item.qty} disponible).`;
  return `${left}/${item.qty} disponible sur cette période.`;
}
window.updateAvailabilityPreview = (itemId) => {
  const startEl = document.getElementById('bk-start');
  const endEl = document.getElementById('bk-end');
  const out = document.getElementById('bk-availability');
  if(!startEl || !endEl || !out) return;
  const text = computeAvailabilityText(itemId, startEl.value, endEl.value);
  out.textContent = text;
  out.style.color = (text.startsWith('Complet') || text.startsWith('Merci')) ? 'var(--danger)' : 'var(--accent)';
};
window.openNewItemModal = () => { state.modal = {type:"newItem"}; render(); };
window.openNewTaskModal = () => { state.modal = {type:"newTask"}; render(); };
window.closeModal = () => { state.modal = null; state.bookingError=""; render(); };
window.closeModalBg = (e) => { if(e.target.classList.contains('modal-bg')) window.closeModal(); };
window.confirmBooking = (itemId) => {
  const start = document.getElementById("bk-start").value;
  const end = document.getElementById("bk-end").value;
  submitBooking(itemId, start, end);
};
window.confirmNewItem = () => {
  const name = document.getElementById("it-name").value.trim();
  const desc = document.getElementById("it-desc").value.trim();
  const xp = document.getElementById("it-xp").value;
  const qty = document.getElementById("it-qty").value;
  if(!name) return;
  createItem(name, desc, xp, qty);
};
window.confirmNewTask = () => {
  const title = document.getElementById("tk-title").value.trim();
  const desc = document.getElementById("tk-desc").value.trim();
  const xp = document.getElementById("tk-xp").value;
  if(!title) return;
  createTask(title, desc, xp);
};

boot();
</script>
</body>
</html>
