// Structure de nav data-driven : chaque entrée master peut porter un "badge" (compteur de
// notification) et/ou un "sub" (sous-onglets repliables). Les ids des sous-onglets sont ceux
// utilisés par le routeur (state.view) ; les ids de groupe ("gestion-group", "missions-group")
// ne sont JAMAIS des vues elles-mêmes, seulement des repères de rangement dans le menu.
function masterNavDef(){
  return [
    { id: "dashboard", label: "Tableau de bord" },
    { id: "gestion-group", label: "Gestion", icon: "gestion",
      badge: () => state.bookings.filter(b => b.status === 'demande').length,
      sub: [
        { id: "gestion", label: "Location", badge: () => state.bookings.filter(b => b.status === 'demande').length },
        { id: "stock", label: "Stock" },
        { id: "catalogue", label: "Catalogue" },
      ] },
    { id: "utilisateurs", label: "Utilisateurs" },
    { id: "missions-group", label: "Missions", icon: "missions",
      badge: () => state.completions.filter(c => c.status === 'attente').length,
      sub: [
        { id: "missions-validation", label: "Validation", badge: () => state.completions.filter(c => c.status === 'attente').length },
        { id: "missions-creation", label: "Création" },
      ] },
    { id: "recompenses", label: "À gagner", badge: () => state.redemptions.filter(r => r.status === 'attente').length },
    { id: "contrats", label: "Contrats", badge: () => state.contracts.filter(c => c.signed_at && c.signed_seen_by_master === false).length },
  ];
}
function clientNavDef(){
  return [
    { id: "accueil", label: "Accueil" },
    { id: "catalogue", label: "Catalogue location JVN", shortLabel: "Catalogue" },
    { id: "planning", label: "Mes réservations", shortLabel: "Réservations" },
    { id: "missions", label: "Missions", badge: (u) => state.completions.filter(c => c.username === u.username && c.status !== 'attente' && c.client_seen === false).length },
    { id: "recompenses", label: "À gagner", badge: (u) => state.redemptions.filter(r => r.username === u.username && r.status !== 'attente' && r.client_seen === false).length },
    { id: "contrat", label: "Mes contrats", shortLabel: "Contrat", badge: (u) => { const c = state.contracts.find(x => x.username === u.username); return (c && !c.signed_at) ? 1 : 0; } },
    { id: "profil", label: "Mon profil", shortLabel: "Profil" },
  ];
}
// Ordre des onglets du master, personnalisable en glissant-déposant. Enregistré sur le profil
// master en base (colonne nav_order, Lot 8) pour retrouver le même ordre à la prochaine
// connexion, même depuis un autre poste — localStorage reste une copie locale immédiate en
// secours (fonctionne même avant l'exécution de migration_lot8.sql, ou hors-ligne un instant).
function getMasterNavOrder(){
  const defaultOrder = masterNavDef().map(x => x.id);
  let saved = [];
  const mp = currentProfile();
  if(mp && mp.is_master && mp.nav_order){
    try { saved = JSON.parse(mp.nav_order); } catch(e){ saved = []; }
  }
  if(!saved.length){
    try { saved = JSON.parse(localStorage.getItem('ov_master_nav_order') || '[]'); } catch(e){ saved = []; }
  }
  const valid = saved.filter(id => defaultOrder.includes(id));
  defaultOrder.forEach(id => { if(!valid.includes(id)) valid.push(id); });
  return valid;
}
function saveMasterNavOrder(order){
  try { localStorage.setItem('ov_master_nav_order', JSON.stringify(order)); } catch(e){}
  const mp = currentProfile();
  if(!mp || !mp.is_master) return;
  mp.nav_order = JSON.stringify(order);
  sb.from('profiles').update({ nav_order: mp.nav_order }).eq('username', mp.username).then(({ error }) => {
    if(error) console.warn("Ordre des onglets : synchronisation serveur ignorée (migration_lot8.sql exécutée ?)", error.message);
  });
}
function navFor(isMaster){
  if(!isMaster) return clientNavDef();
  const def = masterNavDef();
  const byId = Object.fromEntries(def.map(item => [item.id, item]));
  return getMasterNavOrder().map(id => byId[id]).filter(Boolean);
}
function navItemHtml(item, u, isMaster){
  const badgeCount = item.badge ? item.badge(u) : 0;
  const badgeHtml = badgeCount>0 ? `<span class="badge-dot">${badgeCount>99?'99+':badgeCount}</span>` : '';
  const dragAttrs = isMaster ? ` draggable="true" data-nav-id="${item.id}" ondragstart="navDragStart(event,'${item.id}')" ondragend="navDragEnd(event)"` : '';
  if(item.sub){
    const isOpen = !!state.navOpenGroups[item.id];
    const isSubActive = item.sub.some(s => s.id === state.view);
    return `
      <div class="nav-group" ondragover="navDragOver(event)" ondragleave="navDragLeave(event)" ondrop="navDrop(event,'${item.id}')">
        <button type="button"${dragAttrs} class="${isSubActive?'active':''}" onclick="toggleNavGroup('${item.id}')">${iconFor(item.icon || item.id)}<span>${esc(item.label)}</span>${badgeHtml}<span class="nav-chevron ${isOpen?'open':''}">›</span></button>
        <div class="nav-sub ${isOpen?'open':''}">
          ${item.sub.map(s => {
            const subBadge = s.badge ? s.badge(u) : 0;
            const subBadgeHtml = subBadge>0 ? `<span class="badge-dot">${subBadge>99?'99+':subBadge}</span>` : '';
            return `<button type="button" class="${state.view===s.id?'active':''}" onclick="goto('${s.id}')"><span>${esc(s.label)}</span>${subBadgeHtml}</button>`;
          }).join('')}
        </div>
      </div>`;
  }
  return `<button type="button"${dragAttrs} class="${state.view===item.id?'active':''}" onclick="goto('${item.id}')" ondragover="navDragOver(event)" ondragleave="navDragLeave(event)" ondrop="navDrop(event,'${item.id}')">${iconFor(item.icon || item.id)}<span>${esc(item.label)}</span>${badgeHtml}</button>`;
}

// Barre de navigation mobile (icônes en bas d'écran, client + master) : reprend exactement les
// mêmes entrées/badges que la sidebar (navFor), donc toujours synchronisée avec elle. Un onglet
// "groupe" (Gestion, Missions côté master) pointe vers son premier sous-onglet au tap ; les autres
// sous-onglets restent accessibles via le menu ☰ complet, qui reste disponible tel quel.
function renderBottomNav(){
  const u = currentProfile();
  const isMaster = u.is_master;
  const items = navFor(isMaster).map(item => {
    const targetId = item.sub ? item.sub[0].id : item.id;
    const active = item.sub ? item.sub.some(s => s.id === state.view) : state.view === item.id;
    const badgeCount = item.badge ? item.badge(u) : 0;
    const badgeHtml = badgeCount>0 ? `<span class="bn-badge">${badgeCount>99?'99+':badgeCount}</span>` : '';
    return `<button type="button" class="${active?'active':''}" onclick="goto('${targetId}')">${iconFor(item.icon || item.id)}<span class="bn-label">${esc(item.shortLabel || item.label)}</span>${badgeHtml}</button>`;
  }).join('');
  return `<div class="bottom-nav">${items}</div>`;
}

/* ---------- Gestion location (équipe) ---------- */
function gestionFilteredSorted(){
  const q = (state.gestionSearch||'').trim().toLowerCase();
  let list = state.bookings.filter(b => {
    if(state.gestionFilter !== 'all' && b.status !== state.gestionFilter) return false;
    if(!q) return true;
    const p = state.profiles.find(x => x.username === b.username);
    const item = state.items.find(i => i.id === b.item_id);
    const hay = [b.username, p?.nom, p?.prenom, item?.name].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  const { field, dir } = state.gestionSort;
  const mult = dir === 'asc' ? 1 : -1;
  list.sort((a,b) => {
    let av, bv;
    if(field === 'client'){ av = clientDisplayName(state.profiles.find(x=>x.username===a.username)).toLowerCase(); bv = clientDisplayName(state.profiles.find(x=>x.username===b.username)).toLowerCase(); }
    else if(field === 'status'){ av = a.status; bv = b.status; }
    else if(field === 'item'){ av = (state.items.find(i=>i.id===a.item_id)?.name||'').toLowerCase(); bv = (state.items.find(i=>i.id===b.item_id)?.name||'').toLowerCase(); }
    else { av = a.start_date; bv = b.start_date; }
    if(av < bv) return -1 * mult;
    if(av > bv) return 1 * mult;
    return 0;
  });
  return list;
}
function bookingDurationDays(b){
  const start = new Date(b.start_date), end = new Date(b.end_date);
  return Math.max(1, Math.round((end - start) / 86400000) + 1);
}
function estimatedBookingPrice(b){
  const item = state.items.find(i => i.id === b.item_id);
  if(!item) return null;
  const days = bookingDurationDays(b);
  if(item.price_per_week != null && days >= 7){
    const weeks = Math.floor(days / 7);
    const restDays = days % 7;
    const restPrice = item.price_per_day != null ? restDays * Number(item.price_per_day) : 0;
    return weeks * Number(item.price_per_week) + restPrice;
  }
  if(item.price_per_day != null) return days * Number(item.price_per_day);
  return null;
}
function fmtPrice(v){ return v == null ? "—" : `${v.toFixed(2)} €`; }
// Format décimal français ("200,50") pour insertion dans le texte du contrat — sans le symbole €,
// déjà présent dans le gabarit autour de chaque token.
function fmtDecimalFr(v){
  if(v === '' || v == null || isNaN(Number(v))) return '—';
  return Number(v).toFixed(2).replace('.', ',');
}
function gestionRowHtml(b){

  const arrow = (f) => state.gestionSort.field === f ? `<span class="sort-arrow">${state.gestionSort.dir === 'asc' ? '▲' : '▼'}</span>` : '';

/* ---------- Tableau de bord (équipe) ---------- */
function gaugeHtml(label, value, total, color){
  const frac = total > 0 ? Math.min(1, value/total) : 0;
  const len = Math.PI * 80;
  const dashoffset = len * (1 - frac);
  const angle = -90 + frac * 180;
  return `
    <div class="gauge-card">
      <svg class="gauge-svg" viewBox="0 0 200 120">
        <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14" stroke-linecap="round"/>
        <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="${len.toFixed(2)}" stroke-dashoffset="${dashoffset.toFixed(2)}" style="transition: stroke-dashoffset 1s var(--ease);"/>
        <line class="gauge-needle" x1="100" y1="100" x2="100" y2="32" stroke="var(--text)" stroke-width="3" stroke-linecap="round" style="transform:rotate(${angle.toFixed(1)}deg);"/>
        <circle cx="100" cy="100" r="7" fill="var(--text)"/>
      </svg>
      <div class="gauge-value">${value}</div>
      <div class="gauge-label">${esc(label)}</div>
      <div class="gauge-sub">sur ${total} location${total>1?'s':''} au total</div>
    </div>`;
}
function revenueSince(dateStr){
  return state.bookings
    .filter(b => ['loue','retourne'].includes(b.status) && b.start_date >= dateStr)
    .reduce((sum, b) => sum + (estimatedBookingPrice(b) || 0), 0);
}

/* ---------- Missions (master) : Validation — soumissions des clients, avec plus de contexte ---------- */
function validationMatchesSearch(c, q){
  if(!q) return true;
  const p = state.profiles.find(x => x.username === c.username);

  return name.includes(q) || c.username.toLowerCase().includes(q);
}
function validationFilteredPending(){
  const q = (state.validationSearch||'').trim().toLowerCase();
  return state.completions.filter(c => c.status === 'attente' && validationMatchesSearch(c, q))

function validationFilteredRecent(){
  const q = (state.validationSearch||'').trim().toLowerCase();

function validationHistoryRowHtml(c){

/* ---------- À gagner (récompenses) ---------- */
function rewardCardHtml(r, isMaster, u){
  const myRedemption = !isMaster ? myActiveRedemption(r.id, u.username) : null;
  const available = !isMaster ? u.xp - totalXpSpentOrPending(u.username) : 0;
  const canAfford = !isMaster && available >= r.xp_cost;
  const allRedemptions = isMaster ? state.redemptions.filter(x => x.reward_id === r.id).sort((a,b)=>(b.requested_at||'').localeCompare(a.requested_at||'')) : [];
  let clientBlock = '';
  if(!isMaster){
    if(!myRedemption){
      clientBlock = `<div class="card-foot"><button class="btn btn-primary btn-sm" style="width:100%;" ${canAfford?'':'disabled'} onclick="redeemReward('${r.id}')">${canAfford ? 'Échanger' : `Il manque ${r.xp_cost - available} XP`}</button></div>`;
    } else if(myRedemption.status === 'attente'){
      clientBlock = `<div class="card-foot"><span class="status-pill pending">Demande en attente</span></div>`;
    } else if(myRedemption.status === 'validee' && !myRedemption.shipping_address){
      clientBlock = `
        <div class="card-desc" style="color:var(--accent);flex:0;">🎉 Récompense validée ! Merci de confirmer votre adresse d'envoi postal.</div>
        <div class="card-foot" style="flex-direction:column;align-items:stretch;gap:8px;">
          <textarea id="ship-addr-${r.id}" rows="2" placeholder="Nom, adresse, code postal, ville..." style="width:100%;background:rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);padding:10px 12px;border-radius:var(--r-sm);font-size:13.5px;">${esc(u.adresse||'')}</textarea>
          <button class="btn btn-primary btn-sm" style="width:100%;" onclick="window.confirmRedemptionAddressUi('${myRedemption.id}','${r.id}')">Confirmer l'adresse</button>
        </div>`;
    } else if(myRedemption.status === 'validee' && myRedemption.shipping_address){
      clientBlock = `<div class="card-desc" style="color:var(--accent);flex:0;">📦 En cours de préparation — envoi à : ${esc(myRedemption.shipping_address)}</div>`;
    }
  }
  return `
    <div class="card">
      ${r.image_url ? `<img class="card-photo" src="${r.image_url}" alt="${esc(r.name)}">` : `<div class="card-photo-ph">🎁</div>`}
      <span class="tag">${r.xp_cost} XP</span>
      <h3>${esc(r.name)}</h3>
      ${r.description ? `<div class="card-desc">${esc(r.description)}</div>` : ''}
      ${clientBlock}
      ${isMaster && allRedemptions.length ? `<div>${allRedemptions.map(rd => `
        <div class="submission-row" style="flex-direction:column;align-items:stretch;gap:4px;">
          <div style="display:flex;justify-content:space-between;"><span>${esc(rd.username)}</span><span>${fmtDate(rd.requested_at)}</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            ${statusPillHtml(rd.status === 'attente' ? 'demande' : rd.status === 'validee' ? 'accepte' : 'refuse')}
            ${rd.status === 'attente' ? `<div style="display:flex;gap:6px;"><button class="btn btn-primary btn-sm" onclick="validateRedemption('${rd.id}')">Valider</button><button class="btn btn-ghost btn-sm" onclick="rejectRedemption('${rd.id}')">Refuser</button></div>` : ''}
          </div>
          ${rd.status === 'validee' ? `<div style="font-size:12px;color:var(--text-dim);">${rd.shipping_address ? `Adresse : ${esc(rd.shipping_address)}` : "En attente de l'adresse du client"}</div>` : ''}
        </div>`).join("")}</div>` : ''}
      ${isMaster ? `<div class="card-foot"><button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openEditRewardModal('${r.id}')">Modifier</button><button class="btn btn-danger btn-sm" style="flex:1;" onclick="deleteReward('${r.id}')">Supprimer</button></div>` : ''}
    </div>`;
}
function orphanRedemptionRowHtml(r){
  const p = state.profiles.find(x => x.username === r.username);
  return `
    <div class="list-row">
      <div><div class="t-title">${esc(p ? clientDisplayName(p) : r.username)}</div><div class="t-desc">Récompense supprimée · demande ${r.status === 'attente' ? 'en attente' : r.status === 'validee' ? 'validée' : 'refusée'} du ${fmtDate(r.requested_at)}</div></div>

function renderRecompenses(){

  `;
}

function usersMatchesSearch(p, q){
  if(!q) return true;
  const hay = [p.username, p.prenom, p.nom, clientDisplayName(p)].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}
function usersFilteredSorted(){

  return state.profiles.slice().filter(p => usersMatchesSearch(p, q)).sort((a,b) => {

    return b.xp - a.xp;

function usersRowHtml(p){

function renderUtilisateurs(){

/* ---------- Contrats (équipe) ---------- */
function contratStatusRank(c){
  if(!c) return 0; // Aucun contrat
  if(c.signed_at) return 2; // Signé
  return 1; // En attente de signature
}
function renderContratsAdmin(){
  const sortKey = state.contratsSort || 'client_asc';
  let clients = state.profiles.filter(p => !p.is_master);
  clients = clients.slice().sort((a, b) => {
    const ca = state.contracts.find(x => x.username === a.username);
    const cb = state.contracts.find(x => x.username === b.username);
    if(sortKey === 'client_asc') return clientDisplayName(a).localeCompare(clientDisplayName(b));
    if(sortKey === 'client_desc') return clientDisplayName(b).localeCompare(clientDisplayName(a));
    if(sortKey === 'statut') return contratStatusRank(cb) - contratStatusRank(ca); // signés d'abord
    if(sortKey === 'statut_asc') return contratStatusRank(ca) - contratStatusRank(cb); // aucun contrat d'abord
    if(sortKey === 'date_signature') return (cb?.signed_at || '').localeCompare(ca?.signed_at || '');
    return 0;
  });
  const rows = clients.map(usr => {
    const c = state.contracts.find(x => x.username === usr.username);
    let pill = `<span class="status-pill none">Aucun contrat</span>`;
    if(c && c.signed_at) pill = `<span class="status-pill ok">Signé le ${fmtDate(c.signed_at)}</span>`;
    else if(c) pill = `<span class="status-pill pending">En attente de signature</span>`;
    return `
      <div class="list-row">
        <div><div class="t-title">${esc(usr.username)}</div><div class="t-desc">${pill}</div></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${c ? `<a class="btn btn-ghost btn-sm" href="${c.pdf_path}" target="_blank" rel="noopener">Original</a>` : ''}
          ${c && c.signed_pdf_path ? `<a class="btn btn-ghost btn-sm" href="${c.signed_pdf_path}" target="_blank" rel="noopener">Signé</a>` : ''}
          <button class="btn btn-primary btn-sm" onclick="openGenerateContractModal('${usr.username}')">${c?'Régénérer':'Générer'} le contrat</button>
          <span class="btn btn-ghost btn-sm file-btn">Uploader un PDF sur mesure<input type="file" accept="application/pdf" onchange="handleContractUpload(event,'${usr.username}')"></span>
          ${c ? `<a class="btn btn-ghost btn-sm" href="${c.pdf_path}" target="_blank" rel="noopener">Original</a>` : ''}
          ${c && c.signed_pdf_path ? `<a class="btn btn-ghost btn-sm" href="${c.signed_pdf_path}" target="_blank" rel="noopener">Signé</a>` : ''}
          ${c && c.signed_at ? `<button class="btn btn-ghost btn-sm" onclick="masterRemoveSignature('${usr.username}')">Retirer la signature</button>` : ''}
          ${c ? `<button class="btn btn-danger btn-sm" onclick="masterDeleteContract('${usr.username}')">Supprimer</button>` : ''}
        </div>
      </div>`;
  }).join("");
  return `
    <div class="topbar"><div><h1>Contrats</h1><div class="desc">Générez le contrat de location personnalisé de chaque client en un clic (fiche client + réservation), ou uploadez un PDF sur mesure si besoin. Le client le consulte et le signe depuis son mobile.</div></div></div>
    <div class="filter-bar" style="margin-bottom:16px;">
      <select onchange="onContratsSort(this.value)">
        <option value="client_asc" ${sortKey==='client_asc'?'selected':''}>Client (A→Z)</option>
        <option value="client_desc" ${sortKey==='client_desc'?'selected':''}>Client (Z→A)</option>
        <option value="statut" ${sortKey==='statut'?'selected':''}>Statut : signés d'abord</option>
        <option value="statut_asc" ${sortKey==='statut_asc'?'selected':''}>Statut : sans contrat d'abord</option>
        <option value="date_signature" ${sortKey==='date_signature'?'selected':''}>Date de signature (récent d'abord)</option>
      </select>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">${clients.length ? rows : `<div class="empty">Aucun client enregistré.</div>`}</div>
  `;
}

/* ---------- Historique client (répertoire horodaté par compte) ---------- */
function clientHistoryEntries(username){
  const entries = [];
  const p = state.profiles.find(x => x.username === username);
  if(p && p.created_at) entries.push({ date: p.created_at, icon: '👤', label: 'Compte créé' });
  if(p && p.id_doc_uploaded_at) entries.push({ date: p.id_doc_uploaded_at, icon: '📄', label: "Pièce d'identité envoyée" });
  if(p && p.address_doc_uploaded_at) entries.push({ date: p.address_doc_uploaded_at, icon: '📄', label: 'Justificatif de domicile envoyé' });
  state.bookings.filter(b => b.username === username).forEach(b => {
    const item = state.items.find(i => i.id === b.item_id);
    entries.push({ date: b.start_date, icon: '📦', label: `Réservation ${esc(item ? item.name : 'matériel supprimé')} — ${fmtDate(b.start_date)} → ${fmtDate(b.end_date)} · ${STATUS_LABELS[b.status] || b.status}` });
  });
  state.completions.filter(c => c.username === username).forEach(c => {
    const task = state.tasks.find(t => t.id === c.task_id);
    const statusLabel = c.status === 'validee' ? 'validée' : c.status === 'refusee' ? 'refusée' : 'en attente';
    entries.push({ date: c.completed_at, icon: '🎯', label: `Mission "${esc(task ? task.title : 'supprimée')}" ${statusLabel}${task ? ` (+${task.xp_reward} XP)` : ''}${c.answer ? ` — réponse : ${esc(c.answer)}` : ''}` });
  });
  state.redemptions.filter(r => r.username === username).forEach(r => {
    const reward = state.rewards.find(x => x.id === r.reward_id);
    const statusLabel = r.status === 'validee' ? 'validée' : r.status === 'refusee' ? 'refusée' : 'demandée';
    entries.push({ date: r.resolved_at || r.requested_at, icon: '🎁', label: `Récompense "${esc(reward ? reward.name : 'supprimée')}" ${statusLabel}` });
  });
  const contract = state.contracts.find(c => c.username === username);
  if(contract && contract.signed_at) entries.push({ date: contract.signed_at, icon: '✍️', label: 'Contrat signé' });
  return entries.filter(e => e.date).sort((a, b) => b.date.localeCompare(a.date));
}
function clientHistoryHtml(username){
  const entries = clientHistoryEntries(username);
  if(!entries.length) return `<div class="empty">Aucune activité enregistrée pour ce compte.</div>`;
  const shown = entries.slice(0, 40);
  return `
    <div class="history-list">
      ${shown.map(e => `
        <div class="history-row">
          <div class="history-icon">${e.icon}</div>
          <div class="history-body"><div class="history-label">${e.label}</div><div class="history-date">${fmtDateTime(e.date)}</div></div>
        </div>`).join('')}
      ${entries.length > shown.length ? `<div class="card-desc" style="text-align:center;">+ ${entries.length - shown.length} entrée${entries.length-shown.length>1?'s':''} plus ancienne${entries.length-shown.length>1?'s':''}...</div>` : ''}
    </div>`;
}

// XP total (accueil) : ne s'anime que lorsque le chiffre change réellement (mission validée,
// réinitialisation par le master...) — jamais au premier affichage ni à chaque ré-rendu, pour
// ne pas rejouer l'effet à chaque connexion ou rafraîchissement en temps réel.
let __xpShown = null;
function animateXpTotal(){
  const el = document.getElementById('xp-total-num');
  if(!el) return;
  const target = parseInt(el.dataset.target, 10);
  if(__xpShown === null || __xpShown === target){ __xpShown = target; return; }
  const from = __xpShown;
  __xpShown = target;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const start = performance.now(), dur = 800;
  function step(ts){
    const p = Math.min(1, (ts - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (target - from) * eased);
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

  (e.currentTarget.closest('.nav-group') || e.currentTarget).classList.remove('drag-over');
  const sourceId = draggedNavId;
  draggedNavId = null;
  if(!sourceId || sourceId === targetId) return;
  reorderMasterNav(sourceId, targetId);
};
window.navDragEnd = (e) => {
  e.currentTarget.classList.remove('dragging');

function reorderMasterNav(sourceId, targetId){
  let order = getMasterNavOrder();

  order = order.filter(id => id !== sourceId);
  const tgtIdx = order.indexOf(targetId);
  order.splice(tgtIdx, 0, sourceId);
  saveMasterNavOrder(order);
  render();
}

function computeAvailabilityText(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return "";
  if(!start || !end || start > end) return "Merci de choisir une période valide.";
  if(bookingDurationDays({ start_date: start, end_date: end }) < MIN_BOOKING_DAYS) return `Durée minimum de location : ${MIN_BOOKING_DAYS} jours.`;
  const left = item.qty - activeBookingsCount(itemId, start, end);
  if(left <= 0) return `Complet sur cette période (0/${item.qty} disponible).`;
  return `${left}/${item.qty} disponible sur cette période.`;
}

};
function addDaysStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

  en.min = minEnd;
  if(en.value < minEnd) en.value = minEnd;
  updateAvailabilityPreview(itemId);
