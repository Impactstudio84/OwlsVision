<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Owls Vision — Location JVN</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050605">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Owls Vision">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root{
    --bg:#050605;
    --bg-glow: radial-gradient(1100px 620px at 18% -8%, rgba(143,239,61,0.07), transparent 62%);
    --surface: rgba(255,255,255,0.045);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.06);
    --accent:#8FEF3D;
    --accent-2:#5FDE8A;
    --accent-ink:#07130A;
    --accent-soft: rgba(143,239,61,0.14);
    --accent-soft-2: rgba(143,239,61,0.28);
    --text:#F4F7F1;
    --text-dim: rgba(244,247,241,0.62);
    --text-faint: rgba(244,247,241,0.38);
    --danger:#FF6B57;
    --danger-soft: rgba(255,107,87,0.14);
    --amber:#FFD166;
    --amber-soft: rgba(255,209,102,0.14);
    --r-sm:14px;
    --r-md:20px;
    --r-lg:28px;
    --r-pill:999px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-2: 0 10px 30px -8px rgba(0,0,0,0.55);
    --shadow-glow: 0 8px 24px -6px rgba(143,239,61,0.25);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-glow), var(--bg);
    background-attachment: fixed;
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ letter-spacing:-0.02em; margin:0; }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{min-height:100vh;}
  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background: radial-gradient(900px 560px at 50% 8%, rgba(143,239,61,0.10), transparent 65%), var(--bg);
  }
  .gate-card{
    width:100%;max-width:400px;background: var(--surface);border:1px solid var(--border);
    border-radius: var(--r-lg);padding:36px 32px;backdrop-filter: blur(24px);-webkit-backdrop-filter: blur(24px);
    box-shadow: var(--shadow-2);
  }
  .gate-brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px;}
  .gate-brand img{width:84px;height:84px;border-radius:26px;box-shadow: 0 0 0 1px var(--border), var(--shadow-glow);}
  .gate-brand .brand-name{font-size:26px;font-weight:700;color:var(--text);text-align:center;letter-spacing:-0.03em;}
  .gate-brand .brand-name span{color:var(--accent);}
  .gate-brand .brand-tag{font-size:12.5px;color:var(--text-faint);font-weight:500;text-align:center;}
  .tabs{display:flex;background: rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius: var(--r-pill);padding:4px;margin-bottom:22px;gap:2px;}
  .tabs button{flex:1;padding:10px 0;background:transparent;border:none;color:var(--text-dim);font-size:14px;font-weight:600;border-radius: var(--r-pill);transition: all .25s var(--ease);}
  .tabs button.active{color:var(--accent-ink);background:var(--accent);box-shadow: var(--shadow-glow);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-faint);margin-bottom:7px;font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%;background: rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);
    padding:13px 15px;border-radius: var(--r-sm);font-size:14.5px;outline:none;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--accent-soft-2); box-shadow: 0 0 0 4px var(--accent-soft); }
  .field .static-val{font-size:14.5px;color:var(--text);padding:12px 0 2px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius: var(--r-pill);
    border:1px solid transparent;font-size:14.5px;font-weight:600;
    transition: transform .12s var(--ease), filter .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;box-shadow: var(--shadow-glow);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:rgba(255,255,255,0.055);border-color:var(--border-soft);color:var(--text-dim);}
  .btn-ghost:hover{background:rgba(255,255,255,0.09);color:var(--text);}
  .btn-danger{background:var(--danger-soft);border-color:transparent;color:#FFB3A6;}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .msg{font-size:13.5px;padding:12px 15px;border-radius: var(--r-sm);margin-bottom:16px;font-weight:500;}
  .msg-error{background:var(--danger-soft);border:1px solid rgba(255,107,87,0.25);color:#FFB3A6;}
  .msg-ok{background:var(--accent-soft);border:1px solid var(--accent-soft-2);color:var(--accent);}

  .shell{display:flex;min-height:100vh;gap:16px;padding:16px;}
  .sidebar{
    width:246px;flex-shrink:0;background: var(--surface);border:1px solid var(--border);border-radius: var(--r-lg);
    display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);
    backdrop-filter: blur(24px);-webkit-backdrop-filter: blur(24px);box-shadow: var(--shadow-1);overflow:hidden;
  }
  .side-brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid var(--border-soft);}
  .side-brand img{width:40px;height:40px;border-radius:12px;}
  .side-brand .name{font-size:16px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;}
  .side-brand .name span{color:var(--accent);}
  .side-brand .sub{font-size:10.5px;color:var(--text-faint);font-weight:500;}
  .nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
  .nav button{
    display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--text-dim);
    padding:11px 14px;border-radius: var(--r-sm);font-size:14px;text-align:left;font-weight:500;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .nav button svg{width:18px;height:18px;flex-shrink:0;opacity:0.85;}
  .nav button:hover{background:rgba(255,255,255,0.05);color:var(--text);}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav button.active svg{opacity:1;}
  .side-foot{padding:16px;border-top:1px solid var(--border-soft);}
  .side-user{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .avatar{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;}
  .side-user .u-name{font-size:13.5px;font-weight:600;word-break:break-all;}
  .side-user .u-rank{font-size:11.5px;color:var(--text-faint);}

  .main{flex:1;min-width:0;padding:12px 20px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .topbar h1{font-size:28px;font-weight:700;}
  .topbar .desc{color:var(--text-dim);font-size:14.5px;margin-top:6px;max-width:480px;line-height:1.5;}

  .xp-card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:18px 20px;min-width:270px;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);}
  .xp-card .xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .xp-card .xp-rank{font-size:14px;font-weight:700;color:var(--accent);}
  .xp-card .xp-num{font-size:12px;color:var(--text-faint);font-weight:500;}
  .xp-bar-track{height:10px;background:rgba(255,255,255,0.06);border-radius:var(--r-pill);overflow:hidden;position:relative;}
  .xp-bar-fill{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg, var(--accent-2), var(--accent));transition:width .8s var(--ease);position:relative;overflow:hidden;}
  .xp-bar-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.35) 40%, transparent 60%);
    background-size:200% 100%;animation: shimmer 2.8s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{background-position:160% 0;} 100%{background-position:-60% 0;} }

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(272px,1fr));gap:18px;}
  .card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;display:flex;flex-direction:column;gap:12px;transition: transform .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);}
  .card:hover{background:var(--surface-hover);transform:translateY(-3px);box-shadow:var(--shadow-2);}
  .card h3{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .card .card-desc{font-size:13.5px;color:var(--text-dim);line-height:1.55;flex:1;}
  .card .card-photo{width:calc(100% + 44px);margin:-22px -22px 0;height:150px;object-fit:cover;display:block;border-radius:var(--r-md) var(--r-md) 0 0;}
  .card .card-photo-ph{width:calc(100% + 44px);margin:-22px -22px 0;height:110px;display:flex;align-items:center;justify-content:center;font-size:34px;background:rgba(255,255,255,0.03);border-radius:var(--r-md) var(--r-md) 0 0;opacity:.5;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:var(--r-pill);width:fit-content;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--border-soft);}
  .qty-pill{font-size:12px;color:var(--text-faint);font-weight:500;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;padding:12px 14px;color:var(--text-faint);font-weight:600;font-size:12px;border-bottom:1px solid var(--border-soft);}
  td{padding:14px;border-bottom:1px solid var(--border-soft);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .panel{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);}
  .panel + .panel{margin-top:18px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  .empty{padding:36px 20px;text-align:center;color:var(--text-faint);border:1.5px dashed var(--border);border-radius: var(--r-md);font-size:14px;font-weight:500;}

  .mission-card{position:relative;}
  .mission-card.done{opacity:.62;}
  .mission-head{display:flex;align-items:flex-start;gap:12px;}
  .mission-icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .mission-card.done .mission-icon{background:rgba(255,255,255,0.06);}
  .task-xp{font-size:12.5px;color:var(--accent);font-weight:600;background:var(--accent-soft);padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap;display:inline-block;margin-top:6px;}
  .submission-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-dim);padding:8px 0;border-top:1px solid var(--border-soft);}
  .modal-bg{position:fixed;inset:0;background:rgba(3,5,3,0.6);backdrop-filter: blur(6px);-webkit-backdrop-filter: blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background: #0E100E;border:1px solid var(--border);border-radius: var(--r-lg);width:100%;max-width:430px;padding:26px;box-shadow: var(--shadow-2);max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:19px;margin-bottom:16px;font-weight:700;letter-spacing:-0.01em;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .section-title{font-size:13px;color:var(--text-faint);margin-bottom:14px;font-weight:600;}
  .hamburger{display:none;}
  .mobile-topbar{display:none;}
  .mobile-topbar img{width:26px;height:26px;border-radius:8px;}

  /* ---------- Filter bar (Gestion location) ---------- */
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .filter-bar input[type=text]{flex:2;min-width:200px;background: rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);padding:11px 14px;border-radius: var(--r-sm);font-size:14px;outline:none;}
  .filter-bar select{flex:1;min-width:150px;background: rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);padding:11px 14px;border-radius: var(--r-sm);font-size:14px;outline:none;}
  .filter-bar input:focus, .filter-bar select:focus{border-color: var(--accent-soft-2); box-shadow: 0 0 0 4px var(--accent-soft);}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--text);}
  th.sortable .sort-arrow{opacity:.55;margin-left:4px;}
  .result-count{font-size:12.5px;color:var(--text-faint);margin-bottom:12px;font-weight:500;}

  /* ---------- Dashboard gauges ---------- */
  .gauge-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(230px,1fr));gap:18px;}
  .gauge-card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;display:flex;flex-direction:column;align-items:center;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);}
  .gauge-label{font-size:13px;color:var(--text-dim);font-weight:600;margin-top:4px;}
  .gauge-value{font-size:30px;font-weight:800;letter-spacing:-0.02em;margin-top:6px;}
  .gauge-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .gauge-svg{width:100%;max-width:190px;}
  .gauge-needle{transition: transform 1s var(--ease);transform-box: view-box;transform-origin: 100px 100px;}

  /* ---------- Documents (fiche membre) ---------- */
  .doc-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius: var(--r-md);background: rgba(255,255,255,0.03);flex-wrap:wrap;margin-bottom:12px;}
  .doc-row .doc-title{font-weight:600;font-size:14.5px;}
  .doc-row .doc-sub{font-size:12px;color:var(--text-faint);margin-top:4px;}
  .doc-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .profile-warning{background: var(--amber-soft);border:1px solid rgba(255,209,102,0.3);color:var(--amber);font-size:13.5px;padding:14px 16px;border-radius: var(--r-sm);margin-bottom:18px;font-weight:500;line-height:1.5;}

  /* ---------- Hero XP (accueil) ---------- */
  .hero-wrap{display:flex;justify-content:center;margin-bottom:6px;}
  .xp-hero{
    width:100%;max-width:460px;text-align:center;padding:38px 30px;border-radius:var(--r-lg);
    background: radial-gradient(120% 140% at 50% -10%, rgba(143,239,61,0.14), transparent 60%), var(--surface);
    border:1px solid var(--border);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    animation: heroGlow 4s ease-in-out infinite;
  }
  @keyframes heroGlow{ 0%,100%{ box-shadow: 0 0 0 0 rgba(143,239,61,0);} 50%{ box-shadow: 0 0 44px 6px rgba(143,239,61,0.10);} }
  .xp-ring{
    width:126px;height:126px;border-radius:50%;margin:0 auto 16px;position:relative;
    background: conic-gradient(var(--accent) calc(var(--pct,0)*1%), rgba(255,255,255,0.07) 0);
    display:flex;align-items:center;justify-content:center;
  }
  .xp-ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:#0c0e0c;}
  .ring-owl{position:relative;font-size:42px;filter: drop-shadow(0 0 14px rgba(143,239,61,0.45));}
  .xp-hero-rank{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
  .xp-hero-level{font-size:13.5px;color:var(--accent);font-weight:700;margin:5px 0 20px;}
  .xp-bar-track-lg{height:16px;}
  .xp-hero-num{font-size:12.5px;color:var(--text-faint);margin-top:12px;font-weight:500;}

  .levelup-toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:12px;
    background: rgba(14,16,14,0.94);border:1px solid var(--accent-soft-2);border-radius: var(--r-pill);padding:12px 24px 12px 16px;
    box-shadow: var(--shadow-glow);transition: transform .35s var(--ease), opacity .35s var(--ease);z-index:100;backdrop-filter:blur(16px);
  }
  .levelup-toast.show{transform:translate(-50%,0);opacity:1;}
  .levelup-badge{font-size:24px;}
  .levelup-title{font-weight:800;color:var(--accent);font-size:14.5px;}
  .levelup-sub{font-size:12px;color:var(--text-dim);}

  /* ---------- Fullscreen signature modal ---------- */
  .modal-full{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;}
  .modal-full-bar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:1px solid var(--border-soft);background: rgba(5,6,5,0.9);backdrop-filter:blur(14px);z-index:2;}
  .modal-full-back{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:var(--text);}
  .modal-full-title{font-weight:700;font-size:15.5px;}
  .modal-full-body{flex:1;overflow-y:auto;padding:20px 18px calc(48px + env(safe-area-inset-bottom));}
  .sig-pad-wrap{border:1.5px dashed var(--border);border-radius:var(--r-md);background:rgba(255,255,255,0.03);overflow:hidden;margin-bottom:12px;}
  #sig-canvas{width:100%;height:220px;display:block;touch-action:none;}
  .check-row{display:flex;align-items:flex-start;gap:10px;margin:18px 0;font-size:13.5px;color:var(--text-dim);line-height:1.4;}
  .check-row input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);white-space:nowrap;}
  .status-pill.ok{background:var(--accent-soft);color:var(--accent);}
  .status-pill.pending{background: var(--amber-soft);color:var(--amber);}
  .status-pill.none{background:rgba(255,255,255,0.06);color:var(--text-faint);}
  .status-pill.info{background:rgba(107,168,255,0.14);color:#6BA8FF;}
  .status-pill.danger{background:var(--danger-soft);color:#FFB3A6;}
  .file-btn{position:relative;overflow:hidden;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .checkbox-field{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-dim);margin:4px 0 16px;}
  .checkbox-field input{width:18px;height:18px;accent-color:var(--accent);}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--border);border-radius: var(--r-md);background: var(--surface);transition: background .2s var(--ease);flex-wrap:wrap;}
  .list-row:hover{background:var(--surface-hover);}
  .list-row .t-title{font-weight:600;font-size:15px;}
  .list-row .t-desc{font-size:13px;color:var(--text-dim);margin-top:4px;}
  .admin-link-wrap{text-align:center;margin-top:20px;}
  .admin-link-wrap button{background:none;border:none;color:var(--text-faint);font-size:11.5px;text-decoration:underline;padding:4px;}

    .hamburger{display:flex;width:38px;height:38px;border:1px solid var(--border);border-radius: var(--r-sm);background:var(--surface);align-items:center;justify-content:center;flex-shrink:0;}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:39;}

    .xp-card{width:100%;min-width:0;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   OWLS VISION — backend Supabase
   ========================================================= */
const SUPABASE_URL = "https://zopnuziuhmnkezyisoex.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_EJtogFic_Yu5eO9n1u2s0Q_LH4KbTVe";
const SITE_URL = "https://impactstudio84.github.io/OwlsVision/";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let bootDone = false;

const RANKS = [
  {min:0,   name:"Recrue"},
  {min:150, name:"Éclaireur"},
  {min:400, name:"Sentinelle"},
  {min:800, name:"Vigie de nuit"},
  {min:1400,name:"Rapace"},
  {min:2200,name:"Chouette d'élite"},
];
const XP_STEP = 150;
function rankFor(xp){ let r = RANKS[0]; for(const c of RANKS){ if(xp >= c.min) r = c; } return r.name; }
function levelFor(xp){ return Math.floor(xp / XP_STEP) + 1; }
function xpInLevel(xp){ return xp % XP_STEP; }
const todayStr = () => new Date().toISOString().slice(0,10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('fr-FR') : '—';
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('fr-FR') : 'Jamais connecté';

let state = {
  loading: true,
  fatalError: null,
  session: null, // {username(=email pour les clients), isMaster}
  profiles: [], items: [], bookings: [], tasks: [], completions: [], contracts: [],
  view: "accueil",
  authTab: "login",
  showAdminLogin: false,
  authError: "",
  authNotice: "",
  sidebarOpen: false,
  modal: null,
  bookingError: "",
  answerError: "",
  profileError: "",
  profileSaved: false,
  profileNotice: "",
  docError: "",
  gestionSearch: "",
  gestionFilter: "all",
  gestionSort: { field: "start_date", dir: "asc" },
};

const STATUS_LABELS = {
  demande: "Demande envoyée",
  accepte: "Acceptée",
  loue: "En cours de location",
  retourne: "Retournée",
  refuse: "Refusée",
};
function statusPillHtml(status){
  const cls = { demande:"pending", accepte:"info", loue:"ok", retourne:"none", refuse:"danger" }[status] || "none";
  return `<span class="status-pill ${cls}">${STATUS_LABELS[status] || status}</span>`;
}
function isProfileComplete(p){
  return !!(p && p.nom && p.prenom && p.date_naissance && p.telephone && p.adresse);
}
function clientDisplayName(p){
  if(!p) return "";
  const full = [p.prenom, p.nom].filter(Boolean).join(" ");
  return full || p.username;
}

function currentProfile(){ return state.profiles.find(p => p.username === state.session?.username) || null; }

/* ---------- Boot & data ---------- */
async function fetchAll(){
  const [profiles, items, bookings, tasks, completions, contracts] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('items').select('*').order('created_at'),
    sb.from('bookings').select('*'),
    sb.from('tasks').select('*').order('created_at'),
    sb.from('task_completions').select('*'),
    sb.from('contracts').select('*'),
  ]);
  state.profiles = profiles.data || [];
  state.items = items.data || [];
  state.bookings = bookings.data || [];
  state.tasks = tasks.data || [];
  state.completions = completions.data || [];
  state.contracts = contracts.data || [];
}

async function boot(){
  if(SUPABASE_URL.includes("VOTRE-PROJET")){
    state.loading = false;
    state.fatalError = "Configuration Supabase manquante : ouvre le fichier et renseigne SUPABASE_URL et SUPABASE_ANON_KEY en haut du script.";
    render();
    return;
  }
  try{
    await fetchAll();
  }catch(e){
    state.loading = false;
    state.fatalError = "Impossible de contacter Supabase. Vérifie ton URL/clé et que le script SQL a bien été exécuté. (" + e.message + ")";
    render();
    return;
  }

  // Session administrateur (stockée localement, hors Supabase Auth)
  const savedAdmin = localStorage.getItem('ov_admin_session');
  if(savedAdmin){
    try{
      const parsed = JSON.parse(savedAdmin);
      const stillExists = state.profiles.find(p => p.username === parsed.username && p.is_master);
      if(stillExists){ state.session = { username: stillExists.username, isMaster:true }; }
      else localStorage.removeItem('ov_admin_session');
    }catch(e){ localStorage.removeItem('ov_admin_session'); }
  }

  // Session client (Supabase Auth)
  if(!state.session){
    const { data: { session } } = await sb.auth.getSession();
    if(session?.user?.email){
      await ensureClientProfile(session.user.email);
      state.session = { username: session.user.email, isMaster:false };
    }
  }

  state.loading = false;
  state.view = state.session?.isMaster ? "dashboard" : "accueil";
  render();
  subscribeRealtime();
  bootDone = true;
}

sb.auth.onAuthStateChange((event, session) => {
  if(!bootDone) return;
  if(event === 'SIGNED_IN' && session?.user?.email && (!state.session || state.session.isMaster === false)){
    ensureClientProfile(session.user.email).then(() => {
      state.session = { username: session.user.email, isMaster:false };
      render();
    });
  }
  if(event === 'SIGNED_OUT' && state.session && !state.session.isMaster){
    state.session = null; state.view = "accueil"; render();
  }
});

function subscribeRealtime(){
  const channel = sb.channel('ov-sync');
  ['items','bookings','tasks','task_completions','contracts','profiles'].forEach(table => {
    channel.on('postgres_changes', { event:'*', schema:'public', table }, () => {
      clearTimeout(window.__ovSyncTimer);
      window.__ovSyncTimer = setTimeout(async () => {
        try{ await fetchAll(); render(); }catch(e){}
      }, 500);
    });
  });
  channel.subscribe();
}

/* ---------- Auth : clients (Supabase Auth + email) ---------- */
async function ensureClientProfile(email){
  const key = email.toLowerCase();
  let prof = state.profiles.find(p => p.username.toLowerCase() === key);
  const now = new Date().toISOString();
  if(!prof){
    const { data, error } = await sb.from('profiles').insert({ username: email, is_master:false, xp:0, created_at: now, last_login: now }).select().single();
    if(!error){ state.profiles.push(data); prof = data; }
  } else {
    await sb.from('profiles').update({ last_login: now }).eq('username', prof.username);
    prof.last_login = now;
  }
  return prof;
}

async function doClientLogin(email, password){
  email = email.trim().toLowerCase();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    state.authError = /confirm/i.test(error.message)
      ? "Merci de confirmer votre adresse email avant de vous connecter (vérifiez votre boîte mail, y compris les spams)."
      : "Email ou mot de passe incorrect.";
    render(); return;
  }
  await ensureClientProfile(email);
  state.session = { username: email, isMaster:false };
  state.authError = ""; state.authNotice = ""; state.profileNotice = ""; state.docError = "";
  state.view = "accueil";
  render();
}

async function doClientRegister(email, password, password2){
  email = email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.authError = "Merci d'indiquer une adresse email valide."; render(); return; }
  if(password.length < 6){ state.authError = "Le mot de passe doit faire au moins 6 caractères."; render(); return; }
  if(password !== password2){ state.authError = "Les mots de passe ne correspondent pas."; render(); return; }
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: SITE_URL }
  });
  if(error){
    if(/rate limit|only request this after/i.test(error.message)){
      state.authError = "Trop de tentatives rapprochées. Merci de patienter une minute avant de réessayer, ou utilisez « Renvoyer l'email de confirmation » ci-dessous.";
    } else {
      state.authError = "Erreur lors de la création du compte : " + error.message;
    }
    render(); return;
  }
  state.authError = "";
  if(data.session){
    await ensureClientProfile(email);
    state.session = { username: email, isMaster:false };
    state.view = "accueil";
    render();
    return;
  }
  // Supabase renvoie un "utilisateur" sans identités quand le compte existe déjà mais n'est pas confirmé :
  // dans ce cas on force nous-même un renvoi d'email, car un signUp répété ne le fait pas toujours de façon fiable.
  const alreadyExists = data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0;
  if(alreadyExists){
    const { error: resendErr } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: SITE_URL } });
    state.authNotice = resendErr
      ? "Un compte existe déjà avec cet email mais n'est pas confirmé, et le renvoi automatique a échoué (" + resendErr.message + "). Utilisez le bouton « Renvoyer l'email de confirmation »."
      : "Un compte existait déjà avec cet email mais n'était pas confirmé : nous venons de renvoyer l'email de confirmation à " + email + ".";
  } else {
    state.authNotice = "Un email de confirmation vient d'être envoyé à " + email + ". Ouvrez-le, cliquez sur le lien, puis connectez-vous ici.";
  }
  state.lastRegisterEmail = email;
  state.authTab = "login";
  render();
}

async function resendConfirmationEmail(email){
  email = (email || state.lastRegisterEmail || "").trim().toLowerCase();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    state.authError = "Merci d'indiquer votre adresse email dans le champ ci-dessus, puis de cliquer à nouveau sur « Renvoyer l'email de confirmation ».";
    render(); return;
  }
  state.authError = ""; state.authNotice = "Envoi en cours...";
  render();
  const { error } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: SITE_URL } });
  if(error){
    if(/rate limit|only request this after/i.test(error.message)){
      state.authNotice = "";
      state.authError = "Merci de patienter un peu avant de redemander un nouvel email (limite anti-spam).";
    } else {
      state.authNotice = "";
      state.authError = "Erreur lors du renvoi : " + error.message;
    }
  } else {
    state.authNotice = "Email de confirmation renvoyé à " + email + ". Pensez à vérifier vos spams.";
  }
  render();
}

/* ---------- Auth : équipe (identifiant/mot de passe local) ---------- */
async function doAdminLogin(username, password){
  const match = state.profiles.find(p => p.is_master && p.username.toLowerCase() === username.trim().toLowerCase() && p.password === password);
  if(!match){ state.authError = "Identifiants incorrects."; render(); return; }
  const now = new Date().toISOString();
  await sb.from('profiles').update({ last_login: now }).eq('username', match.username);
  match.last_login = now;
  state.session = { username: match.username, isMaster:true };
  localStorage.setItem('ov_admin_session', JSON.stringify(state.session));
  state.authError = ""; state.profileNotice = ""; state.docError = "";
  state.view = "dashboard";
  render();
}

function logout(){
  state.profileNotice = ""; state.docError = ""; state.gestionSearch = ""; state.gestionFilter = "all";
  if(state.session?.isMaster){
    localStorage.removeItem('ov_admin_session');
    state.session = null; state.view = "accueil"; render();
  } else {
    sb.auth.signOut().finally(() => { state.session = null; state.view = "accueil"; render(); });
  }
}

/* ---------- Level up feedback ---------- */
function checkLevelUp(oldXp, newXp){
  if(levelFor(newXp) > levelFor(oldXp)) showLevelUpToast(levelFor(newXp), rankFor(newXp));
}
function showLevelUpToast(level, rank){
  const el = document.createElement('div');
  el.className = 'levelup-toast';
  el.innerHTML = `<div class="levelup-badge">🦉</div><div><div class="levelup-title">Niveau ${level} !</div><div class="levelup-sub">${esc(rank)}</div></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 2600);
}
async function grantXp(username, amount){
  const prof = state.profiles.find(p => p.username === username);
  if(!prof) return;
  const oldXp = prof.xp;
  const newXp = oldXp + amount;
  await sb.from('profiles').update({ xp: newXp }).eq('username', username);
  prof.xp = newXp;
  if(username === state.session?.username) checkLevelUp(oldXp, newXp);
}

/* ---------- Bookings ---------- */
function overlaps(aStart, aEnd, bStart, bEnd){ return aStart <= bEnd && bStart <= aEnd; }
function activeBookingsCount(itemId, start, end){
  // Seules les locations pas encore refusées / retournées bloquent le stock disponible.
  return state.bookings.filter(b => b.item_id === itemId && ['demande','accepte','loue'].includes(b.status) && overlaps(b.start_date, b.end_date, start, end)).length;
}
async function submitBooking(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return;
  const u = currentProfile();
  if(!isProfileComplete(u)){ state.bookingError = "Merci de compléter votre fiche membre avant de réserver."; render(); return; }
  if(!start || !end || start > end){ state.bookingError = "Merci de choisir une période valide."; render(); return; }
  if(start < todayStr()){ state.bookingError = "La date de début ne peut pas être dans le passé."; render(); return; }
  if(activeBookingsCount(itemId, start, end) >= item.qty){
    state.bookingError = `Aucun exemplaire disponible sur cette période (${item.qty} en stock).`; render(); return;
  }
  const { data, error } = await sb.from('bookings').insert({ item_id: itemId, username: state.session.username, start_date: start, end_date: end, status: 'demande' }).select().single();
  if(error){ state.bookingError = "Erreur : " + error.message; render(); return; }
  state.bookings.push(data);
  await grantXp(state.session.username, item.xp_value);
  state.bookingError = "";
  state.modal = { type: "bookConfirm", itemName: item.name };
  render();
}
async function cancelBooking(id){
  const b = state.bookings.find(x => x.id === id);
  if(!b) return;
  const isOwner = b.username === state.session.username;
  if(!isOwner && !state.session.isMaster) return;
  if(isOwner && !state.session.isMaster && b.status !== 'demande'){
    alert("Cette demande a déjà été traitée par notre équipe. Contactez-nous directement pour l'annuler.");
    return;
  }
  await sb.from('bookings').delete().eq('id', id);
  state.bookings = state.bookings.filter(x => x.id !== id);
  render();
}
async function setBookingStatus(id, status){
  if(!state.session.isMaster) return;
  const { data, error } = await sb.from('bookings').update({ status }).eq('id', id).select().single();
  if(error){ alert("Erreur : " + error.message); return; }
  const idx = state.bookings.findIndex(b => b.id === id);
  if(idx > -1) state.bookings[idx] = data;
  render();
}

/* ---------- Items (équipe) ---------- */
async function createItem(name, description, xpValue, qty, imageUrl){
  if(!name.trim()) return;
  const { data, error } = await sb.from('items').insert({ name, description, xp_value: Number(xpValue)||10, qty: Number(qty)||1, image_url: imageUrl || null }).select().single();
  if(error){ alert("Erreur : " + error.message); return; }
  state.items.push(data);
  state.modal = null;
  render();
}
async function deleteItem(id){
  await sb.from('items').delete().eq('id', id);
  state.items = state.items.filter(i => i.id !== id);
  state.bookings = state.bookings.filter(b => b.item_id !== id);
  render();
}

/* ---------- Tasks / missions ---------- */
async function createTask(title, description, xpReward, requiresAnswer, answerLabel){
  if(!title.trim()) return;
  const { data, error } = await sb.from('tasks').insert({
    title, description, xp_reward: Number(xpReward)||10,
    requires_answer: !!requiresAnswer, answer_label: requiresAnswer ? (answerLabel || "Votre réponse") : null
  }).select().single();
  if(error){ alert("Erreur : " + error.message); return; }
  state.tasks.push(data);
  state.modal = null;
  render();
}
async function deleteTask(id){
  if(!state.session.isMaster) return;
  await sb.from('tasks').delete().eq('id', id);
  state.tasks = state.tasks.filter(t => t.id !== id);
  state.completions = state.completions.filter(c => c.task_id !== id);
  render();
}
function hasCompleted(taskId, username){
  return state.completions.some(c => c.task_id === taskId && c.username === username);
}
async function completeTask(taskId, answer){
  const task = state.tasks.find(t => t.id === taskId);
  if(!task || hasCompleted(taskId, state.session.username)) return;
  const { data, error } = await sb.from('task_completions').insert({ task_id: taskId, username: state.session.username, answer: answer || null }).select().single();
  if(error){ state.answerError = "Erreur : " + error.message; render(); return; }
  state.completions.push(data);
  await grantXp(state.session.username, task.xp_reward);
  state.answerError = "";
  state.modal = null;
  render();
}

/* ---------- Profiles (équipe) ---------- */
async function deleteProfile(username){
  if(!confirm(`Supprimer définitivement le compte "${username}" ? Cette action est irréversible.`)) return;
  const { error } = await sb.from('profiles').delete().eq('username', username);
  if(error){ alert("Erreur : " + error.message); return; }
  await sb.storage.from('documents').remove([`${username}/id_doc`, `${username}/address_doc`]);
  await sb.storage.from('contracts').remove([`${username}/original.pdf`, `${username}/signed.pdf`]);
  state.profiles = state.profiles.filter(p => p.username !== username);
  state.bookings = state.bookings.filter(b => b.username !== username);
  state.completions = state.completions.filter(c => c.username !== username);
  state.contracts = state.contracts.filter(c => c.username !== username);
  render();
}
async function saveProfile(){
  const u = currentProfile();
  const payload = {
    nom: document.getElementById('pf-nom').value.trim(),
    prenom: document.getElementById('pf-prenom').value.trim(),
    date_naissance: document.getElementById('pf-dob').value || null,
    telephone: document.getElementById('pf-tel').value.trim(),
    numero_cni: document.getElementById('pf-cni').value.trim(),
    adresse: document.getElementById('pf-adresse').value.trim(),
  };
  const { data, error } = await sb.from('profiles').update(payload).eq('username', u.username).select().single();
  if(error){ state.profileError = "Erreur : " + error.message; state.profileSaved = false; render(); return; }
  Object.assign(u, data);
  state.profileError = ""; state.profileSaved = true;
  if(isProfileComplete(u)) state.profileNotice = "";
  render();
}

/* ---------- Contracts ---------- */
async function masterUploadContract(username, file){
  // Chemin stable (pas d'horodatage) : un nouvel envoi remplace l'ancien fichier au lieu de s'accumuler dans le stockage.
  const path = `${username}/original.pdf`;
  const { error: upErr } = await sb.storage.from('contracts').upload(path, file, { upsert: true, contentType: 'application/pdf' });
  if(upErr){ alert("Erreur d'envoi du PDF : " + upErr.message); return; }
  await sb.storage.from('contracts').remove([`${username}/signed.pdf`]);
  const { data: pub } = sb.storage.from('contracts').getPublicUrl(path);
  const payload = { username, pdf_path: pub.publicUrl + '?v=' + Date.now(), uploaded_at: new Date().toISOString(), signed_pdf_path: null, signed_at: null };
  const { data, error } = await sb.from('contracts').upsert(payload, { onConflict: 'username' }).select().single();
  if(error){ alert("Erreur : " + error.message); return; }
  const idx = state.contracts.findIndex(c => c.username === username);
  if(idx > -1) state.contracts[idx] = data; else state.contracts.push(data);
  render();
}
async function masterDeleteContract(username){
  if(!confirm(`Supprimer le contrat de "${username}" (original + version signée) ?`)) return;
  await sb.storage.from('contracts').remove([`${username}/original.pdf`, `${username}/signed.pdf`]);
  const { error } = await sb.from('contracts').delete().eq('username', username);
  if(error){ alert("Erreur : " + error.message); return; }
  state.contracts = state.contracts.filter(c => c.username !== username);
  render();
}

/* ---------- Documents fiche membre (pièce d'identité / justificatif de domicile) ---------- */
const MEMBER_DOC_DEFS = {
  id: { pathCol: 'id_doc_path', dateCol: 'id_doc_uploaded_at', label: "Pièce d'identité" },
  address: { pathCol: 'address_doc_path', dateCol: 'address_doc_uploaded_at', label: "Justificatif de domicile (- de 3 mois)" },
};
async function uploadMemberDoc(kind, file, username){
  const def = MEMBER_DOC_DEFS[kind];
  if(!def || !file) return;
  const okType = /^image\//.test(file.type) || file.type === 'application/pdf';
  if(!okType){ state.docError = "Format non supporté : merci d'envoyer une photo (JPG/PNG) ou un PDF."; render(); return; }
  const storagePath = `${username}/${kind}_doc`;
  const { error: upErr } = await sb.storage.from('documents').upload(storagePath, file, { upsert: true, contentType: file.type });
  if(upErr){ state.docError = "Erreur d'envoi : " + upErr.message; render(); return; }
  const payload = { [def.pathCol]: storagePath, [def.dateCol]: new Date().toISOString() };
  const { data, error } = await sb.from('profiles').update(payload).eq('username', username).select().single();
  if(error){ state.docError = "Erreur : " + error.message; render(); return; }
  const p = state.profiles.find(x => x.username === username);
  if(p) Object.assign(p, data);
  state.docError = "";
  render();
}
async function deleteMemberDoc(kind, username){
  const def = MEMBER_DOC_DEFS[kind];
  if(!def) return;
  if(!confirm(`Supprimer ce document (${def.label}) ?`)) return;
  await sb.storage.from('documents').remove([`${username}/${kind}_doc`]);
  const payload = { [def.pathCol]: null, [def.dateCol]: null };
  const { data, error } = await sb.from('profiles').update(payload).eq('username', username).select().single();
  if(error){ state.docError = "Erreur : " + error.message; render(); return; }
  const p = state.profiles.find(x => x.username === username);
  if(p) Object.assign(p, data);
  render();
}
function docRowHtml(kind, p, editable){
  const def = MEMBER_DOC_DEFS[kind];
  const has = !!p[def.pathCol];
  return `
    <div class="doc-row">
      <div>
        <div class="doc-title">${def.label}</div>

let sigCtx = null, sigDrawing = false, sigHasInk = false;
function openSignaturePad(){
  const contract = state.contracts.find(c => c.username === state.session.username);
  if(!contract) return;
  const wrap = document.createElement('div');
  wrap.className = 'modal-full';
  wrap.id = 'sig-modal';
  wrap.innerHTML = `
    <div class="modal-full-bar">

    </div>
    <div class="modal-full-body">
      <p style="color:var(--text-dim);font-size:13.5px;line-height:1.6;margin-bottom:16px;">
        Ouvrez d'abord le contrat pour le lire attentivement, puis signez ci-dessous avec le doigt ou la souris.
      </p>
      <a class="btn btn-ghost" style="margin-bottom:20px;width:100%;" href="${contract.pdf_path}" target="_blank" rel="noopener">📄 Ouvrir le contrat (PDF)</a>
      <div class="section-title">Votre signature</div>
      <div class="sig-pad-wrap"><canvas id="sig-canvas"></canvas></div>
      <button class="btn btn-ghost btn-sm" onclick="clearSignature()">Effacer la signature</button>
      <label class="check-row"><input type="checkbox" id="sig-accept"> J'ai lu ce contrat et j'en accepte les termes.</label>
      <div id="sig-error"></div>
      <button class="btn btn-primary" onclick="submitSignature()" style="width:100%;margin-top:4px;">Valider et signer</button>
      <button class="btn btn-ghost" onclick="closeSignaturePad()" style="width:100%;margin-top:10px;">Retour</button>
    </div>
  `;
  document.body.appendChild(wrap);
  initSignaturePad();
}
window.closeSignaturePad = () => { const el = document.getElementById('sig-modal'); if(el) el.remove(); };
function initSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.4;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#F4F7F1';
  sigHasInk = false;
  const pos = (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
  const start = (e) => { e.preventDefault(); sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  const move = (e) => { if(!sigDrawing) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHasInk = true; };
  const end = () => { sigDrawing = false; };
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
}
window.clearSignature = () => {
  const c = document.getElementById('sig-canvas'); if(!c) return;
  const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); sigHasInk = false;
};
async function submitSignature(){
  const errEl = document.getElementById('sig-error');
  const accept = document.getElementById('sig-accept');
  if(!sigHasInk){ errEl.innerHTML = `<div class="msg msg-error">Merci de dessiner votre signature.</div>`; return; }
  if(!accept.checked){ errEl.innerHTML = `<div class="msg msg-error">Merci de cocher la case d'acceptation.</div>`; return; }
  errEl.innerHTML = "";
  const btn = event.target; const oldLabel = btn.textContent; btn.textContent = "Signature en cours..."; btn.disabled = true;
  try{
    const canvas = document.getElementById('sig-canvas');
    const dataUrl = canvas.toDataURL('image/png');
    const contract = state.contracts.find(c => c.username === state.session.username);
    const resp = await fetch(contract.pdf_path);
    const bytes = await resp.arrayBuffer();
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.load(bytes);
    const pngImage = await pdfDoc.embedPng(dataUrl);
    const pages = pdfDoc.getPages();
    const lastPage = pages[pages.length - 1];
    const { width } = lastPage.getSize();
    const dims = pngImage.scale(0.35);
    lastPage.drawImage(pngImage, { x: width - dims.width - 50, y: 60, width: dims.width, height: dims.height });
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    lastPage.drawText(`Signe electroniquement par ${state.session.username} le ${new Date().toLocaleDateString('fr-FR')}`, { x: 50, y: 40, size: 9, font, color: rgb(0.55,0.55,0.55) });
    const signedBytes = await pdfDoc.save();
    const blob = new Blob([signedBytes], { type: 'application/pdf' });
    const signedPath = `${state.session.username}/signed.pdf`;
    const { error: upErr } = await sb.storage.from('contracts').upload(signedPath, blob, { upsert: true, contentType: 'application/pdf' });
    if(upErr) throw upErr;
    const { data: pub } = sb.storage.from('contracts').getPublicUrl(signedPath);
    const { data, error } = await sb.from('contracts').update({ signed_pdf_path: pub.publicUrl + '?v=' + Date.now(), signed_at: new Date().toISOString() }).eq('username', state.session.username).select().single();
    if(error) throw error;
    const idx = state.contracts.findIndex(c => c.username === state.session.username);
    state.contracts[idx] = data;
    const dlUrl = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = dlUrl; a.download = `contrat-signe-${state.session.username}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    closeSignaturePad();
    render();
  }catch(e){
    errEl.innerHTML = `<div class="msg msg-error">Erreur lors de la signature : ${esc(e.message||String(e))}</div>`;
    btn.textContent = oldLabel; btn.disabled = false;
  }
}

function gestionFilteredSorted(){
  const q = (state.gestionSearch||'').trim().toLowerCase();
  let list = state.bookings.filter(b => {
    if(state.gestionFilter !== 'all' && b.status !== state.gestionFilter) return false;
    if(!q) return true;
    const p = state.profiles.find(x => x.username === b.username);
    const item = state.items.find(i => i.id === b.item_id);
    const hay = [b.username, p?.nom, p?.prenom, item?.name].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  const { field, dir } = state.gestionSort;
  const mult = dir === 'asc' ? 1 : -1;
  list.sort((a,b) => {
    let av, bv;
    if(field === 'client'){ av = clientDisplayName(state.profiles.find(x=>x.username===a.username)).toLowerCase(); bv = clientDisplayName(state.profiles.find(x=>x.username===b.username)).toLowerCase(); }
    else if(field === 'status'){ av = a.status; bv = b.status; }
    else if(field === 'item'){ av = (state.items.find(i=>i.id===a.item_id)?.name||'').toLowerCase(); bv = (state.items.find(i=>i.id===b.item_id)?.name||'').toLowerCase(); }
    else { av = a.start_date; bv = b.start_date; }
    if(av < bv) return -1 * mult;
    if(av > bv) return 1 * mult;
    return 0;
  });
  return list;
}

/* ---------- Tableau de bord (équipe) ---------- */
function gaugeHtml(label, value, total, color){
  const frac = total > 0 ? Math.min(1, value/total) : 0;
  const len = Math.PI * 80;
  const dashoffset = len * (1 - frac);
  const angle = -90 + frac * 180;
  return `
    <div class="gauge-card">
      <svg class="gauge-svg" viewBox="0 0 200 120">
        <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14" stroke-linecap="round"/>
        <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="${len.toFixed(2)}" stroke-dashoffset="${dashoffset.toFixed(2)}" style="transition: stroke-dashoffset 1s var(--ease);"/>
        <line class="gauge-needle" x1="100" y1="100" x2="100" y2="32" stroke="var(--text)" stroke-width="3" stroke-linecap="round" style="transform:rotate(${angle.toFixed(1)}deg);"/>
        <circle cx="100" cy="100" r="7" fill="var(--text)"/>
      </svg>
      <div class="gauge-value">${value}</div>
      <div class="gauge-label">${esc(label)}</div>
      <div class="gauge-sub">sur ${total} location${total>1?'s':''} au total</div>
    </div>`;
}
function renderDashboard(){
  const counts = { demande:0, accepte:0, loue:0, retourne:0, refuse:0 };
  state.bookings.forEach(b => { if(counts[b.status] !== undefined) counts[b.status]++; });
  const total = state.bookings.length;
  return `
    <div class="topbar"><div><h1>Tableau de bord</h1><div class="desc">Vue d'ensemble en temps réel de toutes les locations Owls Vision.</div></div></div>
    <div class="gauge-grid">
      ${gaugeHtml("Demandes en cours", counts.demande, total, "var(--amber)")}
      ${gaugeHtml("Locations acceptées", counts.accepte, total, "#6BA8FF")}
      ${gaugeHtml("En cours de location", counts.loue, total, "var(--accent)")}
      ${gaugeHtml("Retournées", counts.retourne, total, "rgba(255,255,255,0.5)")}
    </div>
    <div class="panel" style="margin-top:18px;">
      <div class="section-title">Résumé</div>
      <div class="row">
        <div><div style="font-size:12px;color:var(--text-faint);">Total locations</div><div style="font-size:22px;font-weight:700;">${total}</div></div>
        <div><div style="font-size:12px;color:var(--text-faint);">Refusées</div><div style="font-size:22px;font-weight:700;">${counts.refuse}</div></div>
        <div><div style="font-size:12px;color:var(--text-faint);">Comptes clients</div><div style="font-size:22px;font-weight:700;">${state.profiles.filter(p=>!p.is_master).length}</div></div>
      </div>

  `;
}

/* ---------- Missions ---------- */
function renderMissions(){
  const u = currentProfile();
  const isMaster = u.is_master;
  const items = state.tasks.slice().sort((a,b) => b.created_at.localeCompare(a.created_at));
  const doneIds = isMaster ? [] : state.completions.filter(c => c.username === u.username).map(c => c.task_id);
  const cards = items.map(t => {
    const done = !isMaster && doneIds.includes(t.id);
    const submissions = isMaster ? state.completions.filter(c => c.task_id === t.id) : [];
    return `
    <div class="card mission-card ${done?'done':''}">
      <div class="mission-head">
        <div class="mission-icon">${done ? '✅' : '🎯'}</div>
        <div style="flex:1;min-width:0;">
          <h3 style="font-size:16.5px;">${esc(t.title)}</h3>
          <span class="task-xp">+${t.xp_reward} XP</span>
        </div>
      </div>
      ${t.description ? `<div class="card-desc">${esc(t.description)}</div>` : ''}
      ${done ? `<div class="card-desc" style="color:var(--accent);flex:0;">Mission accomplie ✓</div>` : ''}
      ${isMaster && t.requires_answer ? `<div class="card-desc" style="flex:0;">Champ demandé : ${esc(t.answer_label)}</div>` : ''}
      ${isMaster && submissions.length ? `<div>${submissions.map(s => `<div class="submission-row"><span>${esc(s.username)}${t.requires_answer ? ' — ' + esc(s.answer||'') : ''}</span><span>${fmtDate(s.completed_at)}</span></div>`).join("")}</div>` : ''}
      ${(!isMaster && !done) ? `<div class="card-foot" style="border-top:none;padding-top:0;">${t.requires_answer ? `<button class="btn btn-primary btn-sm" style="width:100%;" onclick="openAnswerModal('${t.id}')">Compléter</button>` : `<button class="btn btn-primary btn-sm" style="width:100%;" onclick="completeTask('${t.id}')">Marquer accomplie</button>`}</div>` : ''}
      ${isMaster ? `<div class="card-foot"><button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">Supprimer</button></div>` : ''}
    </div>`;
  }).join("");
  const progressPct = items.length ? Math.round((doneIds.length / items.length) * 100) : 0;
  return `
    <div class="topbar">
      <div><h1>Missions</h1><div class="desc">${isMaster ? "Créez des missions et suivez qui les a accomplies (et leurs réponses)." : "Accomplissez des missions pour gagner de l'XP."}</div></div>
      ${xpBarHtml(u)}
    </div>
    ${isMaster ? `<button class="btn btn-primary btn-sm" style="width:auto;margin-bottom:18px;" onclick="openNewTaskModal()">+ Créer une mission</button>` : ''}
    ${!isMaster && items.length ? `<div class="panel" style="margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--text-dim);font-weight:600;"><span>Missions accomplies</span><span>${doneIds.length}/${items.length}</span></div>
      <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${progressPct}%"></div></div>
    </div>` : ''}
    <div class="grid">${items.length ? cards : `<div class="empty">Aucune mission disponible pour le moment.</div>`}</div>
  `;
}

/* ---------- Router ---------- */
function render(){
  const app = document.getElementById("app");
  if(state.loading){ app.innerHTML = `<div class="gate"><div style="text-align:center;"><img src="${LOGO}" alt="Owls Vision" style="width:56px;height:56px;border-radius:16px;margin-bottom:14px;"><div style="color:var(--text-faint)">Chargement…</div></div></div>`; return; }
  if(state.fatalError){ app.innerHTML = `<div class="gate"><div class="gate-card"><div class="msg msg-error">${esc(state.fatalError)}</div></div></div>`; return; }
  if(!state.session){ app.innerHTML = renderGate(); return; }

  const u = currentProfile();
  if(!u){ logout(); return; }
  const allowed = navFor(u.is_master).map(x => x[0]);
  if(!allowed.includes(state.view)) state.view = allowed[0];

  let content = "";
  if(state.view === "accueil") content = renderAccueil();
  else if(state.view === "catalogue") content = renderCatalogue();
  else if(state.view === "planning") content = renderMesReservations();
  else if(state.view === "gestion") content = renderGestionLocation();
  else if(state.view === "dashboard") content = renderDashboard();
  else if(state.view === "missions") content = renderMissions();
  else if(state.view === "utilisateurs") content = renderUtilisateurs();
  else if(state.view === "contrats") content = renderContratsAdmin();
  else if(state.view === "contrat") content = renderContratClient();
  else if(state.view === "profil") content = renderProfilClient();

  app.innerHTML = `
    <div class="shell">
      ${renderSidebar()}
      <div class="main">
        <div class="mobile-topbar">
          <button class="hamburger" onclick="toggleSidebar()">☰</button>
          <img src="${LOGO}" alt="Owls Vision">
          <div style="font-weight:700;">OWLS<span style="color:var(--accent)">VISION</span></div>
        </div>
        ${content}
      </div>
    </div>
    ${renderModal()}
  `;
}

/* ---------- Global handlers ---------- */
window.setAuthTab = (tab) => { state.authTab = tab; state.authError = ""; state.authNotice = ""; render(); };
window.toggleAdminLogin = () => { state.showAdminLogin = !state.showAdminLogin; state.authError = ""; render(); };
window.handleClientLogin = (e) => { e.preventDefault(); doClientLogin(e.target.email.value, e.target.password.value); return false; };
window.handleClientRegister = (e) => { e.preventDefault(); doClientRegister(e.target.email.value, e.target.password.value, e.target.password2.value); return false; };
window.handleResendConfirmation = () => {
  const field = document.getElementById('login-email');
  resendConfirmationEmail(field ? field.value : "");
};
window.handleAdminLogin = (e) => { e.preventDefault(); doAdminLogin(e.target.username.value, e.target.password.value); return false; };
window.logout = logout;
window.goto = (view) => { state.view = view; state.sidebarOpen = false; state.profileSaved = false; render(); };
window.toggleSidebar = () => { state.sidebarOpen = !state.sidebarOpen; render(); };
window.deleteItem = deleteItem;
window.deleteTask = deleteTask;
window.deleteProfile = deleteProfile;
window.masterDeleteContract = masterDeleteContract;
window.saveProfile = saveProfile;
window.setBookingStatus = setBookingStatus;
window.onGestionSearch = (v) => { state.gestionSearch = v; refreshGestionView(); };
window.onGestionFilter = (v) => { state.gestionFilter = v; refreshGestionView(); };
window.onGestionSort = (field) => {
  if(state.gestionSort.field === field) state.gestionSort.dir = state.gestionSort.dir === 'asc' ? 'desc' : 'asc';
  else state.gestionSort = { field, dir: 'asc' };
  refreshGestionView();
};
window.completeTask = (taskId) => completeTask(taskId, null);
window.cancelBooking = cancelBooking;
window.openBookModal = (itemId) => {
  if(!isProfileComplete(currentProfile())){
    state.profileNotice = "Merci de compléter votre fiche membre (numéro de CNI facultatif) avant de faire une demande de location.";
    state.view = "profil"; state.sidebarOpen = false; render();
    return;
  }
  state.bookingError = ""; state.modal = { type:"book", itemId }; render(); updateAvailabilityPreview(itemId);
};
window.openNewItemModal = () => { state.modal = { type:"newItem" }; render(); };
window.openNewTaskModal = () => { state.modal = { type:"newTask" }; render(); };
window.openAnswerModal = (taskId) => { state.answerError = ""; state.modal = { type:"answerTask", taskId }; render(); };
window.openViewProfile = (username) => { state.modal = { type:"viewProfile", username }; render(); };
window.closeModal = () => { state.modal = null; state.bookingError = ""; state.answerError = ""; render(); };
window.closeModalBg = (e) => { if(e.target.classList.contains('modal-bg')) window.closeModal(); };
window.confirmBooking = (itemId) => {
  const start = document.getElementById("bk-start").value;
  const end = document.getElementById("bk-end").value;
  submitBooking(itemId, start, end);
};
window.confirmNewItem = async (e) => {
  const name = document.getElementById("it-name").value.trim();
  const desc = document.getElementById("it-desc").value.trim();
  const xp = document.getElementById("it-xp").value;
  const qty = document.getElementById("it-qty").value;
  const file = document.getElementById("it-photo").files[0];
  const btn = e.target; const oldLabel = btn.textContent; btn.textContent = "Ajout..."; btn.disabled = true;
  try{
    let imageUrl = null;
    if(file){
      const path = `item_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
      const { error: upErr } = await sb.storage.from('items').upload(path, file, { upsert:true, contentType: file.type });
      if(upErr) throw upErr;
      const { data: pub } = sb.storage.from('items').getPublicUrl(path);
      imageUrl = pub.publicUrl;
    }
    await createItem(name, desc, xp, qty, imageUrl);
  }catch(err){
    document.getElementById('it-error').innerHTML = `<div class="msg msg-error">Erreur photo : ${esc(err.message||String(err))}</div>`;
    btn.textContent = oldLabel; btn.disabled = false;
  }
};
window.confirmNewTask = () => {
  createTask(
    document.getElementById("tk-title").value.trim(),
    document.getElementById("tk-desc").value.trim(),
    document.getElementById("tk-xp").value,
    document.getElementById("tk-requires").checked,
    document.getElementById("tk-answer-label")?.value.trim()
  );
};
window.confirmAnswerTask = (taskId) => {
  const val = document.getElementById("ans-input").value.trim();
  if(!val){ state.answerError = "Merci de renseigner une réponse."; render(); return; }
  completeTask(taskId, val);
};
function computeAvailabilityText(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return "";
  if(!start || !end || start > end) return "Merci de choisir une période valide.";
  const left = item.qty - activeBookingsCount(itemId, start, end);
  if(left <= 0) return `Complet sur cette période (0/${item.qty} disponible).`;
  return `${left}/${item.qty} disponible sur cette période.`;
}
window.updateAvailabilityPreview = (itemId) => {
  const s = document.getElementById('bk-start'), en = document.getElementById('bk-end'), out = document.getElementById('bk-availability');
  if(!s || !en || !out) return;
  const text = computeAvailabilityText(itemId, s.value, en.value);
  out.textContent = text;
  out.style.color = (text.startsWith('Complet') || text.startsWith('Merci')) ? 'var(--danger)' : 'var(--accent)';
};

const LOGO = "logo.png";

boot();
</script>
</body>
</html>
