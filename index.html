<style>
  :root{
    --bg:#050605;
    --bg-glow: radial-gradient(1100px 620px at 18% -8%, rgba(143,239,61,0.07), transparent 62%);
    --surface: rgba(255,255,255,0.045);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.06);
    --accent:#8FEF3D;
    --accent-2:#5FDE8A;
    --accent-ink:#07130A;
    --accent-soft: rgba(143,239,61,0.14);
    --accent-soft-2: rgba(143,239,61,0.28);
    --text:#F4F7F1;
    --text-dim: rgba(244,247,241,0.62);
    --text-faint: rgba(244,247,241,0.38);
    --danger:#FF6B57;
    --danger-soft: rgba(255,107,87,0.14);
    --amber:#FFD166;
    --amber-soft: rgba(255,209,102,0.14);
    --blue:#6BA8FF;
    --blue-soft: rgba(107,168,255,0.14);
    --violet:#B7A0FF;
    --violet-soft: rgba(183,160,255,0.14);
    --r-sm:14px;
    --r-md:20px;
    --r-lg:28px;
    --r-pill:999px;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-2: 0 10px 30px -8px rgba(0,0,0,0.55);
    --shadow-glow: 0 8px 24px -6px rgba(143,239,61,0.25);
    --ease: cubic-bezier(.2,.8,.2,1);
    --font-disp:'Rajdhani','Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-glow), var(--bg);
    background-attachment: fixed;
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ letter-spacing:-0.02em; margin:0; }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:99px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{min-height:100vh;}
  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background: radial-gradient(900px 560px at 50% 8%, rgba(143,239,61,0.10), transparent 65%), var(--bg);
  }
  .gate-card{
    width:100%;max-width:400px;background: var(--surface);border:1px solid var(--border);
    border-radius: var(--r-lg);padding:36px 32px;backdrop-filter: blur(24px);-webkit-backdrop-filter: blur(24px);
    box-shadow: var(--shadow-2);
  }
  .gate-brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:30px;}
  .gate-brand img{width:84px;height:84px;border-radius:26px;box-shadow: 0 0 0 1px var(--border), var(--shadow-glow);}
  .gate-brand .brand-name{font-family:var(--font-disp);font-size:28px;font-weight:700;color:var(--text);text-align:center;letter-spacing:0.01em;}
  .gate-brand .brand-name span{color:var(--accent);}
  .gate-brand .brand-tag{font-size:12.5px;color:var(--text-faint);font-weight:500;text-align:center;}
  .tabs{display:flex;background: rgba(255,255,255,0.05);border:1px solid var(--border-soft);border-radius: var(--r-pill);padding:4px;margin-bottom:22px;gap:2px;}
  .tabs button{flex:1;padding:10px 0;background:transparent;border:none;color:var(--text-dim);font-size:14px;font-weight:600;border-radius: var(--r-pill);transition: all .25s var(--ease);}
  .tabs button.active{color:var(--accent-ink);background:var(--accent);box-shadow: var(--shadow-glow);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-faint);margin-bottom:7px;font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%;background: rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);
    padding:13px 15px;border-radius: var(--r-sm);font-size:14.5px;outline:none;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--accent-soft-2); box-shadow: 0 0 0 4px var(--accent-soft); }
  .field .static-val{font-size:14.5px;color:var(--text);padding:12px 0 2px;}
  .pwd-wrap{position:relative;}
  .pwd-wrap input{padding-right:44px !important;}
  .pwd-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:17px;padding:8px;line-height:1;}
  .pwd-eye:hover{color:var(--text);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius: var(--r-pill);
    border:1px solid transparent;font-size:14.5px;font-weight:600;
    transition: transform .12s var(--ease), filter .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;box-shadow: var(--shadow-glow);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:rgba(255,255,255,0.055);border-color:var(--border-soft);color:var(--text-dim);}
  .btn-ghost:hover{background:rgba(255,255,255,0.09);color:var(--text);}
  .btn-danger{background:var(--danger-soft);border-color:transparent;color:#FFB3A6;}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .msg{font-size:13.5px;padding:12px 15px;border-radius: var(--r-sm);margin-bottom:16px;font-weight:500;}
  .msg-error{background:var(--danger-soft);border:1px solid rgba(255,107,87,0.25);color:#FFB3A6;}
  .msg-ok{background:var(--accent-soft);border:1px solid var(--accent-soft-2);color:var(--accent);}

  .shell{display:flex;min-height:100vh;gap:16px;padding:16px;}
  .sidebar{
    width:246px;flex-shrink:0;background: var(--surface);border:1px solid var(--border);border-radius: var(--r-lg);
    display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);
    backdrop-filter: blur(24px);-webkit-backdrop-filter: blur(24px);box-shadow: var(--shadow-1);overflow:hidden;
  }
  .side-brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid var(--border-soft);}
  .side-brand img{width:40px;height:40px;border-radius:12px;}
  .side-brand .name{font-family:var(--font-disp);font-size:17px;font-weight:700;line-height:1.15;letter-spacing:0.01em;}
  .side-brand .name span{color:var(--accent);}
  .side-brand .sub{font-size:10.5px;color:var(--text-faint);font-weight:500;}
  .nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
  .nav button{
    display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--text-dim);
    padding:11px 14px;border-radius: var(--r-sm);font-size:14px;text-align:left;font-weight:500;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .nav button svg{width:18px;height:18px;flex-shrink:0;opacity:0.85;}
  .nav button:hover{background:rgba(255,255,255,0.05);color:var(--text);}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav button.active svg{opacity:1;}
  .nav-group{display:flex;flex-direction:column;}
  .nav-chevron{margin-left:auto;font-size:11px;opacity:0.55;transition:transform .16s var(--ease);flex-shrink:0;}
  .nav-chevron.open{transform:rotate(90deg);}
  .nav-sub{display:flex;flex-direction:column;gap:2px;max-height:0;overflow:hidden;transition:max-height .2s var(--ease);}
  .nav-sub.open{max-height:220px;}
  .nav-sub button{padding-left:46px;}
  .nav-draggable > button{cursor:grab;}
  .nav-draggable .nav-group > button{cursor:grab;}
  .nav button.dragging{opacity:0.35;}
  .nav-draggable > button.drag-over{outline:2px dashed var(--accent-soft-2);outline-offset:-2px;}
  .nav-group.drag-over{outline:2px dashed var(--accent-soft-2);outline-offset:2px;border-radius:var(--r-sm);}
  .side-foot{padding:16px;border-top:1px solid var(--border-soft);}
  .side-user{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .avatar{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;}
  .side-user .u-name{font-size:13.5px;font-weight:600;word-break:break-all;}
  .side-user .u-rank{font-size:11.5px;color:var(--text-faint);}

  .main{flex:1;min-width:0;padding:12px 20px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .topbar h1{font-family:var(--font-disp);font-size:30px;font-weight:700;letter-spacing:0.005em;}
  .topbar .desc{color:var(--text-dim);font-size:14.5px;margin-top:6px;max-width:480px;line-height:1.5;}

  .xp-card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:18px 20px;min-width:270px;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);box-shadow:0 0 28px -14px var(--tier-soft, transparent);}
  .xp-card .xp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .xp-card .xp-rank{font-family:var(--font-disp);font-size:15px;font-weight:700;color:var(--tier, var(--accent));letter-spacing:0.01em;}
  .xp-card .xp-num{font-size:12px;color:var(--text-faint);font-weight:500;}
  .xp-card .xp-bar-fill{background:linear-gradient(90deg, var(--tier-soft, var(--accent-2)), var(--tier, var(--accent)));}
  .xp-bar-track{height:10px;background:rgba(255,255,255,0.06);border-radius:var(--r-pill);overflow:hidden;position:relative;}
  .xp-bar-pending{position:absolute;top:0;left:0;height:100%;border-radius:var(--r-pill);background:rgba(255,255,255,0.28);transition:width .8s var(--ease);z-index:0;}
  .xp-bar-fill{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg, var(--accent-2), var(--accent));transition:width .8s var(--ease);position:relative;z-index:1;overflow:hidden;}
  .xp-bar-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.35) 40%, transparent 60%);
    background-size:200% 100%;animation: shimmer 2.8s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{background-position:160% 0;} 100%{background-position:-60% 0;} }

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(272px,1fr));gap:18px;}
  .card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;display:flex;flex-direction:column;gap:12px;transition: transform .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);}
  .card:hover{background:var(--surface-hover);transform:translateY(-3px);box-shadow:var(--shadow-2);}
  .card h3{font-family:var(--font-disp);font-size:19px;font-weight:700;letter-spacing:0.005em;}
  .card .card-desc{font-size:13.5px;color:var(--text-dim);line-height:1.55;flex:1;}
  .card .card-photo{width:calc(100% + 44px);margin:-22px -22px 0;height:150px;object-fit:cover;display:block;border-radius:var(--r-md) var(--r-md) 0 0;}
  .card .card-photo-ph{width:calc(100% + 44px);margin:-22px -22px 0;height:110px;display:flex;align-items:center;justify-content:center;font-size:34px;background:rgba(255,255,255,0.03);border-radius:var(--r-md) var(--r-md) 0 0;opacity:.5;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:var(--r-pill);width:fit-content;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--border-soft);}
  .qty-pill{font-size:12px;color:var(--text-faint);font-weight:500;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;padding:12px 14px;color:var(--text-faint);font-weight:600;font-size:12px;border-bottom:1px solid var(--border-soft);}
  td{padding:14px;border-bottom:1px solid var(--border-soft);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  .tbl-compact th{padding:8px 12px;font-size:11px;}
  .tbl-compact td{padding:7px 12px;font-size:12.5px;}
  .tbl-compact .t-title{font-size:13px;font-weight:600;}
  .tbl-compact .t-desc{font-size:11px;color:var(--text-faint);margin-top:1px;}
  .panel{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);}
  .panel + .panel{margin-top:18px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  .empty{padding:36px 20px;text-align:center;color:var(--text-faint);border:1.5px dashed var(--border);border-radius: var(--r-md);font-size:14px;font-weight:500;}

  .mission-spotlight{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-lg);padding:22px;margin-top:22px;}
  .mission-spotlight-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .mission-spotlight-head h2{font-family:var(--font-disp);font-size:19.5px;font-weight:700;letter-spacing:0.005em;display:flex;align-items:center;gap:8px;}
  .mission-spotlight-list{display:flex;flex-direction:column;gap:10px;}
  .mission-spotlight-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(0,0,0,0.18);border-radius:var(--r-sm);padding:12px 14px;}
  .mission-spotlight-row .msr-title{font-weight:700;font-size:14.5px;}
  /* .btn-primary est width:100% par défaut (pensé pour les boutons pleine largeur des modales) ;
     dans ces deux barres flex, ça faisait exploser les boutons sur toute la largeur de la ligne. */
  .mission-spotlight-head .btn, .mission-spotlight-row .btn{width:auto;flex-shrink:0;}
  .mission-card{position:relative;}
  .mission-card.done{opacity:.62;}
  .mission-head{display:flex;align-items:flex-start;gap:12px;}
  .mission-icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .mission-card.done .mission-icon{background:rgba(255,255,255,0.06);}
  .task-xp{font-size:12.5px;color:var(--accent);font-weight:600;background:var(--accent-soft);padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap;display:inline-block;margin-top:6px;}
  .submission-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-dim);padding:8px 0;border-top:1px solid var(--border-soft);}
  .history-list{display:flex;flex-direction:column;max-height:280px;overflow-y:auto;}
  .history-row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border-soft);}
  .history-row:first-child{border-top:none;}
  .history-icon{font-size:15px;flex-shrink:0;width:22px;text-align:center;}
  .history-label{font-size:13px;color:var(--text);line-height:1.4;}
  .history-date{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .modal-bg{position:fixed;inset:0;background:rgba(3,5,3,0.6);backdrop-filter: blur(6px);-webkit-backdrop-filter: blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background: #0E100E;border:1px solid var(--border);border-radius: var(--r-lg);width:100%;max-width:430px;padding:26px;box-shadow: var(--shadow-2);max-height:90vh;overflow-y:auto;}
  .modal h3{font-family:var(--font-disp);font-size:21px;margin-bottom:16px;font-weight:700;letter-spacing:0.005em;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .section-title{font-size:13px;color:var(--text-faint);margin-bottom:14px;font-weight:600;}
  .hamburger{display:none;}
  .mobile-topbar{display:none;}
  .mobile-topbar img{width:26px;height:26px;border-radius:8px;}
  .bottom-nav{display:none;}

  /* ---------- Filter bar (Gestion location) ---------- */
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .filter-bar input[type=text]{flex:2;min-width:200px;background: rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);padding:11px 14px;border-radius: var(--r-sm);font-size:14px;outline:none;}
  .filter-bar select{flex:1;min-width:150px;background: rgba(255,255,255,0.055);border:1px solid var(--border-soft);color:var(--text);padding:11px 14px;border-radius: var(--r-sm);font-size:14px;outline:none;}
  select option{background:#12140f;color:var(--text);}
  .field select option{background:#12140f;color:var(--text);}
  .filter-bar input:focus, .filter-bar select:focus{border-color: var(--accent-soft-2); box-shadow: 0 0 0 4px var(--accent-soft);}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--text);}
  th.sortable .sort-arrow{opacity:.55;margin-left:4px;}
  .result-count{font-size:12.5px;color:var(--text-faint);margin-bottom:12px;font-weight:500;}

  /* ---------- Dashboard gauges ---------- */
  .gauge-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(230px,1fr));gap:18px;}
  .gauge-card{background: var(--surface);border:1px solid var(--border);border-radius: var(--r-md);padding:22px;display:flex;flex-direction:column;align-items:center;backdrop-filter: blur(20px);-webkit-backdrop-filter: blur(20px);}
  .gauge-label{font-size:13px;color:var(--text-dim);font-weight:600;margin-top:4px;}
  .gauge-value{font-family:var(--font-disp);font-size:32px;font-weight:700;letter-spacing:0;margin-top:6px;}
  .gauge-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .gauge-svg{width:100%;max-width:190px;}
  .gauge-needle{transition: transform 1s var(--ease);transform-box: view-box;transform-origin: 100px 100px;}

  /* ---------- Documents (fiche membre) ---------- */
  .doc-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius: var(--r-md);background: rgba(255,255,255,0.03);flex-wrap:wrap;margin-bottom:12px;}
  .doc-row .doc-title{font-weight:600;font-size:14.5px;}
  .doc-row .doc-sub{font-size:12px;color:var(--text-faint);margin-top:4px;}
  .doc-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .profile-warning{background: var(--amber-soft);border:1px solid rgba(255,209,102,0.3);color:var(--amber);font-size:13.5px;padding:14px 16px;border-radius: var(--r-sm);margin-bottom:18px;font-weight:500;line-height:1.5;}
  .star-row{display:flex;gap:4px;margin-bottom:14px;}
  .star-btn{background:none;border:none;font-size:24px;line-height:1;cursor:pointer;color:rgba(255,255,255,0.2);padding:2px;transition:color .12s var(--ease), transform .12s var(--ease);}
  .star-btn:hover{transform:scale(1.15);}
  .star-btn.filled{color:var(--amber);}
  .badge-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;margin-left:auto;}
  .nav button{position:relative;}

  /* ---------- Hero XP (accueil) — HUD "jeu vidéo" : la couleur (--tier/--tier-soft) suit le
     palier du rang (vert -> bleu -> violet -> or), posée en inline-style par tierStyleAttr().
     Volontairement statique (glow via box-shadow/gradient, pas d'animation en boucle) : ce bloc
     est reconstruit à chaque render() (y compris sur les mises à jour realtime d'autres clients),
     donc toute animation d'entrée ici se rejouerait en boucle perçue — voir la note Lot 5 ci-dessus. */
  .hero-wrap{display:flex;justify-content:center;margin-bottom:6px;}
  .xp-hero{
    width:100%;max-width:460px;text-align:center;padding:34px 30px;border-radius:var(--r-lg);
    position:relative;overflow:hidden;
    background: radial-gradient(220px 160px at 50% -10%, var(--tier-soft, var(--accent-soft)), transparent 70%), var(--surface);
    border:1px solid var(--border);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    box-shadow: var(--shadow-2), 0 0 60px -28px var(--tier, var(--accent));
  }
  .xp-hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size:26px 26px;
    mask-image:radial-gradient(260px 180px at 50% 0%, rgba(0,0,0,0.5), transparent 75%);
  }
  .xp-ring{
    width:128px;height:128px;border-radius:50%;margin:0 auto 16px;position:relative;z-index:1;
    background: conic-gradient(var(--tier, var(--accent)) calc(var(--pct,0)*1%), rgba(255,255,255,0.07) 0);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px var(--border), 0 0 34px -4px var(--tier, var(--accent));
  }
  .xp-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed var(--tier-soft, rgba(255,255,255,0.14));}
  .xp-ring::after{content:"";position:absolute;inset:13px;border-radius:50%;background:#0c0e0c;}
  .ring-owl{position:relative;z-index:1;color:var(--tier, var(--accent));display:flex;filter:drop-shadow(0 0 8px var(--tier-soft, transparent));}
  .ring-owl svg{width:46px;height:46px;}
  .rank-step .rank-icon{color:var(--text-faint);margin:0 auto 5px;display:flex;justify-content:center;}
  .rank-step.done .rank-icon{color:var(--text-dim);}
  .rank-step.current .rank-icon{color:var(--tier, var(--accent));}
  .xp-hero-rank{position:relative;z-index:1;font-family:var(--font-disp);font-size:26px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;color:var(--tier, var(--accent));text-shadow:0 0 24px var(--tier-soft, transparent);}
  .xp-hero-level{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-disp);font-size:12px;color:var(--text);font-weight:700;letter-spacing:0.08em;margin:8px 0 20px;padding:5px 14px;border-radius:var(--r-pill);background:rgba(255,255,255,0.06);border:1px solid var(--tier-soft, var(--border));}
  .xp-bar-track-lg{height:14px;position:relative;z-index:1;}
  .xp-hero-num{position:relative;z-index:1;font-size:12.5px;color:var(--text-faint);margin-top:12px;font-weight:500;}
  .ranks-roadmap{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;margin-top:20px;padding:2px;}
  .rank-step{flex:1;min-width:80px;text-align:center;padding:9px 4px;border-radius:var(--r-sm);background:rgba(255,255,255,0.03);border:1px solid var(--border-soft);border-bottom:2px solid var(--border-soft);}
  .rank-step.done{background:rgba(255,255,255,0.05);border-bottom-color:var(--tier, var(--accent));}
  .rank-step.current{border-color:var(--tier, var(--accent));border-bottom-color:var(--tier, var(--accent));box-shadow:0 0 18px -6px var(--tier, var(--accent));}
  .rank-step .rank-name{font-family:var(--font-disp);font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--text-dim);letter-spacing:0.01em;}
  .rank-step.current .rank-name{color:var(--tier, var(--accent));}
  .rank-step.locked .rank-name{color:var(--text-faint);}
  .rank-step .rank-xp{font-size:10px;color:var(--text-faint);margin-top:2px;}

  /* Le toast de level-up est créé via document.createElement, hors du cycle de render() : lui seul
     (ainsi que showErrorToast) peut porter une animation d'entrée sans risque de rejeu en boucle. */
  .levelup-toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:14px;
    background: rgba(14,16,14,0.94);border:1px solid var(--tier-soft, var(--accent-soft-2));border-radius: var(--r-pill);padding:13px 26px 13px 14px;
    box-shadow: var(--shadow-2), 0 0 34px -6px var(--tier, var(--accent));transition: transform .35s var(--ease), opacity .35s var(--ease);z-index:100;backdrop-filter:blur(16px);
  }
  .levelup-toast.show{transform:translate(-50%,0);opacity:1;}
  .levelup-badge{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:var(--tier-soft, var(--accent-soft));color:var(--tier, var(--accent));position:relative;}
  .levelup-badge svg{width:27px;height:27px;}
  .levelup-toast.show .levelup-badge{animation:levelupPop .5s var(--ease);}
  .levelup-toast.show .levelup-badge::after{content:"";position:absolute;inset:0;border-radius:50%;animation:levelupBurst .8s ease-out forwards;}
  @keyframes levelupPop{0%{transform:scale(.4) rotate(-10deg);}60%{transform:scale(1.15) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
  @keyframes levelupBurst{0%{box-shadow:0 0 0 0 var(--tier-soft, var(--accent-soft));}100%{box-shadow:0 0 0 16px rgba(0,0,0,0);}}
  .levelup-title{font-weight:800;color:var(--tier, var(--accent));font-size:15px;letter-spacing:0.01em;}
  .levelup-sub{font-size:12px;color:var(--text-dim);}
  .error-toast{border-color:#8a3a3a !important;box-shadow:0 10px 40px rgba(180,50,50,0.25) !important;max-width:min(420px,88vw);}
  .error-toast .levelup-badge{background:var(--danger-soft) !important;color:#FF8A75 !important;}
  .error-toast .levelup-title{color:#FF8A75;}

  /* ---------- Fullscreen signature modal ---------- */
  .modal-full{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;}
  .modal-full-bar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:1px solid var(--border-soft);background: rgba(5,6,5,0.9);backdrop-filter:blur(14px);z-index:2;}
  .modal-full-back{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:var(--text);}
  .modal-full-title{font-weight:700;font-size:15.5px;}
  .modal-full-body{flex:1;overflow-y:auto;padding:20px 18px calc(48px + env(safe-area-inset-bottom));}
  .sig-pad-wrap{border:1.5px dashed var(--border);border-radius:var(--r-md);background:#ffffff;overflow:hidden;margin-bottom:12px;}
  #sig-canvas{width:100%;height:220px;display:block;touch-action:none;background:#ffffff;}
  .check-row{display:flex;align-items:flex-start;gap:10px;margin:18px 0;font-size:13.5px;color:var(--text-dim);line-height:1.4;}
  .check-row input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);white-space:nowrap;}
  .status-pill.ok{background:var(--accent-soft);color:var(--accent);}
  .status-pill.pending{background: var(--amber-soft);color:var(--amber);}
  .status-pill.none{background:rgba(255,255,255,0.06);color:var(--text-faint);}
  .status-pill.info{background:var(--blue-soft);color:var(--blue);}
  .status-pill.active{background:var(--violet-soft);color:var(--violet);}
  .status-pill.danger{background:var(--danger-soft);color:#FFB3A6;}
  .file-btn{position:relative;overflow:hidden;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .checkbox-field{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text-dim);margin:4px 0 16px;}
  .checkbox-field input{width:18px;height:18px;accent-color:var(--accent);}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--border);border-radius: var(--r-md);background: var(--surface);transition: background .2s var(--ease);flex-wrap:wrap;}
  .list-row:hover{background:var(--surface-hover);}
  .list-row .t-title{font-weight:600;font-size:15px;}
  .list-row .t-desc{font-size:13px;color:var(--text-dim);margin-top:4px;}
  .admin-link-wrap{text-align:center;margin-top:20px;}
  .admin-link-wrap button{background:none;border:none;color:var(--text-faint);font-size:11.5px;text-decoration:underline;padding:4px;}

  /* ---------- Direction "Phosphore" — finition & motion (Lot 5, corrigé) ----------
     Retour d'expérience : les couches ambiantes en boucle (grain + trame verte animée en
     permanence) donnaient une impression de "vert partout" changeant sans arrêt et cassaient
     le contraste — supprimées. Le flash de transition au changement d'onglet a ensuite provoqué
     un scintillement vert/noir sur PC — supprimé aussi. Ne restent que des réactions ponctuelles
     à une vraie action (survol, clic, changement de valeur), jamais d'animation en boucle. */

  /* boutons : reflet diagonal au survol seulement (rien tant qu'on n'interagit pas) */
  .btn-primary{position:relative;overflow:hidden;}
  .btn-primary::after{content:"";position:absolute;top:0;left:-60%;width:36%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,0.45),transparent);
    transform:skewX(-18deg);transition:left .55s var(--ease);pointer-events:none;}
  .btn-primary:hover::after{left:130%;}

  /* cartes et lignes : lueur au survol seulement, aucun état permanent ajouté */
  .card:hover{box-shadow:var(--shadow-2),0 0 0 1px var(--accent-soft-2);}
  .mission-spotlight-row{transition:background .18s var(--ease),transform .18s var(--ease);}
  .mission-spotlight-row:hover{background:rgba(143,239,61,0.06);transform:translateY(-1px);}
  .list-row{transition:background .2s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease);}
  .list-row:hover{transform:translateY(-1px);box-shadow:0 0 0 1px var(--accent-soft-2);}

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001s !important;}
  }

  @media (max-width: 860px){
    .shell{padding:0;gap:0;}
    /* En PWA "ajouté à l'écran d'accueil" (status bar translucide, viewport-fit=cover), le contenu
       est dessiné SOUS la barre de statut/l'encoche : sans cette marge le bouton du menu se
       retrouvait sous elle, hors zone cliquable. env(safe-area-inset-*) peut valoir 0 selon les
       appareils/navigateurs (support inégal) : on ajoute donc une marge fixe généreuse en plus de
       l'inset, pour garantir le dégagement même quand l'inset lui-même n'est pas fiable. */
    .sidebar{position:fixed;left:16px;top:calc(32px + env(safe-area-inset-top));bottom:calc(16px + env(safe-area-inset-bottom));height:auto;z-index:40;transform:translateX(-120%);transition:transform .28s var(--ease);}
    .sidebar.open{transform:translateX(0);}
    .main{padding:calc(32px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));}
    .mobile-topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
    .hamburger{display:flex;width:38px;height:38px;border:1px solid var(--border);border-radius: var(--r-sm);background:var(--surface);align-items:center;justify-content:center;flex-shrink:0;}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:39;}
    .topbar{flex-direction:column;}
    .xp-card{width:100%;min-width:0;}

    /* ---------- Bottom nav (mobile) ---------- */
    .bottom-nav{
      display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
      z-index:41;background:rgba(9,11,8,0.86);border:1px solid var(--border);border-radius:var(--r-pill);
      padding:5px;gap:2px;align-items:center;justify-content:space-around;
      backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      box-shadow: var(--shadow-2), 0 0 30px -10px var(--accent-soft-2);
    }
    .bottom-nav button{
      flex:0 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:0;
      background:none;border:none;color:var(--text-faint);padding:10px 9px;border-radius:var(--r-pill);
      font-size:11px;font-weight:700;letter-spacing:0.005em;position:relative;white-space:nowrap;overflow:hidden;
      transition:background .18s var(--ease), color .18s var(--ease), gap .18s var(--ease);
    }
    .bottom-nav button svg{width:19px;height:19px;flex-shrink:0;}
    .bottom-nav button .bn-label{max-width:0;opacity:0;overflow:hidden;text-overflow:ellipsis;transition:max-width .2s var(--ease), opacity .15s var(--ease);}
    .bottom-nav button.active{flex:1 1 auto;gap:6px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-glow);}
    .bottom-nav button.active .bn-label{max-width:150px;opacity:1;}
    .bottom-nav .bn-badge{position:absolute;top:2px;right:18%;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(9,11,8,0.86);}
    .bottom-nav button.active .bn-badge{box-shadow:0 0 0 2px var(--accent);}

    /* La bottom-nav occupe désormais le bas de l'écran : les toasts (level-up/erreur) doivent
       flotter au-dessus d'elle plutôt que par-dessus. */
    .levelup-toast{bottom:calc(74px + env(safe-area-inset-bottom));}
  }
</style>

<body>
<div id="app"></div>

<script>
/* =========================================================
   OWLS VISION — backend Supabase
   ========================================================= */
const SUPABASE_URL = "https://zopnuziuhmnkezyisoex.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_EJtogFic_Yu5eO9n1u2s0Q_LH4KbTVe";
const SITE_URL = "https://impactstudio84.github.io/OwlsVision/";

// storage: sessionStorage plutôt que localStorage -> chaque onglet garde sa propre session.
// Se déconnecter (ou se connecter) dans un onglet n'affecte plus les autres onglets ouverts.
// Contrepartie : fermer complètement l'onglet déconnecte (un simple rechargement/F5 ne déconnecte pas).
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});
let bootDone = false;

const RANKS = [
  {min:0,   name:"Novice"},
  {min:150, name:"Explorateur"},
  {min:400, name:"Confirmé"},
  {min:800, name:"Spécialiste"},
  {min:1400,name:"Vétéran"},
  {min:2200,name:"Navy Seal"},
];
const XP_STEP = 150;
function rankFor(xp){ let r = RANKS[0]; for(const c of RANKS){ if(xp >= c.min) r = c; } return r.name; }
function rankIndexFor(xp){ let i = 0; for(let k=0;k<RANKS.length;k++){ if(xp >= RANKS[k].min) i = k; } return i; }
function levelFor(xp){ return Math.floor(xp / XP_STEP) + 1; }
function xpInLevel(xp){ return xp % XP_STEP; }
// Logo du grade : un hibou qui s'équipe progressivement en optique de vision nocturne.
// Palier 1 = hibou nu (Novice, Explorateur) — palier 2 = + monoculaire (Confirmé) —
// palier 3 = + binoculaire (Spécialiste) — palier 4 = + quadtube (Vétéran, Navy Seal).
function owlTierForRankIndex(idx){
  if(idx <= 1) return 1;
  if(idx === 2) return 2;
  if(idx === 3) return 3;
  return 4;
}
function owlEyesSvg(tier){
  if(tier === 1) return '<circle cx="8.7" cy="12" r="1.7"/><circle cx="15.3" cy="12" r="1.7"/>';
  if(tier === 2) return '<circle cx="8.7" cy="12" r="1.7"/><circle cx="15.3" cy="12" r="3"/><path d="M11.6 12h1.2"/>';
  if(tier === 3) return '<circle cx="8.7" cy="12" r="2.6"/><circle cx="15.3" cy="12" r="2.6"/><path d="M11.3 12h1.4"/>';
  return '<circle cx="8.2" cy="10.4" r="2.05"/><circle cx="15.8" cy="10.4" r="2.05"/><circle cx="8.2" cy="14.7" r="2.05"/><circle cx="15.8" cy="14.7" r="2.05"/>';
}
// Palette "HUD" associée au palier de rang (Lot 10 — refonte visuelle mode XP) : vert (palier 1,
// couleur de marque par défaut) -> bleu -> violet -> or à mesure que le client progresse. Posée en
// variables CSS inline (--tier/--tier-soft) sur les conteneurs XP ; tout le CSS qui l'utilise a un
// fallback var(--accent)/var(--accent-soft), donc un appel sans tier (ex. contextes non-XP) reste vert.
function tierPalette(tier){
  if(tier === 2) return { color:'var(--blue)', soft:'var(--blue-soft)' };
  if(tier === 3) return { color:'var(--violet)', soft:'var(--violet-soft)' };
  if(tier === 4) return { color:'var(--amber)', soft:'var(--amber-soft)' };
  return { color:'var(--accent)', soft:'var(--accent-soft)' };
}
function tierStyleAttr(u){
  if(!u || u.is_master) return '';
  const pal = tierPalette(owlTierForRankIndex(rankIndexFor(u.xp)));
  return ` style="--tier:${pal.color};--tier-soft:${pal.soft};"`;
}
function owlIconSvg(tier, opts){
  opts = opts || {};
  const size = opts.size || 22;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.6 3.6 4.2 7.6M17.4 3.6 19.8 7.6"/>
    <path d="M12 3.3c-4.6 0-7.5 3.4-7.5 8.1 0 4.5 2.9 8.1 7.5 8.1s7.5-3.6 7.5-8.1c0-4.7-2.9-8.1-7.5-8.1Z"/>
    ${owlEyesSvg(tier)}
    <path d="M12 14.6 10.8 17.1h2.4L12 14.6Z"/>
    ${opts.elite ? '<path d="M12 1.4l.6 1.3 1.4.2-1 1 .2 1.4-1.2-.7-1.2.7.2-1.4-1-1 1.4-.2Z" fill="currentColor" stroke="none"/>' : ''}
  </svg>`;
}
const todayStr = () => new Date().toISOString().slice(0,10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('fr-FR') : '—';
const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('fr-FR') : 'Jamais connecté';

let state = {
  loading: true,
  fatalError: null,
  session: null, // {username(=email pour les clients), isMaster}
  profiles: [], items: [], bookings: [], tasks: [], completions: [], contracts: [], mission_groups: [], rewards: [], redemptions: [],
  view: "accueil",
  authTab: "login",
  showAdminLogin: false,
  authError: "",
  authNotice: "",
  sidebarOpen: false,
  navOpenGroups: { 'gestion-group': false, 'missions-group': false },
  modal: null,
  bookingError: "",
  answerError: "",
  profileError: "",
  profileSaved: false,
  profileNotice: "",
  docError: "",
  gestionSearch: "",
  gestionFilter: "all",
  validationSearch: "",
  usersSearch: "",
  gestionSort: { field: "start_date", dir: "asc" },
  contratsSort: "client_asc",
};

const STATUS_LABELS = {
  demande: "Demande envoyée",
  accepte: "Acceptée",
  loue: "En cours de location",
  retourne: "Retournée",
  refuse: "Refusée",
};
function statusPillHtml(status){
  // "loue" (location en cours) n'est pas un état terminal : il ne doit pas porter le vert de succès,
  // sinon la quasi-totalité des lignes d'une boutique de location s'affiche en vert. Le vert "ok" est
  // réservé au matériel réellement rendu (retourne) — le seul état vraiment "terminé avec succès".
  const cls = { demande:"pending", accepte:"info", loue:"active", retourne:"ok", refuse:"danger" }[status] || "none";
  return `<span class="status-pill ${cls}">${STATUS_LABELS[status] || status}</span>`;
}
function isProfileComplete(p){
  return !!(p && p.nom && p.prenom && p.date_naissance && p.telephone && p.adresse);
}
function clientDisplayName(p){
  if(!p) return "";
  const full = [p.prenom, p.nom].filter(Boolean).join(" ");
  return full || p.username;
}

function currentProfile(){ return state.profiles.find(p => p.username === state.session?.username) || null; }

/* ---------- Boot & data ---------- */
async function fetchAll(){
  const [profiles, items, bookings, tasks, completions, contracts, groups, rewards, redemptions] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('items').select('*').order('created_at'),
    sb.from('bookings').select('*'),
    sb.from('tasks').select('*').order('created_at'),
    sb.from('task_completions').select('*'),
    sb.from('contracts').select('*'),
    sb.from('mission_groups').select('*').order('created_at'),
    sb.from('rewards').select('*').order('created_at'),
    sb.from('reward_redemptions').select('*'),
  ]);
  state.profiles = profiles.data || [];
  state.items = items.data || [];
  state.bookings = bookings.data || [];
  state.tasks = tasks.data || [];
  state.completions = completions.data || [];
  state.contracts = contracts.data || [];
  state.mission_groups = groups.data || [];
  state.rewards = rewards.data || [];
  state.redemptions = redemptions.data || [];
}

async function boot(){
  if(SUPABASE_URL.includes("VOTRE-PROJET")){
    state.loading = false;
    state.fatalError = "Configuration Supabase manquante : ouvre le fichier et renseigne SUPABASE_URL et SUPABASE_ANON_KEY en haut du script.";
    render();
    return;
  }
  try{
    await fetchAll();
  }catch(e){
    state.loading = false;
    state.fatalError = "Impossible de contacter Supabase. Vérifie ton URL/clé et que le script SQL a bien été exécuté. (" + e.message + ")";
    render();
    return;
  }

  // Session administrateur (stockée localement, hors Supabase Auth)
  const savedAdmin = localStorage.getItem('ov_admin_session');
  if(savedAdmin){
    try{
      const parsed = JSON.parse(savedAdmin);
      const stillExists = state.profiles.find(p => p.username === parsed.username && p.is_master);
      if(stillExists){ state.session = { username: stillExists.username, isMaster:true }; }
      else localStorage.removeItem('ov_admin_session');
    }catch(e){ localStorage.removeItem('ov_admin_session'); }
  }

  // Session client (Supabase Auth)
  if(!state.session){
    const { data: { session } } = await sb.auth.getSession();
    if(session?.user?.email){
      await ensureClientProfile(session.user.email);
      state.session = { username: session.user.email, isMaster:false };
    }
  }

  state.loading = false;
  state.view = state.session?.isMaster ? "dashboard" : "accueil";
  render();
  subscribeRealtime();
  bootDone = true;
}

sb.auth.onAuthStateChange((event, session) => {
  if(!bootDone) return;
  if(event === 'SIGNED_IN' && session?.user?.email && (!state.session || state.session.isMaster === false)){
    ensureClientProfile(session.user.email).then(() => {
      state.session = { username: session.user.email, isMaster:false };
      render();
    });
  }
  if(event === 'SIGNED_OUT' && state.session && !state.session.isMaster){
    state.session = null; state.view = "accueil"; render();
  }
});

// render() reconstruit tout le innerHTML de la page : si un event Realtime arrive pendant que
// quelqu'un tape (ex. son email à la connexion), ça efface ce qui vient d'être tapé. On ne
// re-rend jamais tant qu'un champ a le focus — on retente juste un peu plus tard.
function isTypingInField(){
  const el = document.activeElement;
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'));
}
function renderUnlessTyping(){
  if(isTypingInField()){
    clearTimeout(window.__ovDeferredRenderTimer);
    window.__ovDeferredRenderTimer = setTimeout(renderUnlessTyping, 1500);
    return;
  }
  render();
}
function subscribeRealtime(){
  const channel = sb.channel('ov-sync');
  ['items','bookings','tasks','task_completions','contracts','profiles','mission_groups','rewards','reward_redemptions'].forEach(table => {
    channel.on('postgres_changes', { event:'*', schema:'public', table }, () => {
      clearTimeout(window.__ovSyncTimer);
      window.__ovSyncTimer = setTimeout(async () => {
        try{ await fetchAll(); renderUnlessTyping(); }catch(e){}
      }, 500);
    });
  });
  channel.subscribe();
}

/* ---------- Auth : clients (Supabase Auth + email) ---------- */
async function ensureClientProfile(email){
  const key = email.toLowerCase();
  let prof = state.profiles.find(p => p.username.toLowerCase() === key);
  const now = new Date().toISOString();
  if(!prof){
    const { data, error } = await sb.from('profiles').insert({ username: email, is_master:false, xp:0, created_at: now, last_login: now }).select().single();
    if(!error){ state.profiles.push(data); prof = data; }
  } else {
    await sb.from('profiles').update({ last_login: now }).eq('username', prof.username);
    prof.last_login = now;
  }
  return prof;
}

async function doClientLogin(email, password){
  email = email.trim().toLowerCase();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    state.authError = /confirm/i.test(error.message)
      ? "Merci de confirmer votre adresse email avant de vous connecter (vérifiez votre boîte mail, y compris les spams)."
      : "Email ou mot de passe incorrect.";
    render(); return;
  }
  await ensureClientProfile(email);
  state.session = { username: email, isMaster:false };
  state.authError = ""; state.authNotice = ""; state.profileNotice = ""; state.docError = "";
  state.view = "accueil";
  render();
}

async function doClientRegister(email, password, password2){
  email = email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.authError = "Merci d'indiquer une adresse email valide."; render(); return; }
  if(password.length < 6){ state.authError = "Le mot de passe doit faire au moins 6 caractères."; render(); return; }
  if(password !== password2){ state.authError = "Les mots de passe ne correspondent pas."; render(); return; }
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: SITE_URL }
  });
  if(error){
    if(/rate limit|only request this after/i.test(error.message)){
      state.authError = "Trop de tentatives rapprochées. Merci de patienter une minute avant de réessayer, ou utilisez « Renvoyer l'email de confirmation » ci-dessous.";
    } else {
      state.authError = "Erreur lors de la création du compte : " + error.message;
    }
    render(); return;
  }
  state.authError = "";
  if(data.session){
    await ensureClientProfile(email);
    state.session = { username: email, isMaster:false };
    state.view = "accueil";
    render();
    return;
  }
  // Supabase renvoie un "utilisateur" sans identités quand le compte existe déjà mais n'est pas confirmé :
  // dans ce cas on force nous-même un renvoi d'email, car un signUp répété ne le fait pas toujours de façon fiable.
  const alreadyExists = data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0;
  if(alreadyExists){
    const { error: resendErr } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: SITE_URL } });
    state.authNotice = resendErr
      ? "Un compte existe déjà avec cet email mais n'est pas confirmé, et le renvoi automatique a échoué (" + resendErr.message + "). Utilisez le bouton « Renvoyer l'email de confirmation »."
      : "Un compte existait déjà avec cet email mais n'était pas confirmé : nous venons de renvoyer l'email de confirmation à " + email + ".";
  } else {
    state.authNotice = "Un email de confirmation vient d'être envoyé à " + email + ". Ouvrez-le, cliquez sur le lien, puis connectez-vous ici.";
  }
  state.lastRegisterEmail = email;
  state.authTab = "login";
  render();
}

async function resendConfirmationEmail(email){
  email = (email || state.lastRegisterEmail || "").trim().toLowerCase();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    state.authError = "Merci d'indiquer votre adresse email dans le champ ci-dessus, puis de cliquer à nouveau sur « Renvoyer l'email de confirmation ».";
    render(); return;
  }
  state.authError = ""; state.authNotice = "Envoi en cours...";
  render();
  const { error } = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: SITE_URL } });
  if(error){
    if(/rate limit|only request this after/i.test(error.message)){
      state.authNotice = "";
      state.authError = "Merci de patienter un peu avant de redemander un nouvel email (limite anti-spam).";
    } else {
      state.authNotice = "";
      state.authError = "Erreur lors du renvoi : " + error.message;
    }
  } else {
    state.authNotice = "Email de confirmation renvoyé à " + email + ". Pensez à vérifier vos spams.";
  }
  render();
}

/* ---------- Auth : équipe (identifiant/mot de passe local) ---------- */
async function doAdminLogin(username, password){
  const match = state.profiles.find(p => p.is_master && p.username.toLowerCase() === username.trim().toLowerCase() && p.password === password);
  if(!match){ state.authError = "Identifiants incorrects."; render(); return; }
  const now = new Date().toISOString();
  await sb.from('profiles').update({ last_login: now }).eq('username', match.username);
  match.last_login = now;
  state.session = { username: match.username, isMaster:true };
  localStorage.setItem('ov_admin_session', JSON.stringify(state.session));
  state.authError = ""; state.profileNotice = ""; state.docError = "";
  state.view = "dashboard";
  render();
}

function logout(){
  state.profileNotice = ""; state.docError = ""; state.gestionSearch = ""; state.gestionFilter = "all"; state.validationSearch = ""; state.usersSearch = "";
  if(state.session?.isMaster){
    localStorage.removeItem('ov_admin_session');
    state.session = null; state.view = "accueil"; render();
  } else {
    sb.auth.signOut().finally(() => { state.session = null; state.view = "accueil"; render(); });
  }
}

/* ---------- Level up feedback ---------- */
function checkLevelUp(oldXp, newXp){
  if(levelFor(newXp) > levelFor(oldXp)) showLevelUpToast(levelFor(newXp), rankFor(newXp), owlTierForRankIndex(rankIndexFor(newXp)));
}
// Créé via document.createElement, hors du cycle de render() -> seul endroit où une animation
// d'entrée (pop + anneau de burst, toutes deux à durée finie) ne se rejoue pas à chaque mise à
// jour realtime : voir la note dans le CSS "Hero XP" plus haut.
function showLevelUpToast(level, rank, tier){
  const pal = tierPalette(tier || 1);
  const el = document.createElement('div');
  el.className = 'levelup-toast';
  el.style.setProperty('--tier', pal.color);
  el.style.setProperty('--tier-soft', pal.soft);
  el.innerHTML = `<div class="levelup-badge">${owlIconSvg(tier || 1, { size:27, elite: tier===4 })}</div><div><div class="levelup-title">Niveau ${level} !</div><div class="levelup-sub">${esc(rank)}</div></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 2600);
}
// Toast d'erreur générique : garantit qu'une erreur reste visible même si aucune modale n'est ouverte
// pour afficher le state.xError correspondant (ex. clic direct sur "Marquer accomplie" sans modale).
function showErrorToast(message){
  const el = document.createElement('div');
  el.className = 'levelup-toast error-toast';
  el.innerHTML = `<div class="levelup-badge">⚠️</div><div><div class="levelup-title">Erreur</div><div class="levelup-sub">${esc(message)}</div></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 5000);
}
async function grantXp(username, amount){
  const prof = state.profiles.find(p => p.username === username);
  if(!prof) return;
  const oldXp = prof.xp;
  const newXp = oldXp + amount;
  await sb.from('profiles').update({ xp: newXp }).eq('username', username);
  prof.xp = newXp;
  if(username === state.session?.username) checkLevelUp(oldXp, newXp);
}
async function resetUserToLevel1(username){
  if(!state.session.isMaster) return;
  const prof = state.profiles.find(p => p.username === username);
  if(!prof) return;
  if(!confirm(`Réinitialiser ${clientDisplayName(prof)} au niveau 1 (0 XP) ? Son historique de missions et récompenses reste conservé.`)) return;
  const { error } = await sb.from('profiles').update({ xp: 0 }).eq('username', username);
  if(error){ alert("Erreur : " + error.message); return; }
  prof.xp = 0;
  render();
}

/* ---------- Bookings ---------- */
function overlaps(aStart, aEnd, bStart, bEnd){ return aStart <= bEnd && bStart <= aEnd; }
function activeBookingsCount(itemId, start, end){
  // Seules les locations pas encore refusées / retournées bloquent le stock disponible.
  return state.bookings.filter(b => b.item_id === itemId && ['demande','accepte','loue'].includes(b.status) && overlaps(b.start_date, b.end_date, start, end)).length;
}
const MIN_BOOKING_DAYS = 3;
async function submitBooking(itemId, start, end){
  const item = state.items.find(i => i.id === itemId);
  if(!item) return;
  const u = currentProfile();
  if(!isProfileComplete(u)){ state.bookingError = "Merci de compléter votre fiche membre avant de réserver."; render(); return; }

// Une soumission "en attente" ou déjà "validée" bloque une nouvelle tentative ; une mission "refusée" peut être
// retentée. Exception : une mission marquée "récurrente" par le master redevient disponible une fois validée
// et l'XP créditée — seule une soumission "en attente" la bloque encore (pour éviter un double envoi).
function blockingCompletion(taskId, username){
  const c = state.completions.find(x => x.task_id === taskId && x.username === username && (x.status === 'attente' || x.status === 'validee'));
  if(c && c.status === 'validee'){
    const task = state.tasks.find(t => t.id === taskId);
    if(task && task.is_recurring) return null;
  }
  return c;
}

}
// NOTE : nommée différemment de son export "window.completeTask" ci-dessous exprès.
// Bug corrigé ici (cause racine des missions qui ne réagissaient pas au clic) : quand la fonction interne et
// l'export window portaient le même nom "completeTask", l'affectation "window.completeTask = ..." écrasait aussi
// la référence globale "completeTask" (les déclarations de fonction top-level d'un script classique sont liées à
// window). Tout appel ultérieur à l'identifiant nu "completeTask(...)" rappelait alors la fonction wrapper
// elle-même en boucle infinie (RangeError silencieux, sans retour visible pour l'utilisateur).
async function submitTaskCompletion(taskId, answer){
  const task = state.tasks.find(t => t.id === taskId);
  if(!task || blockingCompletion(taskId, state.session.username)) return;
  const username = state.session.username;
  // La table a une contrainte unique (task_id, username) : un client ne peut avoir qu'UNE ligne par
  // mission, jamais deux. Un "insert" classique échouait donc silencieusement dès qu'un client retentait
  // une mission déjà refusée (ou recliquait après un premier essai) — "duplicate key value violates unique
  // constraint". On utilise un upsert pour réécrire cette même ligne (nouvel essai = même ligne remise à
  // "attente"), ce qui est aussi ce qui permet réellement le "Retenter" après refus.
  const { data, error } = await sb.from('task_completions').upsert({
    task_id: taskId, username, answer: answer || null,
    status: 'attente', client_seen: true, completed_at: new Date().toISOString()
  }, { onConflict: 'task_id,username' }).select().single();
  if(error){ state.answerError = "Erreur : " + error.message; showErrorToast(error.message); render(); return; }
  const idx = state.completions.findIndex(c => c.task_id === taskId && c.username === username);
  if(idx > -1) state.completions[idx] = data; else state.completions.push(data);
  state.answerError = "";
  state.modal = null;
  render();
}

// Contrat type — génération personnalisée par client (Lot 9) : le master ne téléverse plus un

// et recherchable, contrairement à un rendu HTML→image). La mise en page s'écoule normalement
// d'article en article et le bloc de clôture ("Fait à…" + signatures) est marqué "unbreakable" :

//
// ⚠️ Champs constants ci-dessous (identiques sur tous les contrats, jamais propres à un client) :

// Document juridique généré via pdfmake (PDF vectoriel, texte réellement sélectionnable/
// recherchable — contrairement à un rendu HTML→image). Le texte de chaque article est repris
// mot pour mot du contrat de référence fourni par le master ; seuls les champs variables
// ({{...}} dans l'ancienne version HTML) sont désormais des valeurs JS insérées directement.
const J = (text, extra) => Object.assign({ text, alignment: 'justify', margin: [0, 0, 0, 8] }, extra || {});
const ART = (n, title) => ({ text: `Article ${n} — ${title}`, bold: true, fontSize: 11.3, margin: [0, 14, 0, 6] });
const NB = (s) => String(s == null ? '—' : s).replace(/ $/, '') + ' '; // espace insécable avant "€", "jour(s)", etc.

function etatRowCells(selected){
  const options = ['Neuf', 'Bon état', "État d'usage", 'Très usagé', 'Absent'];
  return options.map(o => ({ text: o === selected ? 'X' : '', bold: true, alignment: 'center' }));
}

function buildContractDocDefinition(fields){
  const f = fields;
  return {
    pageSize: 'A4',
    pageMargins: [56, 54, 56, 54],
    defaultStyle: { fontSize: 9.6, lineHeight: 1.22 },
    // Logo Owls Vision grisé, discret, en fond de chaque page (le niveau de gris/transparence
    // est déjà "cuit" dans le PNG lui-même, pas besoin de propriété opacity supplémentaire).
    images: { watermarkLogo: CONTRACT_WATERMARK_LOGO },
    background: function(currentPage, pageSize){
      const w = 360;
      return { image: 'watermarkLogo', width: w, absolutePosition: { x: (pageSize.width - w) / 2, y: (pageSize.height - w) / 2 } };
    },
    content: [
      { text: 'CONTRAT DE LOCATION DE MATÉRIEL DE VISION NOCTURNE', bold: true, fontSize: 14.5, alignment: 'center', margin: [0, 0, 0, 3] },
      { text: 'Conclu entre un professionnel et un consommateur — Code civil et Code de la consommation', italics: true, fontSize: 8.6, color: '#333333', alignment: 'center', margin: [0, 0, 0, 16] },

      J('Entre les soussignés :'),

      { text: 'LE PROPRIÉTAIRE', bold: true, decoration: 'underline', margin: [0, 4, 0, 4] },
      J([
        'OWLS VISION, société par actions simplifiée unipersonnelle (SASU) au capital social de ',
        { text: NB(f.owner_capital_social) + '€', bold: true }, ', immatriculée au Registre du Commerce et des Sociétés de ',
        { text: f.owner_ville_rcs, bold: true }, ' sous le numéro SIREN 953 642 535 (SIRET 953 642 535 00017), dont le siège social est situé ',
        { text: f.owner_adresse_siege, bold: true }, ", numéro de TVA intracommunautaire FR82107779795, représentée aux fins des présentes par M. Luka Zampieri, agissant en qualité de Président, dûment habilité.",
      ]),
      J("Établissement d'exploitation : 198 chemin des Vernèdes, 83480 Puget-sur-Argens — Tél. : 06 61 52 78 57 — Email dédié à la location : rental@owlsvision.fr"),
      J([{ text: 'Ci-après dénommée "le Propriétaire".', italics: true }]),

      { text: 'LE LOCATAIRE', bold: true, decoration: 'underline', margin: [0, 4, 0, 4] },
      J(`${f.locataire_nom}, demeurant ${f.locataire_adresse} — Tél. : ${f.locataire_tel} — Email : ${f.locataire_email} — Titulaire de la pièce d'identité n° ${f.locataire_cni}, dont une copie est conservée par le Propriétaire dans les conditions de l'article 13 ci-après.`),
      J([{ text: 'Ci-après dénommé "le Locataire".', italics: true }]),

      J([{ text: 'Le Propriétaire et le Locataire étant ci-après collectivement désignés "les Parties" ou individuellement une "Partie".', italics: true }]),
      J("Le Locataire agit en qualité de consommateur, pour un usage strictement personnel et non professionnel du matériel loué. Le présent contrat est en conséquence soumis, en complément du droit commun de la location, aux dispositions protectrices du Code de la consommation."),
      J("Par les présentes, les Parties entendent définir les conditions et modalités selon lesquelles le Propriétaire donne en location au Locataire, pour une durée déterminée, le matériel lui appartenant décrit à l'article 1. Les Parties conviennent que leurs relations sont régies par les présentes dispositions, à l'exclusion de tout autre accord écrit ou oral antérieur portant sur le même objet."),

      ART(1, 'Désignation du matériel loué'),
      {
        table: {
          widths: ['34%', '*'],
          body: [
            [{ text: 'Catégorie', bold: true, fillColor: '#f4f4f2' }, f.item_categorie],
            [{ text: 'Description', bold: true, fillColor: '#f4f4f2' }, f.item_description],
            [{ text: 'Valeur de référence contractuelle', bold: true, fillColor: '#f4f4f2' }, `${f.item_valeur_ref} € — cette valeur sert de base au calcul de toute indemnisation due au titre des articles 5 et 6 en cas de perte totale, vol ou destruction.`],
            [{ text: "Précautions d'utilisation", bold: true, fillColor: '#f4f4f2' }, "Ne jamais exposer les tubes à une source lumineuse intense (soleil, projecteurs) ; conserver le matériel dans son étui ou volet de protection fermé en dehors de toute utilisation nocturne."],
            [{ text: 'Clause particulière', bold: true, fillColor: '#f4f4f2' }, 'Le matériel ne peut, sous aucun prétexte, être prêté, cédé ou confié à un tiers, y compris temporairement.'],
          ],
        },
        margin: [0, 2, 0, 10],
      },

      ART(2, 'État du matériel et état des lieux'),
      J("Le Locataire prend le matériel dans l'état où il se trouve au jour de sa remise par le Propriétaire. Le Propriétaire garantit au Locataire que le matériel loué est en parfait état de marche à cette date. Si les informations données par le Propriétaire au Locataire se révèlent ultérieurement erronées ou inexactes, le Propriétaire ne pourra se prévaloir des clauses relatives aux dommages causés par le Locataire au matériel loué, sauf à démontrer que le dommage constaté est sans lien, direct ou indirect, avec ces informations."),
      J("Les Parties établissent conjointement, au jour de la remise, un état des lieux contradictoire signé par chacune d'elles. Un second état des lieux est établi dans les mêmes conditions lors de la restitution, conformément à l'article 11."),
      J([{ text: 'Date de remise : ', bold: true }, f.date_remise]),
      { text: 'Constat d\'état à la remise', bold: true, margin: [0, 0, 0, 4] },
      {
        table: {
          widths: ['24%', '*', '*', '*', '*', '*'],
          body: [
            [
              { text: '', fillColor: '#f4f4f2' },
              { text: 'Neuf', bold: true, alignment: 'center', fillColor: '#f4f4f2' },
              { text: 'Bon état', bold: true, alignment: 'center', fillColor: '#f4f4f2' },
              { text: "État d'usage", bold: true, alignment: 'center', fillColor: '#f4f4f2' },
              { text: 'Très usagé', bold: true, alignment: 'center', fillColor: '#f4f4f2' },
              { text: 'Absent', bold: true, alignment: 'center', fillColor: '#f4f4f2' },
            ],
            [{ text: 'Aspect extérieur', bold: true }, ...etatRowCells(f.etat_aspect)],
            [{ text: 'Fonctionnement', bold: true }, ...etatRowCells(f.etat_fonctionnement)],
          ],
        },
        fontSize: 9,
        margin: [0, 0, 0, 10],
      },

      ART(3, 'Prix de la location'),
      J([`La présente location est consentie et acceptée moyennant la somme de `, { text: `${f.prix_location} € TTC` }, `, payable comptant le jour de la remise du matériel, dans les conditions de règlement fixées à l'article 5.3.`]),
      J("Les frais de transport éventuellement supportés par le Locataire pour récupérer et restituer le matériel loué ne sont pas compris dans ce prix et restent à sa charge exclusive."),

      ART(4, 'Durée du contrat de location'),
      J("Le matériel décrit à l'article 1 est loué :"),
      J(`Du ${f.date_debut} au ${f.date_fin}, soit une durée de ${f.duree_jours} jour(s), au tarif journalier de référence de ${f.tarif_jour} €, soit la somme totale de ${f.prix_total} € fixée à l'article 3.`),
      J("Les lieux de remise et de restitution du matériel loué sont déterminés d'un commun accord entre les Parties."),
      J(`Tout dépassement de la durée de location initialement prévue est facturé au tarif de ${f.tarif_depassement} €/jour et devra être réglé par le Locataire, sans préjudice de l'application de l'article 6 si le dépassement s'accompagne d'une absence de restitution.`),

      ART(5, 'Garantie locative et règlement'),
      J([
        { text: "5.1 Attestation d'assurance habitation — garantie principale. ", bold: true },
        "Préalablement à la remise du matériel, le Locataire s'engage à fournir au Propriétaire une attestation d'assurance multirisque habitation en cours de validité, comportant une garantie \"responsabilité civile vie privée\". Il appartient exclusivement au Locataire de vérifier, auprès de son propre assureur, que cette garantie couvre les dommages, la perte ou le vol de biens qui lui sont confiés, prêtés ou loués par un tiers, et de fournir au besoin toute précision utile sur l'étendue de cette couverture.",
      ]),
      J(`Les Parties conviennent que la valeur de référence contractuelle du matériel loué, fixée à l'article 1 à la somme de ${f.item_valeur_ref} €, sert de base au calcul de l'indemnité due par le Locataire, ou par son assureur au titre de la garantie ci-dessus, en cas de perte totale, vol ou destruction, dans les conditions de l'article 6.`),
      J([
        { text: '5.2 Faculté de garantie bancaire complémentaire. ', bold: true },
        "Le Propriétaire se réserve le droit d'exiger du Locataire, en complément ou à défaut d'attestation d'assurance valable, une pré-autorisation (empreinte bancaire) d'un montant qu'il détermine et communique au Locataire avant la remise du matériel, notamment dans les cas suivants : absence d'attestation d'assurance habitation en cours de validité au jour de la remise, doute raisonnable sur l'étendue de la couverture présentée, ou antécédent de dégradation ou de non-restitution du matériel lors d'une location précédente. Cette pré-autorisation, lorsqu'elle est demandée, est libérée dans un délai de 5 jours ouvrés suivant la restitution du matériel en bon état, constatée par l'état des lieux de sortie prévu à l'article 11.",
      ]),
      J([
        { text: '5.3 Règlement du prix de la location. ', bold: true },

// Réservation la plus pertinente pour rédiger le contrat d'un client : la plus récente en
// cours (louée) ou tout juste acceptée ; à défaut, sa réservation la plus récente quelle que
// soit son statut. Le master peut toujours changer de réservation ou ajuster les champs dans
// la fenêtre de génération avant de valider.
function latestRelevantBookingFor(username){
  const mine = state.bookings.filter(b => b.username === username);
  if(!mine.length) return null;
  const priority = { loue: 3, accepte: 2, demande: 1, retourne: 0, refuse: 0 };
  return mine.slice().sort((a,b) => {
    const pd = (priority[b.status]||0) - (priority[a.status]||0);
    if(pd !== 0) return pd;
    return (b.created_at||'').localeCompare(a.created_at||'');
  })[0];
}
async function generateClientContract(username, fields){
  const dd = buildContractDocDefinition(fields);
  const blob = await window.pdfMake.createPdf(dd).getBlob();
  const path = `${username}/original.pdf`;
  const { error: upErr } = await sb.storage.from('contracts').upload(path, blob, { upsert: true, contentType: 'application/pdf' });
  if(upErr) throw upErr;
  await sb.storage.from('contracts').remove([`${username}/signed.pdf`]);
  const ok = await finalizeContractAssignment(username, path);
  return ok;
}
async function masterDeleteContract(username){
  if(!confirm(`Supprimer le contrat de "${username}" (original + version signée) ?`)) return;
  await sb.storage.from('contracts').remove([`${username}/original.pdf`, `${username}/signed.pdf`]);

async function uploadMemberDoc(kind, file, username){
  const def = MEMBER_DOC_DEFS[kind];
  if(!def || !file) return;
  const okType = /^image\//.test(file.type) || file.type === 'application/pdf';
  if(!okType){ state.docError = "Format non supporté : merci d'envoyer une photo (JPG/PNG) ou un PDF."; render(); return; }
  const storagePath = `${username}/${kind}_doc`;
  const { error: upErr } = await sb.storage.from('documents').upload(storagePath, file, { upsert: true, contentType: file.type });
  if(upErr){ state.docError = "Erreur d'envoi : " + upErr.message; showErrorToast(upErr.message); render(); return; }
  const payload = { [def.pathCol]: storagePath, [def.dateCol]: new Date().toISOString() };

  if(error){ state.docError = "Erreur : " + error.message; showErrorToast(error.message); render(); return; }
  const p = state.profiles.find(x => x.username === username);
  if(p) Object.assign(p, data);
  state.docError = "";
  render();
}

let sigCtx = null, sigDrawing = false, sigHasInk = false;
function openSignaturePad(){
  const contract = state.contracts.find(c => c.username === state.session.username);
  if(!contract) return;
  const wrap = document.createElement('div');
  wrap.className = 'modal-full';

    <div class="modal-full-bar">

      </p>

      <div class="section-title">Votre signature</div>
      <div class="sig-pad-wrap"><canvas id="sig-canvas"></canvas></div>

      <label class="check-row"><input type="checkbox" id="sig-accept"> J'ai lu ce contrat et j'en accepte les termes.</label>
      <div id="sig-error"></div>
      <button class="btn btn-primary" onclick="submitSignature()" style="width:100%;margin-top:4px;">Valider et signer</button>
      <button class="btn btn-ghost" onclick="closeSignaturePad()" style="width:100%;margin-top:10px;">Retour</button>
    </div>
  `;
  document.body.appendChild(wrap);
  initSignaturePad();
}
window.closeSignaturePad = () => { const el = document.getElementById('sig-modal'); if(el) el.remove(); };
function initSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.fillStyle = '#ffffff';
  sigCtx.fillRect(0, 0, rect.width, rect.height);
  sigCtx.lineWidth = 2.4;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigCtx.strokeStyle = '#111111';
  sigHasInk = false;
  const pos = (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
  const start = (e) => { e.preventDefault(); sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  const move = (e) => { if(!sigDrawing) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHasInk = true; };
  const end = () => { sigDrawing = false; };
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
}
window.clearSignature = () => {
  const c = document.getElementById('sig-canvas'); if(!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, c.width, c.height);
  sigHasInk = false;
};
async function submitSignature(){
  const errEl = document.getElementById('sig-error');
  const accept = document.getElementById('sig-accept');
  if(!sigHasInk){ errEl.innerHTML = `<div class="msg msg-error">Merci de dessiner votre signature.</div>`; return; }
  if(!accept.checked){ errEl.innerHTML = `<div class="msg msg-error">Merci de cocher la case d'acceptation.</div>`; return; }
  errEl.innerHTML = "";
  const btn = event.target; const oldLabel = btn.textContent; btn.textContent = "Signature en cours..."; btn.disabled = true;
  try{
    const canvas = document.getElementById('sig-canvas');
    const dataUrl = canvas.toDataURL('image/png');
    const contract = state.contracts.find(c => c.username === state.session.username);
    const resp = await fetch(contract.pdf_path);
    const bytes = await resp.arrayBuffer();
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.load(bytes);
    const pngImage = await pdfDoc.embedPng(dataUrl);
    const pages = pdfDoc.getPages();
    const lastPage = pages[pages.length - 1];
    const { width } = lastPage.getSize();
    const dims = pngImage.scale(0.35);
    lastPage.drawImage(pngImage, { x: width - dims.width - 50, y: 60, width: dims.width, height: dims.height });
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const signDate = new Date();
    const dateStr = signDate.toLocaleDateString('fr-FR');
    const timeStr = signDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    lastPage.drawText(`Signe electroniquement par ${state.session.username} le ${dateStr} a ${timeStr}`, { x: 50, y: 40, size: 9, font, color: rgb(0,0,0) });
    const signedBytes = await pdfDoc.save();
    const blob = new Blob([signedBytes], { type: 'application/pdf' });
    const signedPath = `${state.session.username}/signed.pdf`;
    const { error: upErr } = await sb.storage.from('contracts').upload(signedPath, blob, { upsert: true, contentType: 'application/pdf' });
    if(upErr) throw upErr;
    const { data: pub } = sb.storage.from('contracts').getPublicUrl(signedPath);
    const { data, error } = await sb.from('contracts').update({ signed_pdf_path: pub.publicUrl + '?v=' + Date.now(), signed_at: new Date().toISOString(), signed_seen_by_master: false }).eq('username', state.session.username).select().single();
    if(error) throw error;
    const idx = state.contracts.findIndex(c => c.username === state.session.username);
    state.contracts[idx] = data;
    const dlUrl = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = dlUrl; a.download = `contrat-signe-${state.session.username}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    closeSignaturePad();
    render();
  }catch(e){
    errEl.innerHTML = `<div class="msg msg-error">Erreur lors de la signature : ${esc(e.message||String(e))}</div>`;
    btn.textContent = oldLabel; btn.disabled = false;
  }
}

  const errEl = document.getElementById('gc-error');
  const p = state.profiles.find(x => x.username === username);
  const fields = {
    owner_capital_social: CONTRACT_OWNER.capitalSocial,
    owner_ville_rcs: CONTRACT_OWNER.villeRCS,
    owner_adresse_siege: CONTRACT_OWNER.adresseSiege,
    owner_mediateur: CONTRACT_OWNER.mediateur,
    locataire_nom: clientDisplayName(p) || username,
    locataire_adresse: p.adresse || '—',
    locataire_tel: p.telephone || '—',
    locataire_email: username,
    locataire_cni: p.numero_cni || '—',
    item_categorie: document.getElementById('gc-categorie').value.trim() || '—',
    item_description: document.getElementById('gc-description').value.trim() || '—',
    item_valeur_ref: fmtDecimalFr(document.getElementById('gc-valeur-ref').value),
    date_remise: fmtDate(document.getElementById('gc-date-remise').value),
    etat_aspect: document.getElementById('gc-etat-aspect').value,
    etat_fonctionnement: document.getElementById('gc-etat-fonctionnement').value,
    prix_location: fmtDecimalFr(document.getElementById('gc-prix').value),
    prix_total: fmtDecimalFr(document.getElementById('gc-prix').value),
    date_debut: fmtDate(document.getElementById('gc-date-debut').value),
    date_fin: fmtDate(document.getElementById('gc-date-fin').value),
    duree_jours: document.getElementById('gc-duree').value || '—',
    tarif_jour: (() => { const p2 = Number(document.getElementById('gc-prix').value)||0; const d = Number(document.getElementById('gc-duree').value)||1; return fmtDecimalFr((p2/d).toFixed(2)); })(),
    tarif_depassement: fmtDecimalFr(document.getElementById('gc-tarif-depassement').value),
    lieu_signature: document.getElementById('gc-lieu').value.trim() || CONTRACT_OWNER.lieuSignatureDefaut,
    date_signature: fmtDate(document.getElementById('gc-date-signature').value),
  };
  const btn = e.target; const oldLabel = btn.textContent; btn.textContent = "Génération en cours..."; btn.disabled = true;
  try{
    const ok = await generateClientContract(username, fields);
    if(ok){ state.modal = null; render(); }
    else { btn.textContent = oldLabel; btn.disabled = false; }
  }catch(err){
    errEl.innerHTML = `<div class="msg msg-error">Erreur lors de la génération : ${esc(err.message||String(err))}</div>`;
    btn.textContent = oldLabel; btn.disabled = false;
  }
};

// XP "en attente" : missions soumises par le client mais pas encore validées par le master.
// Affichée en gris derrière la barre verte, pour montrer où l'XP arrivera une fois validée.
function pendingXp(username){
  return state.completions
    .filter(c => c.username === username && c.status === 'attente')
    .reduce((sum, c) => {
      const t = state.tasks.find(x => x.id === c.task_id);
      return sum + (t ? (t.xp_reward || 0) : 0);
    }, 0);
}
function xpProgressBarHtml(pctActual, pctPending, extraClass){
  return `<div class="xp-bar-track ${extraClass||''}">
    ${pctPending > pctActual ? `<div class="xp-bar-pending" style="width:${pctPending}%"></div>` : ''}
    <div class="xp-bar-fill" style="width:${pctActual}%"></div>
  </div>`;
}
function ranksRoadmapHtml(xp){
  const curIdx = rankIndexFor(xp);
  return `
    <div class="ranks-roadmap">
      ${RANKS.map((r, i) => `
        <div class="rank-step ${i<curIdx?'done':i===curIdx?'current':'locked'}">
          <div class="rank-icon">${owlIconSvg(owlTierForRankIndex(i), { size:22, elite: i===RANKS.length-1 })}</div>
          <div class="rank-name">${i<curIdx?'✓ ':''}${esc(r.name)}</div>
          <div class="rank-xp">${r.min} XP</div>
        </div>`).join('')}
    </div>`;
}
function xpBarHtml(u){
  if(!u || u.is_master) return "";
  const lvl = levelFor(u.xp), rank = rankFor(u.xp), inLevel = xpInLevel(u.xp);
  const pct = Math.round((inLevel / XP_STEP) * 100);
  const pendingPct = Math.min(100, Math.round(((inLevel + pendingXp(u.username)) / XP_STEP) * 100));
  return `
    <div class="xp-card"${tierStyleAttr(u)}>
      <div class="xp-top"><span class="xp-rank">Niv. ${lvl} — ${esc(rank)}</span><span class="xp-num">${inLevel} / ${XP_STEP} XP</span></div>
      ${xpProgressBarHtml(pct, pendingPct)}
    </div>`;
}
